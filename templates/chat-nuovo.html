<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chiedi a Matter</title>
<meta name="description" content="Chiedi a Matter — risponde sulla scienza del mestiere, ancorato ai dati di Matter. Un aiuto, non un oracolo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Schibsted+Grotesk:wght@500;700;800&display=swap">
<link rel="stylesheet" href="/static/matter-v5.css">
<style>
  /* Chat in v5: carta, verde accento, strumento scuro mai qui (nessuna misura).
     Markup e JS invariati: queste classi ridefiniscono solo l'aspetto. */
  :root{ --r-pill:999px; --tint:var(--verde-tint); --err:#a8504a; }
  html,body{height:100%}
  body{display:flex; flex-direction:column; min-height:100dvh; background:var(--paper)}

  /* barra in alto */
  .topbar{border-bottom:1px solid var(--rule)}
  .topbar-in{max-width:var(--maxw); margin:0 auto; display:flex; align-items:center; gap:14px;
    padding:16px max(16px,env(safe-area-inset-left,0px))}
  .wm{font-family:var(--display); font-weight:700; font-size:19px; letter-spacing:-.02em; text-decoration:none; color:var(--ink); display:inline-flex; gap:6px; align-items:baseline}
  .wm .bench{background:var(--verde); color:#fff; border-radius:5px; padding:2px 8px 3px; font-size:14px; font-weight:600}
  .eyebrow{font-size:13.5px; color:var(--soft)}

  .chat-shell{flex:1 1 auto; display:flex; flex-direction:column; min-height:0;
    max-width:var(--maxw); width:100%; margin:0 auto;
    padding-left:max(20px,env(safe-area-inset-left,0px));
    padding-right:max(20px,env(safe-area-inset-right,0px));}

  /* intestazione onesta */
  .chat-intro{background:var(--panel); border:1px solid var(--rule); border-radius:13px;
    padding:14px 16px; margin:16px 0 0; font-size:14px; color:var(--ink); line-height:1.55; max-width:40em}
  .chat-intro strong{font-family:var(--display); font-weight:700}

  /* chip d'esempio */
  .chat-esempi{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 0}
  .chat-chip{font-family:var(--sans); font-size:13.5px; color:var(--verde); background:var(--verde-tint);
    border:1px solid var(--rule); border-radius:999px; padding:8px 14px; cursor:pointer; line-height:1.25; text-align:left}
  .chat-chip:hover{border-color:var(--verde)}
  .chat-chip:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
  /* "Esplora": nodi collegati con lab non vuoto (navigabili). Niente link verso pagine vuote. */
  .conn-row{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:2px 0 14px; padding:0 2px}
  .conn-lab{font-size:12.5px; color:var(--soft)}
  .conn-chip{font-family:var(--sans); font-size:13px; color:var(--verde); background:var(--verde-tint);
    border:1px solid transparent; border-radius:999px; padding:5px 12px; text-decoration:none; line-height:1.25}
  .conn-chip:hover{border-color:var(--verde)}
  .conn-chip:focus-visible{outline:2px solid var(--ink); outline-offset:2px}

  /* lista messaggi */
  .chat-lista{flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden;
    display:flex; flex-direction:column; gap:10px; padding:18px 0 12px}

  .bolla{max-width:84%; padding:12px 15px; border-radius:15px; font-size:15.5px; line-height:1.5; color:var(--ink);
    white-space:pre-wrap; word-wrap:break-word; overflow-wrap:anywhere}
  .bolla--utente{align-self:flex-end; background:var(--verde); color:#fff; border-bottom-right-radius:5px}
  .bolla--matter{align-self:flex-start; background:var(--panel); border:1px solid var(--rule); border-bottom-left-radius:5px}
  .bolla--nota{align-self:flex-start; background:var(--verde-tint); border:1px solid var(--rule);
    color:var(--soft); font-size:13.5px; max-width:84%; padding:11px 14px; border-radius:13px; line-height:1.5}
  .bolla--errore{align-self:flex-start; background:var(--panel); border:1px solid var(--err);
    color:var(--err); font-size:14.5px; max-width:84%; padding:12px 15px; border-radius:13px; line-height:1.5}

  /* puntini "sto pensando" */
  .pensa{align-self:flex-start; display:inline-flex; gap:5px; padding:14px 16px;
    background:var(--panel); border:1px solid var(--rule); border-radius:15px; border-bottom-left-radius:5px}
  .pensa span{width:7px; height:7px; border-radius:50%; background:var(--soft); opacity:.4; animation:pensa 1s infinite ease-in-out}
  .pensa span:nth-child(2){animation-delay:.16s}
  .pensa span:nth-child(3){animation-delay:.32s}
  @keyframes pensa{0%,80%,100%{opacity:.3; transform:translateY(0)}40%{opacity:.9; transform:translateY(-3px)}}
  @media (prefers-reduced-motion:reduce){.pensa span{animation:none}}

  /* barra input */
  .chat-barra{flex:0 0 auto; position:sticky; bottom:0;
    background:linear-gradient(to top, var(--paper) 60%, transparent);
    padding-top:10px; padding-bottom:max(14px,env(safe-area-inset-bottom,0px))}
  .chat-form{display:flex; gap:10px; align-items:flex-end}
  .chat-form textarea{flex:1 1 auto; min-width:0; resize:none; font-family:var(--sans); font-size:16px;
    color:var(--ink); background:var(--panel); border:1px solid var(--rule); border-radius:12px;
    padding:12px 15px; line-height:1.4; max-height:120px}
  .chat-form textarea::placeholder{color:var(--faint)}
  .chat-form textarea:focus{outline:none; border-color:var(--verde)}
  .chat-invia{flex:0 0 auto; background:var(--verde); color:#fff; border:0; border-radius:12px;
    padding:0 20px; height:48px; cursor:pointer; font-family:var(--sans); font-weight:600; font-size:15px}
  .chat-invia:hover:not(:disabled){background:#174a31}
  .chat-invia:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
  .chat-invia:disabled{opacity:.5; cursor:not-allowed}
  .chat-mic{flex:0 0 auto; width:48px; height:48px; display:inline-flex; align-items:center; justify-content:center;
    background:transparent; color:var(--verde); border:1px solid var(--verde); border-radius:12px; cursor:pointer}
  .chat-mic:hover{background:var(--verde-tint)}
  .chat-mic:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
  .chat-mic svg{width:19px; height:19px}
  .chat-mic.rec{background:var(--err); border-color:var(--err); color:#fff}
  .chat-mic.busy{opacity:.55; cursor:progress}

  /* stato vocale / media */
  .media-msg{margin:0 0 8px; font-size:13px; line-height:1.45; color:var(--soft);
    background:var(--panel); border:1px solid var(--rule); border-radius:10px; padding:10px 13px}
  .media-msg.err{color:var(--err); border-color:rgba(168,80,74,.32); background:rgba(168,80,74,.07)}
  .media-msg.ok{color:var(--verde); border-color:var(--verde); background:var(--verde-tint)}
  .media-msg a{color:inherit; text-decoration:underline; font-weight:600}
  .vo-lab{font-weight:600; color:var(--ink)}
  .vo-txt{color:var(--soft)}
  .vision-out{margin:0 0 8px; font-size:13.5px; line-height:1.5; color:var(--ink);
    background:var(--panel); border:1px solid var(--rule); border-radius:10px; padding:11px 13px}
  .vision-out.busy{opacity:.6}

  /* bottoni generici (usati dal foglio login) */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; font-family:var(--sans);
    font-weight:600; font-size:15px; color:#fff; background:var(--verde); border:0; border-radius:10px;
    padding:12px 20px; cursor:pointer; text-decoration:none}
  .btn:hover{background:#174a31}
  .btn--ghost{background:transparent; color:var(--ink); border:1px solid var(--rule)}
  .btn--ghost:hover{background:transparent; border-color:#c6c6b8}

  /* ===== foglio di LOGIN ===== */
  .ms-scrim{position:fixed; inset:0; z-index:60; background:rgba(18,26,20,.42);
    -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
    display:flex; align-items:flex-end; justify-content:center}
  @media (min-width:560px){.ms-scrim{align-items:center}}
  .ms-card{width:100%; max-width:420px; background:var(--paper); border:1px solid var(--rule);
    border-radius:16px 16px 0 0; box-shadow:0 -20px 60px -30px rgba(10,22,13,.5);
    padding:22px 18px max(20px,env(safe-area-inset-bottom,0px))}
  @media (min-width:560px){.ms-card{border-radius:16px; margin:0 16px}}
  .ms-card h2,.ms-title{font-family:var(--display); font-weight:800; font-size:21px; margin:0; color:var(--ink)}
  .ms-sub{font-size:13.5px; color:var(--soft); margin:6px 0 0; line-height:1.5}
  .ms-field,.ms-l-email,.ms-l-pw{display:block; margin-top:14px}
  .ms-field span,.ms-l-email span,.ms-l-pw span{display:block; font-size:12px; font-weight:600; color:var(--soft); margin-bottom:6px}
  .ms-field input,.ms-email,.ms-pw,.ms-l-email input,.ms-l-pw input{width:100%; font-family:var(--sans); font-size:16px; color:var(--ink);
    background:var(--panel); border:1px solid var(--rule); border-radius:10px; padding:12px 14px}
  .ms-field input:focus,.ms-email:focus,.ms-pw:focus,.ms-l-email input:focus,.ms-l-pw input:focus{outline:none; border-color:var(--verde)}
  .ms-msg{margin-top:12px; font-size:12.5px; line-height:1.4; color:var(--err); min-height:1px}
  .ms-actions{display:flex; gap:10px; margin-top:16px}
  .ms-note{margin-top:14px; font-size:12px; color:var(--soft); line-height:1.45; text-align:center}
  .ms-note a{color:var(--verde); text-decoration:underline; font-weight:600}
</style>

  <div class="topbar-in">
    <a class="wm" href="/nuovo" aria-label="Matter Bench — home">Matter<span class="bench">Bench</span></a>

<div class="chat-shell">

  <div class="chat-intro" data-i18n-html="intro">
    <strong>Chiedi a Matter</strong> — risponde sulla scienza del mestiere, ancorato ai dati di Matter. È un aiuto, non un oracolo.

  <div class="chat-esempi" id="chat-esempi" aria-label="Domande di esempio" data-i18n-aria="esempi_aria">

      <button class="chat-mic" id="btn-mic" type="button" aria-label="Parla al banco" title="Parla al banco" data-i18n-aria="mic_aria" data-i18n-title="mic_title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
      </button>
      <button class="chat-invia" id="invia" type="submit" data-i18n="invia">Chiedi</button>
    </form>
  </div>

</div>

<!-- i18n (it · en · es) — dizionario di pagina + motore condiviso (prima dell'IIFE: serve _L) -->
<script>
window.I18N_TITLE = {it:"Chiedi a Matter", en:"Ask Matter", es:"Pregunta a Matter"};
window.I18N_DICT = {
  tagline: {it:"la scienza del mestiere", en:"the science behind the craft", es:"la ciencia del oficio"},
  intro: {it:"<strong>Chiedi a Matter</strong> — risponde sulla scienza del mestiere, ancorato ai dati di Matter. È un aiuto, non un oracolo.", en:"<strong>Ask Matter</strong> — it answers on the science of the craft, anchored to Matter's data. It's a help, not an oracle.", es:"<strong>Pregunta a Matter</strong> — responde sobre la ciencia del oficio, anclado a los datos de Matter. Es una ayuda, no un oráculo."},
  lista_aria: {it:"Conversazione con Matter", en:"Conversation with Matter", es:"Conversación con Matter"},
  domanda_ph: {it:"Scrivi la tua domanda…", en:"Write your question…", es:"Escribe tu pregunta…"},
  domanda_aria: {it:"La tua domanda", en:"Your question", es:"Tu pregunta"},
  invia: {it:"Chiedi", en:"Ask", es:"Preguntar"},
  mic_aria: {it:"Parla: detta la domanda", en:"Speak: dictate your question", es:"Habla: dicta tu pregunta"},
  mic_title: {it:"Parla al banco", en:"Speak to the bench", es:"Habla al banco"},
  esempi_aria: {it:"Domande di esempio", en:"Example questions", es:"Preguntas de ejemplo"},
  chip1: {it:"Perché il mio sour è troppo dolce?", en:"Why is my sour too sweet?", es:"¿Por qué mi sour está demasiado dulce?"},
  chip2: {it:"Cosa si abbina al pomodoro?", en:"What pairs with tomato?", es:"¿Con qué marida el tomate?"},
  chip3: {it:"Acidità o asprezza?", en:"Acidity or sourness?", es:"¿Acidez o aspereza?"}
};
</script>
<script src="/static/i18n-nuovo.js"></script>

<script>
(function(){
  "use strict";

  var lista   = document.getElementById("lista");
  var form    = document.getElementById("form");
  var input   = document.getElementById("domanda");
  var invia   = document.getElementById("invia");

  // history lato client: coppie {q, r} — il backend /chiedi legge h.q / h.r.
  var history = [];
  var inVolo  = false;

  // ── device id: UUID stabile in localStorage (riusa quello già salvato da altre pagine) ──
  function devId(){
    var id = null;
    try{
      id = localStorage.getItem("matter_device_id") || localStorage.getItem("matter_token");
    }catch(e){ /* storage non disponibile */ }
    if(!id){
      id = (window.crypto && crypto.randomUUID)
             ? crypto.randomUUID()
             : ("xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,function(c){
                 var r = Math.random()*16|0, v = c==="x" ? r : (r&0x3|0x8);
                 return v.toString(16);
               }));
      try{ localStorage.setItem("matter_device_id", id); }catch(e){ /* pazienza */ }
    }
    return id;
  }

  function scrollGiu(){ lista.scrollTop = lista.scrollHeight; }

  function _escHtml(s){
    return String(s == null ? "" : s).replace(/[&<>]/g, function(c){
      return c === "&" ? "&amp;" : c === "<" ? "&lt;" : "&gt;";
    });
  }
  // markdown minimo e SICURO (escape-first) per le risposte di Matter:
  // grassetto, corsivo, intestazioni, link, elenchi, a-capo.
  function mdToHtml(s){
    var t = _escHtml(s);
    t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    t = t.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>");
    t = t.replace(/^#{1,6}\s*(.+)$/gm, "<strong>$1</strong>");
    t = t.replace(/^[\-•]\s+(.+)$/gm, "• $1");
    t = t.replace(/\n/g, "<br>");
    return t;
  }

  function aggiungiBolla(testo, tipo){
    var el = document.createElement("div");
    el.className = "bolla bolla--" + tipo;
    if (tipo === "matter") { el.innerHTML = mdToHtml(testo); }
    else { el.textContent = testo; }
    lista.appendChild(el);
    scrollGiu();
    return el;
  }

  // "Esplora": mostra come chip cliccabili SOLO i connessi con lab non vuoto (navigabile===true).
  // Gli altri non compaiono: nessun link verso una pagina vuota (decisione di prodotto, opzione b).
  function aggiungiConnessi(connessi){
    if(!connessi || !connessi.length) return;
    var navig = connessi.filter(function(c){ return c && c.navigabile === true && c.nome; });
    if(!navig.length) return;
    var visti = {}, scelti = [];
    for(var i=0;i<navig.length && scelti.length<4;i++){
      var k = String(navig[i].nome).toLowerCase();
      if(visti[k]) continue; visti[k]=1; scelti.push(navig[i]);
    }
    var wrap = document.createElement("div");
    wrap.className = "conn-row";
    var lab = document.createElement("span");
    lab.className = "conn-lab";
    lab.textContent = _L({it:"Esplora:", en:"Explore:", es:"Explora:"});
    wrap.appendChild(lab);
    scelti.forEach(function(c){
      var nm = String(c.nome);
      var a = document.createElement("a");
      a.className = "conn-chip";
      a.href = "/lab/" + encodeURIComponent(nm);
      a.textContent = nm.charAt(0).toUpperCase() + nm.slice(1);
      wrap.appendChild(a);
    });
    lista.appendChild(wrap);
    scrollGiu();
  }

  function aggiungiNota(testo){
    var el = document.createElement("div");
    el.className = "bolla--nota";
    el.textContent = testo;
    lista.appendChild(el);
    scrollGiu();
  }

  function aggiungiErrore(testo){
    var el = document.createElement("div");
    el.className = "bolla--errore";
    el.textContent = testo;
    lista.appendChild(el);
    scrollGiu();
  }

  function mostraPensa(){
    var el = document.createElement("div");
    el.className = "pensa";
    el.setAttribute("aria-label", _L({it:"Matter sta pensando", en:"Matter is thinking", es:"Matter está pensando"}));
    el.innerHTML = "<span></span><span></span><span></span>";
    lista.appendChild(el);
    scrollGiu();
    return el;
  }

  function autosize(){
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  }
  input.addEventListener("input", autosize);

  // Invio con Enter (Shift+Enter = a capo)
  input.addEventListener("keydown", function(e){
    if(e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event("submit", {cancelable:true}));
    }
  });

  function bloccaInvio(b){
    inVolo = b;
    invia.disabled = b;
    input.disabled = b;
  }

  // chip di esempio: al tap precompilano l'input (non inviano). Spariscono al primo messaggio.
  var esempi = document.getElementById("chat-esempi");
  function nascondiEsempi(){ if(esempi){ esempi.hidden = true; } }
  if(esempi){
    esempi.addEventListener("click", function(e){
      var b = e.target && e.target.closest ? e.target.closest(".chat-chip") : null;
      if(!b) return;
      input.value = (b.textContent || "").trim();
      autosize();
      try{ input.focus(); }catch(_){}
    });
  }

  form.addEventListener("submit", function(e){
    e.preventDefault();
    if(inVolo) return;

    var domanda = (input.value || "").trim();
    if(!domanda) return;

    nascondiEsempi();
    aggiungiBolla(domanda, "utente");
    input.value = "";
    autosize();
    bloccaInvio(true);

    var pensa = mostraPensa();

    // solo gli ultimi ~6 scambi (il backend ne usa comunque pochi)
    var payload = {
      domanda: domanda,
      lang: (window._lang || "it"),   // i18n: la risposta segue la lingua scelta (param già previsto dall'endpoint)
      history: history.slice(-6)
    };

    fetch("/chiedi", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Device-Id": devId()
      },
      body: JSON.stringify(payload)
    }).then(function(resp){
      // prova a leggere il JSON anche sugli errori (il backend manda {errore,messaggio})
      return resp.json().then(function(dati){
        return {ok: resp.ok, status: resp.status, dati: dati};
      }).catch(function(){
        return {ok: resp.ok, status: resp.status, dati: null};
      });
    }).then(function(res){
      if(pensa && pensa.parentNode) pensa.parentNode.removeChild(pensa);

      var d = res.dati || {};

      // ── 429: troppe richieste → mostra il messaggio d'attesa onesto ──
      if(res.status === 429){
        aggiungiErrore(d.messaggio || _L({it:"Troppe domande in poco tempo. Attendi un minuto e riprova.", en:"Too many questions in a short time. Wait a minute and try again.", es:"Demasiadas preguntas en poco tiempo. Espera un minuto e inténtalo de nuevo."}));
        bloccaInvio(false);
        input.focus();
        return;
      }

      // ── servizio AI giù / altri errori di servizio → onesto, niente risposta inventata ──
      if(!res.ok || !d || d.errore){
        if(d && d.errore === "domanda_vuota"){
          // non dovrebbe capitare (già filtrato), ma restiamo onesti
          bloccaInvio(false);
          input.focus();
          return;
        }
        aggiungiErrore(_L({it:"Il servizio di risposta non è disponibile in questo momento.", en:"The answering service is not available right now.", es:"El servicio de respuesta no está disponible en este momento."}));
        bloccaInvio(false);
        input.focus();
        return;
      }

      // ── risposta valida ──
      var risposta = (d.risposta || "").trim();

      if(risposta){
        aggiungiBolla(risposta, "matter");
        aggiungiConnessi(d.connessi);
      } else {
        // 200 ma senza testo: non inventiamo nulla
        aggiungiErrore(_L({it:"Il servizio di risposta non è disponibile in questo momento.", en:"The answering service is not available right now.", es:"El servicio de respuesta no está disponible en este momento."}));
        bloccaInvio(false);
        input.focus();
        return;
      }

      // ── azione crea_ricetta: mostriamo la risposta + nota onesta, NON generiamo qui ──
      if(d._azione === "crea_ricetta"){
        aggiungiNota(_L({it:"La creazione delle ricette è in Componi.", en:"Recipe creation lives in Compose.", es:"La creación de recetas está en Componer."}));
      }

      // aggiorna la history lato client (coppia {q, r})
      history.push({q: domanda, r: risposta});

      bloccaInvio(false);
      input.focus();
    }).catch(function(){
      // rete giù / fetch fallito → onesto
      if(pensa && pensa.parentNode) pensa.parentNode.removeChild(pensa);
      aggiungiErrore(_L({it:"Il servizio di risposta non è disponibile in questo momento.", en:"The answering service is not available right now.", es:"El servicio de respuesta no está disponible en este momento."}));
      bloccaInvio(false);
      input.focus();
    });
  });

  // genera/recupera il device id all'avvio
  devId();

  // AVVIO SEMINATO: se arrivi da un esperimento (/chiedi-nuovo?q=...), Matter parte
  // già con quella domanda — stesso percorso dell'invio manuale, nessun endpoint nuovo.
  try{
    var _seme=(new URLSearchParams(location.search||"")).get("q");
    if(_seme && _seme.trim()){
      input.value=_seme.trim().slice(0,600);
      try{ autosize(); }catch(_e){}
      if(form.requestSubmit){ form.requestSubmit(); }
      else { form.dispatchEvent(new Event("submit",{cancelable:true,bubbles:true})); }
    }
  }catch(_e){}
})();
</script>

<!-- VOCALE (STT) + VISION (foto): gating Pro+login fedele al vecchio FE, solo token matter3.css -->
<script>
/* ============================================================================
   VOCALE (STT /v1/stt) + VISION (/v1/vision) per il NUOVO frontend.
   Fedele al vecchio FE (static/matter.js): stesso gating Pro+login, stessi
   contratti. Solo token di matter3.css, nessuna dipendenza nuova.
   Un UNICO blocco identico per causa-nuovo.html e chat-nuovo.html: si cabla
   da solo in base agli elementi presenti nella pagina.
   ========================================================================== */
(function(){
  "use strict";

  var ACCOUNT_URL = "/account"; // pagina Account del FE nuovo: registrazione e accesso

  function LL(o){ return (typeof window._L === "function") ? window._L(o) : (o[(window._lang||"it")] || o.it); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  function getTok(){ try{ return localStorage.getItem("matter_token") || ""; }catch(e){ return ""; } }
  function getPiano(){ try{ return localStorage.getItem("matter_piano") || ""; }catch(e){ return ""; } }
  function isPro(){ return !!getTok() && getPiano() === "pro"; }

  // device id: stesso pattern delle altre pagine nuove (serve al merge anonimo->account)
  function devId(){
    try{
      var d = localStorage.getItem("matter_device_id") || localStorage.getItem("matter_token");
      if(!d){
        d = (window.crypto && crypto.randomUUID)
          ? crypto.randomUUID()
          : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c){ var r=Math.random()*16|0, v=c==="x"?r:(r&0x3|0x8); return v.toString(16); });
        localStorage.setItem("matter_device_id", d);
      }
      return d;
    }catch(e){ return "anon"; }
  }

  // ---------- area messaggi (sotto i bottoni) ----------
  var msgEl = null;
  function showMsg(txt, kind){ if(!msgEl) return; msgEl.hidden=false; msgEl.className="media-msg"+(kind?(" "+kind):""); msgEl.textContent=txt; }
  function showMsgHtml(html, kind){ if(!msgEl) return; msgEl.hidden=false; msgEl.className="media-msg"+(kind?(" "+kind):""); msgEl.innerHTML=html; }
  function clearMsg(){ if(msgEl){ msgEl.hidden=true; msgEl.textContent=""; msgEl.className="media-msg"; } }

  function proMsg(){
    showMsgHtml(
      LL({it:"Questa funzione è disponibile nel piano <b>Pro</b>. ", en:"This feature is available on the <b>Pro</b> plan. ", es:"Esta función está disponible en el plan <b>Pro</b>. "})
      + '<a href="'+ACCOUNT_URL+'">'+LL({it:"Accedi o registrati", en:"Sign in or register", es:"Inicia sesión o regístrate"})+'</a>.',
      "err"
    );
  }

  // ---------- foglio di LOGIN minimo (solo accesso) ----------
  var sheet=null, sheetEls=null, onOk=null;

  function buildSheet(){
    if(sheet) return;
    var scrim=document.createElement("div");
    scrim.className="ms-scrim"; scrim.hidden=true;
    scrim.setAttribute("role","dialog"); scrim.setAttribute("aria-modal","true"); scrim.setAttribute("aria-label","Login");
    scrim.innerHTML =
      '<div class="ms-card" role="document">'
      + '<h2 class="ms-title"></h2>'
      + '<p class="ms-sub"></p>'
      + '<form class="ms-form" autocomplete="on" novalidate>'
      +   '<label class="ms-field"><span class="ms-l-email"></span>'
      +     '<input type="email" class="ms-email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false"></label>'
      +   '<label class="ms-field"><span class="ms-l-pw"></span>'
      +     '<input type="password" class="ms-pw" autocomplete="current-password"></label>'
      +   '<div class="ms-msg" aria-live="polite"></div>'
      +   '<div class="ms-actions">'
      +     '<button type="button" class="btn btn--ghost ms-cancel" style="flex:1"></button>'
      +     '<button type="submit" class="btn ms-submit" style="flex:1"></button>'
      +   '</div>'
      + '</form>'
      + '<p class="ms-note"></p>'
      + '</div>';
    document.body.appendChild(scrim);
    sheet=scrim;
    sheetEls={
      card: scrim.querySelector(".ms-card"),
      title: scrim.querySelector(".ms-title"),
      sub: scrim.querySelector(".ms-sub"),
      form: scrim.querySelector(".ms-form"),
      lEmail: scrim.querySelector(".ms-l-email"),
      lPw: scrim.querySelector(".ms-l-pw"),
      email: scrim.querySelector(".ms-email"),
      pw: scrim.querySelector(".ms-pw"),
      msg: scrim.querySelector(".ms-msg"),
      cancel: scrim.querySelector(".ms-cancel"),
      submit: scrim.querySelector(".ms-submit"),
      note: scrim.querySelector(".ms-note")
    };
    // chiusura: click sullo scrim, Esc, bottone annulla
    scrim.addEventListener("click", function(e){ if(e.target===scrim) closeLogin(); });
    sheetEls.cancel.addEventListener("click", closeLogin);
    document.addEventListener("keydown", function(e){ if(e.key==="Escape" && sheet && !sheet.hidden) closeLogin(); });
    sheetEls.form.addEventListener("submit", function(e){ e.preventDefault(); doLogin(); });
    labelSheet();
  }

  function labelSheet(){
    if(!sheetEls) return;
    sheetEls.title.textContent = LL({it:"Accedi a Matter", en:"Sign in to Matter", es:"Inicia sesión en Matter"});
    sheetEls.sub.textContent   = LL({it:"Vocale e foto sono funzioni Pro: accedi per usarle.", en:"Voice and photo are Pro features: sign in to use them.", es:"Voz y foto son funciones Pro: inicia sesión para usarlas."});
    sheetEls.lEmail.textContent= LL({it:"Email", en:"Email", es:"Correo"});
    sheetEls.lPw.textContent   = LL({it:"Password", en:"Password", es:"Contraseña"});
    sheetEls.cancel.textContent= LL({it:"Annulla", en:"Cancel", es:"Cancelar"});
    sheetEls.submit.textContent= LL({it:"Accedi", en:"Sign in", es:"Entrar"});
    sheetEls.email.setAttribute("placeholder", LL({it:"tu@email.it", en:"you@email.com", es:"tu@email.com"}));
    sheetEls.pw.setAttribute("placeholder", "••••••••");
    sheetEls.note.innerHTML = LL({it:"Non hai ancora un account? ", en:"No account yet? ", es:"¿Aún no tienes cuenta? "})
      + '<a href="'+ACCOUNT_URL+'">'+LL({it:"Registrati", en:"Register", es:"Regístrate"})+'</a>.';
  }

  function openLogin(cb){
    buildSheet();
    onOk = (typeof cb==="function") ? cb : null;
    labelSheet();
    sheetEls.msg.textContent=""; sheetEls.msg.className="ms-msg";
    sheet.hidden=false;
    try{ sheetEls.email.focus(); }catch(e){}
  }
  function closeLogin(){ if(sheet){ sheet.hidden=true; } }

  function doLogin(){
    var email=(sheetEls.email.value||"").trim();
    var pw=sheetEls.pw.value||"";
    if(!email || !pw){
      sheetEls.msg.textContent = LL({it:"Inserisci email e password.", en:"Enter email and password.", es:"Introduce correo y contraseña."});
      return;
    }
    sheetEls.submit.disabled=true;
    var orig=sheetEls.submit.textContent;
    sheetEls.submit.textContent = LL({it:"Accesso…", en:"Signing in…", es:"Entrando…"});
    sheetEls.msg.className="ms-msg"; sheetEls.msg.textContent="";
    fetch("/v1/auth/login", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "X-Device-Id": devId() },
      body: JSON.stringify({ email:email, password:pw, lang:(window._lang||"it") })
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(j){ return {status:r.status, ok:r.ok, j:j}; });
    }).then(function(res){
      sheetEls.submit.disabled=false; sheetEls.submit.textContent=orig;
      var j=res.j||{};
      if(res.ok && j.token){
        try{ localStorage.setItem("matter_token", j.token); }catch(e){}
        try{ if(j.piano) localStorage.setItem("matter_piano", j.piano); }catch(e){}
        closeLogin();
        if(isPro()){
          showMsg(LL({it:"Accesso riuscito.", en:"Signed in.", es:"Sesión iniciada."}), "ok");
        } else {
          proMsg();
        }
        try{ if(onOk) onOk(); }catch(e){}
      } else if(res.status===429){
        sheetEls.msg.textContent = j.errore || LL({it:"Troppi tentativi. Attendi un minuto.", en:"Too many attempts. Wait a minute.", es:"Demasiados intentos. Espera un minuto."});
      } else {
        sheetEls.msg.textContent = j.errore || LL({it:"Accesso non riuscito. Controlla le credenziali.", en:"Sign-in failed. Check your credentials.", es:"Error de acceso. Revisa tus credenciales."});
      }
    }).catch(function(){
      sheetEls.submit.disabled=false; sheetEls.submit.textContent=orig;
      sheetEls.msg.textContent = LL({it:"Rete non raggiungibile. Riprova.", en:"Network unreachable. Try again.", es:"Red no disponible. Inténtalo de nuevo."});
    });
  }

  // ---------- gate dei 3 stati ----------
  // ritorna true se può procedere; altrimenti gestisce lo stato (login / Pro) e ritorna false
  function gate(retry){
    if(!getTok()){ openLogin(retry); return false; }   // non loggato -> foglio di login
    if(!isPro()){ proMsg(); return false; }             // loggato ma non Pro
    return true;                                         // Pro
  }

  // ---------- VOCALE (STT) ----------
  var rec=null, chunks=[];
  function fileName(blob){
    var t=(blob && blob.type) || "";
    if(t.indexOf("mp4")>=0) return "audio.mp4";
    if(t.indexOf("m4a")>=0 || t.indexOf("x-m4a")>=0) return "audio.m4a";
    if(t.indexOf("wav")>=0) return "audio.wav";
    if(t.indexOf("ogg")>=0) return "audio.ogg";
    return "audio.webm";
  }

  function onMicClick(btn, target, isChat){
    if(rec && rec.state==="recording"){ stopRec(btn); return; }
    clearMsg();
    if(!gate(function(){ onMicClick(btn, target, isChat); })) return;
    startRec(btn, target, isChat);
  }

  function startRec(btn, target, isChat){
    if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) || typeof MediaRecorder==="undefined"){
      showMsg(LL({it:"Registrazione non supportata su questo dispositivo.", en:"Recording isn't supported on this device.", es:"La grabación no es compatible con este dispositivo."}), "err");
      return;
    }
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      chunks=[];
      try{ rec=new MediaRecorder(stream, {mimeType:"audio/webm"}); }
      catch(e){ try{ rec=new MediaRecorder(stream); }catch(e2){ stream.getTracks().forEach(function(t){t.stop();}); showMsg(LL({it:"Registrazione non disponibile.", en:"Recording unavailable.", es:"Grabación no disponible."}), "err"); return; } }
      rec.ondataavailable=function(e){ if(e.data && e.data.size>0) chunks.push(e.data); };
      rec.onstop=function(){
        stream.getTracks().forEach(function(t){ t.stop(); });
        btn.classList.remove("rec"); btn.setAttribute("aria-pressed","false");
        var blob=new Blob(chunks, {type:(rec && rec.mimeType) || "audio/webm"});
        uploadStt(blob, btn, target, isChat);
      };
      rec.start();
      btn.classList.add("rec"); btn.setAttribute("aria-pressed","true");
      showMsg(LL({it:"Sto ascoltando… tocca di nuovo per fermare.", en:"Listening… tap again to stop.", es:"Escuchando… toca de nuevo para parar."}), "");
    }).catch(function(){
      showMsg(LL({it:"Microfono non disponibile o permesso negato.", en:"Microphone unavailable or permission denied.", es:"Micrófono no disponible o permiso denegado."}), "err");
    });
  }

  function stopRec(btn){
    try{ if(rec && rec.state==="recording") rec.stop(); }catch(e){}
    btn.classList.remove("rec"); btn.classList.add("busy"); btn.setAttribute("aria-pressed","false");
    showMsg(LL({it:"Trascrivo…", en:"Transcribing…", es:"Transcribiendo…"}), "");
  }

  function uploadStt(blob, btn, target, isChat){
    btn.classList.add("busy");
    var fd=new FormData(); fd.append("audio", blob, fileName(blob));
    fetch("/v1/stt?lang="+(window._lang||"it"), { method:"POST", headers:{ "X-Token": getTok() }, body: fd })
    .then(function(r){
      if(r.status===401){ btn.classList.remove("busy"); openLogin(function(){ onMicClick(btn, target, isChat); }); return null; }
      if(r.status===403){ btn.classList.remove("busy"); proMsg(); return null; }
      return r.json().catch(function(){ return {}; });
    }).then(function(j){
      if(j===null) return;
      btn.classList.remove("busy");
      if(j.trascrizione){ fillInto(target, j.trascrizione, isChat); clearMsg(); }
      else if(j.errore && j.errore.indexOf("Pro")>=0){ proMsg(); }
      else { showMsg(j.errore || LL({it:"Trascrizione non riuscita.", en:"Transcription failed.", es:"Transcripción fallida."}), "err"); }
    }).catch(function(){
      btn.classList.remove("busy");
      showMsg(LL({it:"Errore di rete durante la trascrizione.", en:"Network error during transcription.", es:"Error de red durante la transcripción."}), "err");
    });
  }

  function fillInto(target, testo, isChat){
    if(!target) return;
    target.value = testo;
    try{ target.focus(); }catch(e){}
    if(isChat){ try{ target.dispatchEvent(new Event("input", {bubbles:true})); }catch(e){} }
  }

  // ---------- VISION (foto) ----------
  function onFotoClick(input){
    clearMsg();
    if(!gate(function(){ try{ input.click(); }catch(e){} })) return;
    try{ input.click(); }catch(e){}
  }

  function sendFoto(file, outEl){
    if(!file) return;
    if(!gate(function(){ sendFoto(file, outEl); })) return;
    var previewUrl=null;
    try{ previewUrl=URL.createObjectURL(file); }catch(e){}
    if(outEl){
      outEl.hidden=false; outEl.className="vision-out busy";
      outEl.innerHTML = (previewUrl?('<img src="'+previewUrl+'" alt="">'):"")
        + '<span class="vo-lab">'+esc(LL({it:"Analisi foto", en:"Photo analysis", es:"Análisis de foto"}))+'</span>'
        + '<div class="vo-txt">'+esc(LL({it:"Analizzo l'immagine…", en:"Analysing the image…", es:"Analizando la imagen…"}))+'</div>';
    }
    var fd=new FormData(); fd.append("immagine", file);
    fetch("/v1/vision?lang="+(window._lang||"it"), { method:"POST", headers:{ "X-Token": getTok() }, body: fd })
    .then(function(r){
      if(r.status===401){ if(outEl){ outEl.hidden=true; } openLogin(function(){ sendFoto(file, outEl); }); return null; }
      if(r.status===403){ if(outEl){ outEl.hidden=true; } proMsg(); return null; }
      return r.json().catch(function(){ return {}; });
    }).then(function(j){
      if(j===null) return;
      if(!outEl) return;
      outEl.className="vision-out";
      if(j.analisi){
        outEl.innerHTML = (previewUrl?('<img src="'+previewUrl+'" alt="">'):"")
          + '<span class="vo-lab">'+esc(LL({it:"Analisi foto", en:"Photo analysis", es:"Análisis de foto"}))+'</span>'
          + '<div class="vo-txt">'+esc(j.analisi)+'</div>';
      } else if(j.errore && j.errore.indexOf("Pro")>=0){
        outEl.hidden=true; proMsg();
      } else {
        outEl.innerHTML = (previewUrl?('<img src="'+previewUrl+'" alt="">'):"")
          + '<span class="vo-lab">'+esc(LL({it:"Analisi foto", en:"Photo analysis", es:"Análisis de foto"}))+'</span>'
          + '<div class="vo-txt">'+esc(j.errore || LL({it:"Analisi non riuscita.", en:"Analysis failed.", es:"Análisis fallido."}))+'</div>';
      }
    }).catch(function(){
      if(outEl){
        outEl.className="vision-out";
        outEl.innerHTML = '<span class="vo-lab">'+esc(LL({it:"Analisi foto", en:"Photo analysis", es:"Análisis de foto"}))+'</span>'
          + '<div class="vo-txt">'+esc(LL({it:"Errore di rete durante l'analisi.", en:"Network error during analysis.", es:"Error de red durante el análisis."}))+'</div>';
      }
    });
  }

  // ---------- cablaggio (identico per entrambe le pagine) ----------
  function wire(){
    msgEl = document.getElementById("media-msg");
    var sintomo = document.getElementById("sintomo");
    var domanda = document.getElementById("domanda");
    var target  = sintomo || domanda;
    var isChat  = !sintomo && !!domanda;

    var btnMic = document.getElementById("btn-mic");
    if(btnMic){
      btnMic.setAttribute("aria-pressed","false");
      btnMic.addEventListener("click", function(){ onMicClick(btnMic, target, isChat); });
    }

    var btnFoto  = document.getElementById("btn-foto");
    var fotoInput= document.getElementById("foto-input");
    var visionOut= document.getElementById("vision-out");
    if(btnFoto && fotoInput){
      btnFoto.addEventListener("click", function(){ onFotoClick(fotoInput); });
      fotoInput.addEventListener("change", function(){
        if(fotoInput.files && fotoInput.files[0]){ sendFoto(fotoInput.files[0], visionOut); }
        fotoInput.value="";
      });
    }

    // ri-etichetta il foglio di login al cambio lingua, senza rompere l'hook esistente
    var prevApply = window.onI18nApply;
    window.onI18nApply = function(l){
      if(typeof prevApply==="function"){ try{ prevApply(l); }catch(e){} }
      if(sheet && !sheet.hidden) labelSheet();
    };
  }

  if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded", wire); }
  else { wire(); }
})();
</script>
</body>
