<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scienza · Matter Bench</title>
<script>
  /* TEMA ADATTIVO: scuro di sera (19->7), chiaro di giorno. Come Cifra.
     Automatico per ora (nessun toggle manuale). Prima del CSS, niente sfarfallio. */
  (function(){try{
    function _mtTema(){var hh=new Date().getHours();document.documentElement.setAttribute('data-theme',(hh>=19||hh<7)?'dark':'light');}
    _mtTema();
    document.addEventListener('visibilitychange',function(){if(!document.hidden)_mtTema();});
    window.addEventListener('pageshow',_mtTema);
    window.addEventListener('focus',_mtTema);
    setInterval(_mtTema,60000);
  }catch(e){}})();
</script>
<link rel="stylesheet" href="/static/matter-v5.css?v=2">
<style>
  /* Scienza in lingua v5 — rivesto le classi emesse dal JS (logica invariata). */
  #wrap{max-width:var(--maxw); margin:0 auto; padding:0 28px 110px}
  .state{margin-top:40px; color:var(--soft)}
  /* --- lista --- */
  .hero{padding:44px 0 26px; border-bottom:1px solid var(--rule)}
  .hero .kind{font-size:14px; color:var(--soft); margin:0 0 12px; letter-spacing:0; text-transform:none; font-weight:400}
  .hero h1{font-family:var(--display); font-weight:800; font-size:clamp(42px,9vw,72px); line-height:.94; color:var(--ink); letter-spacing:-.02em; margin:0}
  .regola{margin-top:20px; font-size:18px; color:var(--soft); line-height:1.5; max-width:34em}
  .cerca{width:100%; font:inherit; font-size:16px; padding:14px 16px; border:1px solid var(--ink); border-radius:10px; background:var(--panel); color:var(--ink); margin:28px 0 8px}
  .cerca::placeholder{color:var(--faint)}
  /* temi trasversali: raggruppano schede sparse per disciplina (es. sicurezza alimentare) */
  .temi{display:flex; flex-wrap:wrap; gap:8px; margin:4px 0 2px}
  .tema-chip{font-family:var(--sans); font-weight:600; font-size:13px; color:var(--soft); background:var(--panel); border:1px solid var(--rule); border-radius:999px; padding:7px 14px; cursor:pointer}
  .tema-chip[aria-pressed="true"]{color:#fff; background:var(--verde); border-color:var(--verde)}
  .cat-index{display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin:16px 0 2px}
  .ci-lab{font-size:12px; font-weight:600; color:var(--faint); margin-right:2px}
  .cat-index a{font-family:var(--sans); font-weight:600; font-size:12.5px; color:var(--ink); background:var(--panel); border:1px solid var(--rule); border-radius:999px; padding:6px 12px; text-decoration:none; text-transform:capitalize; white-space:nowrap}
  .cat-index a:hover{border-color:var(--ink)}
  .cat-index .ci-n{color:var(--faint); font-variant-numeric:tabular-nums; margin-left:3px}
  .cat-blocco{padding:0 0 2px; margin-top:22px; border-top:1px solid var(--rule); scroll-margin-top:0}
  .cat-blocco:first-of-type{border-top:0}
  .cat-h{position:sticky; top:0; z-index:5; background:var(--paper); font-family:var(--display); font-weight:700; font-size:20px; color:var(--ink); margin:0; padding:12px 0 8px; text-transform:capitalize; box-shadow:0 1px 0 var(--rule-2)}
  .cat-n{font-size:13px; color:var(--faint); font-weight:600; font-variant-numeric:tabular-nums}
  .sc-list{display:flex; flex-direction:column; gap:0; margin-top:8px}
  .sc-item{display:block; background:none; border:0; border-top:1px solid var(--rule-2); border-radius:0; padding:15px 0; text-decoration:none; color:var(--ink); transition:padding-left .12s}
  .sc-item:first-child{border-top:0}
  .sc-item:hover{padding-left:6px}
  .sc-item .nome{font-family:var(--display); font-weight:700; font-size:17px; color:var(--ink)}
  .sc-item .princ{font-size:14px; color:var(--soft); margin-top:4px; line-height:1.45; max-width:46em}
  .sc-item .prova{display:inline-block; font-size:11px; font-weight:600; letter-spacing:0; text-transform:none; color:var(--verde); background:var(--verde-tint); border:0; border-radius:999px; padding:3px 10px; margin-top:8px}
  /* --- dettaglio --- */
  .back{display:inline-block; margin:32px 0 0; font-size:14px; color:var(--soft); text-decoration:none}
  .back:hover{color:var(--ink)}
  .d-cat{font-size:14px; color:var(--soft); letter-spacing:0; text-transform:capitalize; font-weight:400}
  .d-nome{font-family:var(--display); font-weight:800; font-size:clamp(34px,7vw,56px); color:var(--ink); line-height:.96; letter-spacing:-.02em; margin:6px 0 0}
  .d-gancio{font-size:19px; color:var(--ink); font-style:italic; font-family:var(--display); font-weight:500; margin:18px 0 0; line-height:1.5; max-width:30em}
  .d-bersaglio{margin-top:22px; padding:14px 16px; border-radius:11px; background:var(--verde-tint); border:1px solid #d3e4cd; font-size:15px; color:var(--ink); line-height:1.5; font-variant-numeric:tabular-nums}
  .d-bersaglio .lbl{display:block; font-size:12px; text-transform:none; letter-spacing:0; color:var(--verde); font-weight:600; margin-bottom:3px}
  .d-sec{margin-top:28px}
  .d-sec h3{font-family:var(--display); font-weight:700; font-size:18px; color:var(--ink); margin:0 0 8px}
  .d-sec p{font-size:16px; line-height:1.65; color:var(--ink); margin:8px 0; max-width:38em}
  .caus{display:flex; flex-wrap:wrap; gap:24px; margin-top:8px}
  .caus-col{flex:1 1 220px}
  .caus-col .t{font-size:13px; font-weight:600; text-transform:none; letter-spacing:0; color:var(--soft); margin-bottom:8px}
  .caus-chip{display:inline-block; font-size:13.5px; padding:5px 11px; border-radius:8px; border:1px solid var(--rule); margin:0 6px 6px 0; background:var(--panel)}
  .caus-chip.up{border-color:#bcd8b8; background:var(--verde-tint)}
  .caus-chip .pk{color:var(--soft); font-size:12px}
  .fonti{list-style:none; padding:0; margin:8px 0}
  .fonti li{font-size:14px; color:var(--soft); line-height:1.55; padding-left:16px; position:relative}
  .fonti li:before{content:"·"; position:absolute; left:4px}
  .ed{margin-top:20px; font-size:13px; color:var(--faint); line-height:1.5}
  /* MIRINO incorporato = strumento scuro (la firma, coerente col Banco) */
  .mirino-sec{margin-top:30px; padding:24px; background:var(--dark); border:0; border-radius:16px; box-shadow:0 40px 80px -46px rgba(10,22,13,.5)}
  .mirino-sec h3{font-family:var(--display); font-weight:600; font-size:15px; color:var(--dsoft); letter-spacing:.02em; margin:0}
  .mir-intro{font-size:14px; color:var(--dsoft); line-height:1.55; margin:8px 0 16px; max-width:40em}
  .mir-row{display:flex; gap:9px; flex-wrap:wrap; align-items:center}
  .mir-row input{font:inherit; font-size:14.5px; padding:11px 13px; border:1px solid var(--dark-line); border-radius:9px; background:var(--dark-2); color:var(--dink)}
  .mir-row input::placeholder{color:#5c6c5f}
  .mir-row input:focus{outline:none; border-color:#4a7e52}
  .mir-row input#mir-val{width:110px}
  .mir-row input#mir-uni{width:120px}
  .mir-row input#mir-ric{flex:1 1 160px; min-width:0}
  .mir-btn{font:inherit; font-weight:600; font-size:14.5px; padding:11px 20px; border:0; border-radius:10px; background:var(--verde); color:#fff; cursor:pointer}
  .mir-btn[aria-disabled="true"]{opacity:.6; cursor:default}
  .mir-hint{font-size:13px; color:var(--dsoft)}
  .mir-pattern{margin-top:14px; padding:13px 15px; border-radius:11px; background:var(--dark-2); border:1px solid var(--dark-line); font-size:14.5px; color:var(--dink); line-height:1.5}
  .mir-pattern.hidden{display:none}
  .mir-pattern .pre{display:block; font-size:11.5px; text-transform:none; letter-spacing:0; color:#86c268; font-weight:600; margin-bottom:4px}
  .mir-link{display:inline-block; margin-top:14px; font-size:14px; color:#86c268; text-decoration:none}
  @media(max-width:560px){ #wrap{padding:0 20px 90px} }
</style>
</head>
<body>
<div class="m-top">
  <a class="m-wm" href="/nuovo"><span>Matter</span><span class="b">Bench</span></a>
  <span style="margin-left:auto; display:flex; align-items:center; gap:14px">
    <span class="m-nav" data-i18n="m_nav">Scienza</span>
    <button id="lang-switch" class="lang-switch" type="button" onclick="cycleLang()" aria-label="Lingua / Language / Idioma" title="Lingua · Language · Idioma">IT</button>
  </span>
</div>

<div class="m-wrap" id="wrap">
  <div class="state" id="state" data-i18n="state_load">Carico…</div>
</div>

<script>
/* i18n — scienza: it · en · es (castigliano neutro). La shell UI si traduce; i CONTENUTI delle schede
   (nome, principio, gancio, bersaglio, fonti) sono dato scientifico dal backend: non li traduco io.
   L() mostra la variante nella lingua corrente SE il backend la fornisce, altrimenti resta sull'italiano. */
window.I18N_TITLE = {it:"Scienza · Matter Bench", en:"Science · Matter Bench", es:"Ciencia · Matter Bench"};
window.I18N_DICT = {
  m_nav:      {it:"Scienza", en:"Science", es:"Ciencia"},
  state_load: {it:"Carico…", en:"Loading…", es:"Cargando…"}
};
</script>
<script src="/static/i18n-nuovo.js?v=2"></script>

<script>
var _L = window._L || function(o){ return o && o.it; };
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function cap(s){ return s? s.charAt(0).toUpperCase()+s.slice(1) : s; }
function L(v){ if(v&&typeof v==='object'){ var k=window._lang||'it'; return v[k]||v.it||v.en||v.es||Object.values(v)[0]||''; } return v||''; }
var $wrap=document.getElementById('wrap');

var m = location.pathname.match(/\/scienza\/(.+)$/);
if(m && m[1]){ caricaDettaglio(decodeURIComponent(m[1])); } else { caricaLista(); }

function caricaLista(){
  fetch('/v1/schede-scienza', {headers:{'Accept':'application/json'}})
    .then(function(r){ return r.ok?r.json():{schede:[]}; })
    .then(function(d){
      var schede=d.schede||[];
      var gruppi={};
      schede.forEach(function(s){ var c=s.categoria||'altro'; (gruppi[c]=gruppi[c]||[]).push(s); });
      var cats=Object.keys(gruppi).sort(function(a,b){ return gruppi[b].length-gruppi[a].length; });
      var catIndexHtml = cats.map(function(c){ return '<a href="#cat-'+esc(c)+'" data-cat="'+esc(c)+'">'+esc(cap(c))+'<span class="ci-n">'+gruppi[c].length+'</span></a>'; }).join('');
      var html='<header class="hero"><div class="kind">'+_L({it:'Scienza',en:'Science',es:'Ciencia'})+'</div><h1>'+_L({it:'Le schede scienza',en:'The science sheets',es:'Las fichas de ciencia'})+'</h1>'+
        '<p class="regola">'+_L({it:'I fenomeni e le tecniche del mestiere, spiegati col loro principio e la loro fonte. ',en:'The phenomena and techniques of the craft, explained with their principle and their source. ',es:'Los fenómenos y las técnicas del oficio, explicados con su principio y su fuente. '})+schede.length+_L({it:' schede. Cerca un fenomeno, o sfoglia per tema o disciplina.',en:' sheets. Search for a phenomenon, or browse by theme or discipline.',es:' fichas. Busca un fenómeno, o explora por tema o disciplina.'})+'</p></header>'+
        '<input class="cerca" id="q" placeholder="'+_L({it:'Cerca un fenomeno o una tecnica…',en:'Search for a phenomenon or a technique…',es:'Busca un fenómeno o una técnica…'})+'" autocomplete="off">'+
        '<div class="temi" id="temi"></div>'+
        '<nav class="cat-index" id="cat-index" aria-label="'+_L({it:'Vai a una disciplina',en:'Jump to a discipline',es:'Ir a una disciplina'})+'"><span class="ci-lab">'+_L({it:'Salta a',en:'Jump to',es:'Ir a'})+'</span>'+catIndexHtml+'</nav>';
      cats.forEach(function(c){
        var items=gruppi[c].slice().sort(function(a,b){ return (a.nome||'').localeCompare(b.nome||''); });
        html+='<div class="cat-blocco" id="cat-'+esc(c)+'" data-cat="'+esc(c)+'"><div class="cat-h">'+esc(cap(c))+' <span class="cat-n">('+items.length+')</span></div><div class="sc-list">'+
          items.map(function(s){
            var pr=s.provabile?'<span class="prova">'+_L({it:'provabile',en:'testable',es:'experimentable'})+'</span>':'';
            var princ=s.principio?'<div class="princ">'+esc(s.principio)+'</div>':'';
            var _key=((s.nome||'')+' '+(s.principio||'')+' '+(s.slug||'')).toLowerCase();
            return '<a class="sc-item" data-nome="'+esc((s.nome||'').toLowerCase())+'" data-key="'+esc(_key)+'" href="/scienza/'+encodeURIComponent(s.slug)+'"><span class="nome">'+esc(s.nome)+'</span>'+princ+pr+'</a>';
          }).join('')+'</div></div>';
      });
      $wrap.innerHTML=html;

      // Temi trasversali: raggruppano schede sparse fra le discipline.
      var TEMI = [
        {id:'sicurezza', nome:_L({it:'Sicurezza alimentare',en:'Food safety',es:'Seguridad alimentaria'}), kw:['haccp','attivita dell','attività dell',' aw','catena del freddo','anisakis','botulino','conserve','pastorizz','sanific','shelf','igien','abbattiment','contamin','solforosa','so₂']},
        {id:'fermentazioni', nome:_L({it:'Fermentazioni',en:'Fermentations',es:'Fermentaciones'}), kw:['ferment','lievit','pasta madre','poolish','biga','levain','pate fermentee','lattica','malolattica','brett','kombucha','aceto','kefir']},
        {id:'temperatura', nome:_L({it:'Temperatura & cottura',en:'Temperature & cooking',es:'Temperatura y cocción'}), kw:['temperatur','cottura','maillard','caramell','gelatinizz','coagul','denatur','frittur','sottovuoto','affumicat','azoto']},
        {id:'acidita', nome:_L({it:'Acidità & pH',en:'Acidity & pH',es:'Acidez y pH'}), kw:[' ph','acidit','acido','tampone','solfor']}
      ];
      var temaAttivo = null;
      var $temi=document.getElementById('temi');
      $temi.innerHTML = TEMI.map(function(t){ return '<button type="button" class="tema-chip" data-tema="'+t.id+'" aria-pressed="false">'+esc(t.nome)+'</button>'; }).join('');

      function applica(){
        var t=(document.getElementById('q').value||'').trim().toLowerCase();
        var kw = temaAttivo ? (TEMI.filter(function(x){return x.id===temaAttivo;})[0]||{}).kw : null;
        document.querySelectorAll('.sc-item').forEach(function(el){
          var okText = !t || el.getAttribute('data-nome').indexOf(t)>=0;
          var okTema = !kw || kw.some(function(k){ return el.getAttribute('data-key').indexOf(k)>=0; });
          el.style.display = (okText && okTema) ? '' : 'none';
        });
        document.querySelectorAll('.cat-blocco').forEach(function(bl){ var vis=bl.querySelectorAll('.sc-item:not([style*="none"])').length; bl.style.display=vis?'':'none'; });
        document.querySelectorAll('#cat-index a').forEach(function(a){ var bl=document.getElementById('cat-'+a.getAttribute('data-cat')); a.style.display=(bl && bl.style.display!=='none')?'':'none'; });
      }
      document.getElementById('q').addEventListener('input', applica);
      $temi.querySelectorAll('.tema-chip').forEach(function(ch){
        ch.addEventListener('click', function(){
          var id=this.getAttribute('data-tema');
          temaAttivo = (temaAttivo===id) ? null : id;
          $temi.querySelectorAll('.tema-chip').forEach(function(c){ c.setAttribute('aria-pressed', c.getAttribute('data-tema')===temaAttivo ? 'true':'false'); });
          applica();
        });
      });
    }).catch(function(){ $wrap.innerHTML='<div class="state">'+_L({it:'Non riesco a caricare le schede adesso.',en:"I can't load the sheets right now.",es:'No puedo cargar las fichas ahora mismo.'})+'</div>'; });
}

function secP(titolo, testo){ return testo ? '<div class="d-sec"><h3>'+esc(titolo)+'</h3><p>'+esc(testo).replace(/\n+/g,'</p><p>')+'</p></div>' : ''; }

function _uuid(){ if(window.crypto&&crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0,v=c=='x'?r:(r&0x3|0x8);return v.toString(16);}); }
function deviceId(){ try{ var d=localStorage.getItem('matter_device_id'); if(!d||!/^[0-9a-fA-F-]{36}$/.test(d)){d=_uuid();localStorage.setItem('matter_device_id',d);} return d; }catch(e){ if(!window._vid)window._vid=_uuid(); return window._vid; } }
function H(){ return {'X-Device-Id':deviceId(),'Content-Type':'application/json','Accept':'application/json'}; }
var _curFen = null;

function mostraPattern(p){
  var el=document.getElementById('mir-pattern'); if(!el) return;
  if(p && p.pronto && p.messaggio){ el.className='mir-pattern'; el.innerHTML='<span class="pre">'+_L({it:'Il tuo pattern',en:'Your pattern',es:'Tu patrón'})+'</span>'+esc(p.messaggio); }
  else if(p && p.misure){ el.className='mir-pattern'; el.innerHTML='<span class="pre">'+_L({it:'Pattern',en:'Pattern',es:'Patrón'})+'</span>'+_L({it:'Hai ',en:'You have ',es:'Tienes '})+p.misure+(p.misure==1?_L({it:' misura',en:' measurement',es:' medida'}):_L({it:' misure',en:' measurements',es:' medidas'}))+_L({it:' di questo fenomeno. Al terzo valore compare la tua media.',en:' of this phenomenon. At the third value your average appears.',es:' de este fenómeno. Al tercer valor aparece tu media.'}); }
  else { el.className='mir-pattern hidden'; }
}
function caricaPatternFen(){
  if(!_curFen) return;
  fetch('/v1/banco/pattern?fenomeno='+encodeURIComponent(_curFen), {headers:H()})
    .then(function(r){ return r.ok?r.json():null; }).then(function(p){ if(p) mostraPattern(p); }).catch(function(){});
}
function registraMisura(){
  if(!_curFen) return;
  var val=document.getElementById('mir-val').value, uni=(document.getElementById('mir-uni').value||'').trim(), ric=(document.getElementById('mir-ric').value||'').trim();
  var hint=document.getElementById('mir-hint'), btn=document.getElementById('mir-go');
  if(val===''||isNaN(parseFloat(val))){ if(hint)hint.textContent=_L({it:'Serve un valore numerico.',en:'A numeric value is needed.',es:'Hace falta un valor numérico.'}); return; }
  if(btn)btn.setAttribute('aria-disabled','true'); if(hint)hint.textContent=_L({it:'Registro…',en:'Recording…',es:'Registrando…'});
  fetch('/v1/banco/salva', {method:'POST', headers:H(), body:JSON.stringify({fenomeno:_curFen, valore:parseFloat(val), unita:uni||null, ricetta:ric||null})})
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
    .then(function(res){ if(btn)btn.removeAttribute('aria-disabled');
      if(res.ok){ if(hint)hint.textContent=_L({it:'Registrato ✓',en:'Recorded ✓',es:'Registrado ✓'}); document.getElementById('mir-val').value=''; mostraPattern(res.j.pattern); }
      else if(hint)hint.textContent=(res.j&&res.j.errore)||_L({it:'Non registrato.',en:'Not recorded.',es:'No registrado.'});
    }).catch(function(){ if(btn)btn.removeAttribute('aria-disabled'); if(hint)hint.textContent=_L({it:'Errore di rete.',en:'Network error.',es:'Error de red.'}); });
}

function caricaDettaglio(slug){
  fetch('/v1/scheda-scienza/'+encodeURIComponent(slug), {headers:{'Accept':'application/json'}})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(d){
      var _back='<a class="back" href="/scienza">'+_L({it:'← Tutte le schede',en:'← All sheets',es:'← Todas las fichas'})+'</a>';
      if(!d || d.errore){ $wrap.innerHTML=_back+'<div class="state">'+_L({it:'Scheda non trovata.',en:'Sheet not found.',es:'Ficha no encontrada.'})+'</div>'; return; }
      var html=_back+
        '<header class="hero" style="padding-top:12px; border-bottom:0"><div class="d-cat">'+esc(d.categoria||'')+'</div><h1 class="d-nome">'+esc(d.nome||'')+'</h1>';
      if(d.gancio) html+='<p class="d-gancio">'+esc(d.gancio)+'</p>';
      html+='</header>';
      var bers = d.numero_bersaglio || d.header_bersaglio;
      if(bers && bers!==d.nome) html+='<div class="d-bersaglio"><span class="lbl">'+_L({it:'Numero-bersaglio',en:'Target number',es:'Número objetivo'})+'</span>'+esc(bers)+'</div>';
      html+=secP(_L({it:'Cosa sapere',en:'What to know',es:'Qué saber'}), d.cosa_sapere);
      html+=secP(_L({it:'Il principio',en:'The principle',es:'El principio'}), L(d.principio));
      html+=secP(_L({it:"L'esperienza",en:'The experience',es:'La experiencia'}), d.esperienza);
      html+=secP(_L({it:'Esecuzione',en:'Execution',es:'Ejecución'}), d.esecuzione);
      html+=secP(_L({it:'Errori comuni',en:'Common mistakes',es:'Errores comunes'}), d.errori_comuni);
      html+=secP(_L({it:'Punto critico',en:'Critical point',es:'Punto crítico'}), d.punto_critico);
      var ca=d.causalita||{};
      if((ca.acceleranti&&ca.acceleranti.length)||(ca.rallentanti&&ca.rallentanti.length)){
        var col=function(t,arr,cls){ if(!arr||!arr.length) return '';
          return '<div class="caus-col"><div class="t">'+t+'</div>'+arr.map(function(x){
            var pk=x.peso?' <span class="pk">('+esc(x.peso)+')</span>':''; return '<span class="caus-chip '+cls+'">'+esc(x.fattore||'')+pk+'</span>'; }).join('')+'</div>'; };
        html+='<div class="d-sec"><h3>'+_L({it:'Cosa lo accelera e cosa lo rallenta',en:'What speeds it up and what slows it down',es:'Qué lo acelera y qué lo frena'})+'</h3><div class="caus">'+col(_L({it:'Accelera ↑',en:'Speeds up ↑',es:'Acelera ↑'}),ca.acceleranti,'up')+col(_L({it:'Rallenta ↓',en:'Slows down ↓',es:'Frena ↓'}),ca.rallentanti,'')+'</div></div>';
      }
      if(d.fonti && d.fonti.length){
        html+='<div class="d-sec"><h3>'+_L({it:'Fonti',en:'Sources',es:'Fuentes'})+'</h3><ul class="fonti">'+d.fonti.map(function(f){ return '<li>'+esc(L(f))+'</li>'; }).join('')+'</ul></div>';
      }
      _curFen = d.nome || slug;
      html+='<div class="d-sec mirino-sec"><h3>'+_L({it:'Misurato al banco?',en:'Measured at the bench?',es:'¿Medido en la mesa?'})+'</h3>'+
        '<p class="mir-intro">'+_L({it:'Se hai misurato questo fenomeno — un numero che conti (°C, %, g/L, pH…) — registralo. Dopo tre misure Matter ti mostra il tuo pattern, e finisce nel tuo Profilo Tecnico.',en:'If you measured this phenomenon — a number that counts (°C, %, g/L, pH…) — record it. After three measurements Matter shows you your pattern, and it goes into your Technical Profile.',es:'Si has medido este fenómeno — un número que cuenta (°C, %, g/L, pH…) — regístralo. Tras tres medidas Matter te muestra tu patrón, y acaba en tu Perfil Técnico.'})+'</p>'+
        '<div class="mir-row">'+
        '<input id="mir-val" type="number" step="any" inputmode="decimal" placeholder="'+_L({it:'valore',en:'value',es:'valor'})+'" aria-label="'+_L({it:'valore',en:'value',es:'valor'})+'">'+
        '<input id="mir-uni" placeholder="'+_L({it:'unità',en:'unit',es:'unidad'})+'" aria-label="'+_L({it:'unità',en:'unit',es:'unidad'})+'">'+
        '<input id="mir-ric" placeholder="'+_L({it:'contesto (facoltativo)',en:'context (optional)',es:'contexto (opcional)'})+'" aria-label="'+_L({it:'contesto',en:'context',es:'contexto'})+'">'+
        '<button id="mir-go" type="button" class="mir-btn">'+_L({it:'Registra',en:'Record',es:'Registrar'})+'</button>'+
        '<span class="mir-hint" id="mir-hint"></span></div>'+
        '<div class="mir-pattern hidden" id="mir-pattern"></div>'+
        '<a class="mir-link" href="/banco/profilo">'+_L({it:'Il tuo Profilo Tecnico →',en:'Your Technical Profile →',es:'Tu Perfil Técnico →'})+'</a></div>';
      if(d.stato_editoriale==='ai_generated') html+='<p class="ed">'+_L({it:'Scheda in completamento, generata e in revisione. I numeri si verificano al banco.',en:'Sheet being completed, generated and under review. The numbers are verified at the bench.',es:'Ficha en elaboración, generada y en revisión. Los números se verifican en la mesa.'})+'</p>';
      $wrap.innerHTML=html;
      document.title=(d.nome||_L({it:'Scheda',en:'Sheet',es:'Ficha'}))+' · Matter Bench';
      var _mg=document.getElementById('mir-go'); if(_mg) _mg.addEventListener('click', registraMisura);
      caricaPatternFen();
    }).catch(function(){ $wrap.innerHTML='<a class="back" href="/scienza">'+_L({it:'← Tutte le schede',en:'← All sheets',es:'← Todas las fichas'})+'</a><div class="state">'+_L({it:'Non riesco a caricare la scheda adesso.',en:"I can't load the sheet right now.",es:'No puedo cargar la ficha ahora mismo.'})+'</div>'; });
}
// al cambio lingua ridisegna la vista corrente (lista o dettaglio)
window.onI18nApply = function(){ try{ var mm=location.pathname.match(/\/scienza\/(.+)$/); if(mm&&mm[1]) caricaDettaglio(decodeURIComponent(mm[1])); else caricaLista(); }catch(e){} };
