<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Causa — Matter Bench</title>
<meta name="description" content="Percorso diagnostico: parti dal problema, restringi le ipotesi. Non una causa certa — verifica al banco.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Schibsted+Grotesk:wght@500;700;800&display=swap">
<link rel="stylesheet" href="/static/matter3.css">
<style>
  /* --- CAUSA NUOVO: solo lo stretto necessario oltre matter3.css --- */
  .causa-testa{margin-top:22px}
  .causa-testa h1{font-size:24px; font-family:var(--display); font-weight:800; letter-spacing:-.01em}
  .causa-sub{font-size:13px; color:var(--ink-soft); margin-top:6px; line-height:1.45}

  /* form del problema */
  .campo{display:block; margin-top:18px}
  .campo > span{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:6px}
  .campo input, .campo select{
    width:100%; font-family:var(--sans); font-size:15px; color:var(--ink);
    background:var(--surface); border:1px solid var(--riga); border-radius:var(--r-sm);
    padding:11px 13px; box-shadow:var(--shadow-sm);
  }
  .campo input:focus, .campo select:focus{outline:2px solid var(--verde); outline-offset:1px; border-color:transparent}

  /* banner fermo (requisito revisore) */
  .banner-limite{
    margin-top:18px; background:rgba(169,128,47,.10); border:1px solid rgba(169,128,47,.30);
    border-radius:var(--r); padding:13px 15px; font-size:12.5px; color:var(--ink); line-height:1.5;
  }
  .banner-limite strong{color:#8a6a28; font-weight:700}

  /* stati */
  .stato{
    margin-top:14px; background:var(--panel); border:1px dashed var(--riga);
    border-radius:var(--r); padding:18px 16px; font-size:13.5px; color:var(--ink-soft);
    text-align:center; line-height:1.5;
  }
  .stato.stato-err{border-style:solid; border-color:rgba(168,80,74,.32); background:rgba(168,80,74,.08); color:var(--ink)}

  /* intestazione risultati */
  .ris-testa{margin-top:26px}
  .ris-fenomeno{font-family:var(--display); font-weight:800; font-size:18px; color:var(--ink); text-transform:capitalize}
  .ris-interpret{font-size:13px; color:var(--ink-soft); margin-top:4px; line-height:1.45}

  /* ipotesi (cause) */
  .ipotesi{list-style:none; margin:14px 0 0; padding:0; display:flex; flex-direction:column; gap:12px}
  .ipo{
    background:var(--surface); border:1px solid var(--riga); border-radius:var(--r);
    box-shadow:var(--shadow-sm); padding:14px 15px;
  }
  .ipo-top{display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .ipo-causa{flex:1 1 auto; min-width:0; font-family:var(--display); font-weight:700; font-size:15.5px; color:var(--ink)}
  /* pallino probabilita */
  .prob{display:inline-flex; align-items:center; gap:5px; font-family:var(--sans); font-weight:600; font-size:11px;
    letter-spacing:.04em; text-transform:uppercase; padding:3px 9px; border-radius:var(--r-pill); border:1px solid transparent}
  .prob::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor}
  .prob-alta{color:var(--oxblood); background:rgba(168,80,74,.10); border-color:rgba(168,80,74,.28)}
  .prob-media{color:var(--ocra); background:rgba(169,128,47,.12); border-color:rgba(169,128,47,.28)}
  .prob-bassa{color:var(--ink-soft); background:var(--panel); border-color:var(--riga)}
  .ipo-riga{margin-top:10px}
  .ipo-lab{font-family:var(--sans); font-weight:700; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); display:block; margin-bottom:3px}
  .ipo-txt{font-size:13.5px; color:var(--ink); line-height:1.5}
  .ipo-prov{margin-top:12px}

  /* sensori da controllare */
  .sensori{list-style:none; margin:12px 0 0; padding:0; display:flex; flex-direction:column; gap:9px}
  .sens{
    background:var(--surface); border:1px solid var(--riga); border-radius:var(--r-sm);
    padding:10px 12px; font-size:13.5px; color:var(--ink);
  }
  .sens-s{font-weight:700; text-transform:capitalize}
  .sens-d{color:var(--ink-soft)}

  /* approfondimento fenomeno (D4 — sotto un gesto) */
  .appr{margin-top:16px}
  .appr-btn{
    font-family:var(--sans); font-weight:600; font-size:12.5px; color:var(--verde);
    background:transparent; border:0; padding:4px 0; cursor:pointer; text-decoration:underline;
  }
  .appr-btn:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
  .appr-corpo{margin-top:10px; background:var(--panel); border:1px solid var(--riga); border-radius:var(--r);
    padding:14px 15px; font-size:13.5px; color:var(--ink); line-height:1.55}

  /* ===== VOCALE + VISION — solo token matter3.css ===== */
  .media-row{display:flex; flex-wrap:wrap; gap:9px; margin-top:10px}
  .media-btn{display:inline-flex; align-items:center; gap:7px; font-family:var(--sans);
    font-weight:600; font-size:13px; color:var(--verde); background:transparent;
    border:1px solid var(--verde); border-radius:var(--r-pill); padding:8px 13px; cursor:pointer; line-height:1}
  .media-btn:hover{background:var(--tint)}
  .media-btn:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
  .media-btn svg{width:17px; height:17px; flex:0 0 auto}
  .media-btn.rec{background:var(--oxblood); border-color:var(--oxblood); color:#fff}
  .media-btn.busy{opacity:.55; cursor:progress}

  .media-msg{margin-top:10px; font-size:12.5px; line-height:1.45; color:var(--ink-soft);
    background:var(--panel); border:1px solid var(--riga); border-radius:var(--r-sm); padding:9px 12px}
  .media-msg.err{color:var(--oxblood); border-color:rgba(168,80,74,.32); background:rgba(168,80,74,.08)}
  .media-msg.ok{color:var(--verde); border-color:var(--verde); background:var(--tint)}
  .media-msg a{color:inherit; text-decoration:underline; font-weight:600}

  /* esito analisi foto (sotto il campo) */
  .vision-out{margin-top:12px; background:var(--surface); border:1px solid var(--riga);
    border-radius:var(--r); box-shadow:var(--shadow-sm); padding:14px 15px}
  .vision-out img{max-height:180px; border-radius:var(--r-sm); margin-bottom:10px; object-fit:cover}
  .vision-out .vo-lab{font-family:var(--sans); font-weight:700; font-size:11px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--ink-soft); display:block; margin-bottom:6px}
  .vision-out .vo-txt{font-size:13.5px; color:var(--ink); line-height:1.55; white-space:pre-wrap}
  .vision-out.busy .vo-txt{color:var(--ink-soft)}

  /* ===== foglio di LOGIN minimo (solo accesso) ===== */
  .ms-scrim{position:fixed; inset:0; z-index:60; background:rgba(29,42,34,.38);
    -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
    display:flex; align-items:flex-end; justify-content:center}
  @media (min-width:560px){.ms-scrim{align-items:center}}
  .ms-card{width:100%; max-width:420px; background:var(--surface); border:1px solid var(--riga);
    border-radius:var(--r) var(--r) 0 0; box-shadow:var(--shadow);
    padding:20px 18px max(20px,env(safe-area-inset-bottom,0px))}
  @media (min-width:560px){.ms-card{border-radius:var(--r); margin:0 16px}}
  .ms-card h2{font-family:var(--display); font-weight:800; font-size:20px; margin:0; color:var(--ink)}
  .ms-sub{font-size:13px; color:var(--ink-soft); margin:6px 0 0; line-height:1.45}
  .ms-field{display:block; margin-top:14px}
  .ms-field span{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:6px}
  .ms-field input{width:100%; font-family:var(--sans); font-size:16px; color:var(--ink);
    background:var(--surface); border:1px solid var(--riga); border-radius:var(--r-sm); padding:11px 13px}
  .ms-field input:focus{outline:2px solid var(--verde); outline-offset:1px; border-color:transparent}
  .ms-msg{margin-top:12px; font-size:12.5px; line-height:1.4; color:var(--oxblood); min-height:1px}
  .ms-actions{display:flex; gap:10px; margin-top:16px}
  .ms-note{margin-top:14px; font-size:12px; color:var(--ink-soft); line-height:1.45; text-align:center}
  .ms-note a{color:var(--verde); text-decoration:underline; font-weight:600}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="wm" href="/nuovo" aria-label="Matter Bench — home"><span>Matter</span><span class="bench">Bench</span></a>
    <span class="eyebrow" data-i18n="eyebrow_causa">causa</span>
  </div>
</header>

<main class="wrap">

  <section class="causa-testa">
    <span class="eyebrow" data-i18n="causa_lab">Causa</span>
    <h1 data-i18n="titolo">Parti dal problema</h1>
    <p class="causa-sub" data-i18n="sub">Descrivi cosa non torna. Matter restringe le ipotesi e ti dice come verificarle al banco — non ti dà una causa certa.</p>
  </section>

  <form id="form-causa" onsubmit="return false">
    <label class="campo" for="sintomo">
      <span data-i18n="q_problema">Qual è il problema?</span>
      <input type="text" id="sintomo" maxlength="200" autocomplete="off"
             placeholder="es. il cornicione non cresce · il drink è troppo dolce" data-i18n-ph="sintomo_ph">
    </label>

    <!-- VOCALE (detta il sintomo) + VISION (foto del problema) -->
    <div class="media-row">
      <button type="button" class="media-btn" id="btn-mic" aria-pressed="false"
              aria-label="Parla: detta il problema" title="Parla: detta il problema"
              data-i18n-aria="mic_aria" data-i18n-title="mic_title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        <span data-i18n="mic_label">Parla</span>
      </button>
      <button type="button" class="media-btn" id="btn-foto"
              aria-label="Foto del problema" title="Foto del problema"
              data-i18n-aria="foto_aria" data-i18n-title="foto_title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h3l2-2h8l2 2h3v12H3z"/><circle cx="12" cy="13" r="3.5"/></svg>
        <span data-i18n="foto_label">Foto del problema</span>
      </button>
      <input type="file" id="foto-input" accept="image/*" hidden>
    </div>
    <div class="media-msg" id="media-msg" role="status" aria-live="polite" hidden></div>
    <div class="vision-out" id="vision-out" aria-live="polite" hidden></div>

    <label class="campo" for="disciplina">
      <span data-i18n="disc_lab">Disciplina — facoltativa</span>
      <select id="disciplina">
        <option value="" data-i18n="disc_auto">La deduco dal problema</option>
        <option value="bar" data-i18n="disc_bar">Bar</option>
        <option value="panificazione" data-i18n="disc_pan">Panificazione</option>
        <option value="pasticceria" data-i18n="disc_pas">Pasticceria</option>
        <option value="gelateria" data-i18n="disc_gel">Gelateria</option>
        <option value="caffetteria" data-i18n="disc_caf">Caffetteria</option>
        <option value="cucina" data-i18n="disc_cuc">Cucina</option>
        <option value="vino" data-i18n="disc_vino">Vino</option>
        <option value="birra" data-i18n="disc_birra">Birra</option>
      </select>
    </label>
    <button class="btn btn--block" id="btn-diagnosi" type="submit" style="margin-top:16px" data-i18n="btn_diagnosi">Restringi le ipotesi</button>
  </form>

  <!-- stato di lavoro / errore -->
  <div class="stato" id="stato" hidden></div>

  <!-- RISULTATI -->
  <section id="risultati" hidden aria-live="polite">

    <!-- BANNER FERMO in cima ai risultati (requisito del revisore) -->
    <div class="banner-limite" role="note" data-i18n-html="banner">
      <strong>Percorso diagnostico: restringe le ipotesi, NON dà una causa certa.</strong> Verifica al banco.
    </div>

    <div class="ris-testa">
      <div class="ris-fenomeno" id="ris-fenomeno"></div>
      <div class="ris-interpret" id="ris-interpret"></div>
    </div>

    <!-- IPOTESI o stato onesto -->
    <div id="ipotesi-wrap">
      <span class="eyebrow" id="h-ipotesi" style="display:block; margin-top:22px; margin-bottom:0" data-i18n="h_ipotesi">Ipotesi</span>
      <ul class="ipotesi" id="ipotesi"></ul>
    </div>

    <!-- COSA CONTROLLARE -->
    <div id="sensori-wrap" hidden>
      <span class="eyebrow" style="display:block; margin-top:24px; margin-bottom:0" data-i18n="h_sensori">Cosa controllare</span>
      <ul class="sensori" id="sensori"></ul>
    </div>

    <!-- APPROFONDIMENTO FENOMENO (D4) -->
    <div class="appr" id="appr" hidden>
      <button type="button" class="appr-btn" id="appr-btn" aria-expanded="false" aria-controls="appr-corpo" data-i18n="appr_btn">Perché succede?</button>
      <div class="appr-corpo" id="appr-corpo" hidden></div>
    </div>

  </section>

</main>

<script src="/static/corridoio.js"></script>

<script src="/static/i18n-nuovo.js"></script>

<script>
(function(){
  "use strict";

  // ─── identità del dispositivo — stesso pattern di componi-nuovo / matter-quaderno2.js ───
  // localStorage 'matter_device_id' || 'matter_token'; se assente genera un UUID valido
  // (36 char: il backend accetta SOLO UUID da 36 char) e lo salva. Header X-Device-Id.
  function devId(){
    try{
      var d = localStorage.getItem("matter_device_id") || localStorage.getItem("matter_token");
      if (!d){
        d = (window.crypto && crypto.randomUUID)
          ? crypto.randomUUID()
          : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c){
              var r = Math.random()*16|0, v = c === "x" ? r : (r&0x3|0x8);
              return v.toString(16);
            });
        localStorage.setItem("matter_device_id", d);
      }
      return d;
    } catch(e){ return "anon"; }
  }

  function cap(s){ s = String(s||""); return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  var form        = document.getElementById("form-causa");
  var inpSintomo  = document.getElementById("sintomo");
  var selDisc     = document.getElementById("disciplina");
  var btn         = document.getElementById("btn-diagnosi");
  var stato       = document.getElementById("stato");
  var risultati   = document.getElementById("risultati");
  var risFenomeno = document.getElementById("ris-fenomeno");
  var risInterpret = document.getElementById("ris-interpret");
  var ipotesiWrap = document.getElementById("ipotesi-wrap");
  var ipotesiBox  = document.getElementById("ipotesi");
  var hIpotesi    = document.getElementById("h-ipotesi");
  var sensoriWrap = document.getElementById("sensori-wrap");
  var sensoriBox  = document.getElementById("sensori");
  var appr        = document.getElementById("appr");
  var apprBtn     = document.getElementById("appr-btn");
  var apprCorpo   = document.getElementById("appr-corpo");

  function mostraStato(testo, errore){
    stato.hidden = false;
    stato.className = "stato" + (errore ? " stato-err" : "");
    stato.textContent = testo;
  }
  function pulisciStato(){ stato.hidden = true; stato.textContent = ""; }

  // probabilità -> classe
  function classeProb(p){
    p = String(p || "").toLowerCase();
    if (p === "alta") return "prob-alta";
    if (p === "media") return "prob-media";
    if (p === "bassa") return "prob-bassa";
    return "prob-bassa";
  }
  // ordinamento per probabilità
  function rangoProb(p){
    p = String(p || "").toLowerCase();
    return p === "alta" ? 0 : (p === "media" ? 1 : 2);
  }

  // ─── RENDER cause (ipotesi) ───
  function renderIpotesi(cause){
    ipotesiBox.innerHTML = "";
    if (!cause.length){
      // STATO ONESTO: niente cause inventate
      hIpotesi.hidden = true;
      var vuoto = document.createElement("div");
      vuoto.className = "stato";
      vuoto.innerHTML = _L({
        it:"Nessuna ipotesi nel patrimonio per questo sintomo. Matter non inventa: prova, misura e registra nel Quaderno.",
        en:"No hypothesis in the knowledge base for this symptom. Matter doesn't invent: test, measure and record in the Quaderno.",
        es:"Ninguna hipótesis en el patrimonio para este síntoma. Matter no inventa: prueba, mide y registra en el Quaderno."
      });
      ipotesiWrap.appendChild(vuoto);
      return;
    }
    hIpotesi.hidden = false;

    cause.slice().sort(function(a, b){ return rangoProb(a.probabilita) - rangoProb(b.probabilita); })
      .forEach(function(c){
        var li = document.createElement("li");
        li.className = "ipo";

        var top = document.createElement("div");
        top.className = "ipo-top";

        var causa = document.createElement("span");
        causa.className = "ipo-causa";
        causa.textContent = cap(c.causa || _L({it:"ipotesi", en:"hypothesis", es:"hipótesis"}));
        top.appendChild(causa);

        if (c.probabilita){
          var prob = document.createElement("span");
          prob.className = "prob " + classeProb(c.probabilita);
          prob.textContent = _V(c.probabilita);
          top.appendChild(prob);
        }
        li.appendChild(top);

        // come verificarla = sensore_conferma
        if (c.sensore_conferma){
          var r1 = document.createElement("div");
          r1.className = "ipo-riga";
          r1.innerHTML = '<span class="ipo-lab">'+_L({it:"Come verificarla", en:"How to verify it", es:"Cómo verificarla"})+'</span>'
            + '<span class="ipo-txt">' + esc(c.sensore_conferma) + '</span>';
          li.appendChild(r1);
        }
        // cosa provare = patch
        if (c.patch){
          var r2 = document.createElement("div");
          r2.className = "ipo-riga";
          r2.innerHTML = '<span class="ipo-lab">'+_L({it:"Cosa provare", en:"What to try", es:"Qué probar"})+'</span>'
            + '<span class="ipo-txt">' + esc(c.patch) + '</span>';
          li.appendChild(r2);
        }

        // PROVENIENZA: da fonte (da_protocollo) vs proposta (arricchita da AI)
        var prov = document.createElement("span");
        if (c.da_protocollo){
          prov.className = "prov ipo-prov prov-fonte";
          prov.textContent = _L({it:"da fonte: ", en:"from source: ", es:"de fuente: "}) + c.da_protocollo;
        } else {
          prov.className = "prov ipo-prov prov-proposta";
          prov.textContent = _L({it:"proposta — da verificare", en:"proposal — to verify", es:"propuesta — por verificar"});
        }
        li.appendChild(prov);

        ipotesiBox.appendChild(li);
      });
  }

  // ─── RENDER sensori da controllare ───
  function renderSensori(sensori){
    sensoriBox.innerHTML = "";
    if (!sensori.length){ sensoriWrap.hidden = true; return; }
    sensoriWrap.hidden = false;
    sensori.forEach(function(s){
      var li = document.createElement("li");
      li.className = "sens";
      var testo = '<span class="sens-s">' + esc(cap(s.sensore || "")) + '</span>';
      if (s.domanda) testo += ' — <span class="sens-d">' + esc(s.domanda) + '</span>';
      li.innerHTML = testo;
      sensoriBox.appendChild(li);
    });
  }

  // ─── RENDER approfondimento fenomeno (D4) ───
  function renderAppr(causalita){
    if (!causalita){ appr.hidden = true; apprCorpo.hidden = true; return; }
    appr.hidden = false;
    apprCorpo.hidden = true;
    apprBtn.setAttribute("aria-expanded", "false");
    var testo;
    if (typeof causalita === "string"){
      testo = causalita;
    } else {
      try { testo = JSON.stringify(causalita, null, 2); } catch(e){ testo = String(causalita); }
    }
    apprCorpo.textContent = testo;
  }
  apprBtn.addEventListener("click", function(){
    var ap = !apprCorpo.hidden;
    apprCorpo.hidden = ap;
    apprBtn.setAttribute("aria-expanded", ap ? "false" : "true");
  });

  // pulisce i risultati precedenti (anche lo stato onesto iniettato)
  function resetRisultati(){
    var ex = ipotesiWrap.querySelector(".stato");
    if (ex) ex.remove();
    ipotesiBox.innerHTML = "";
    sensoriBox.innerHTML = "";
    apprCorpo.textContent = "";
    apprCorpo.hidden = true;
  }

  // ─── RISULTATI (estratto così il cambio lingua può ri-disegnarli) ───
  var _ultima = null;   // { sintomo, d } dell'ultima diagnosi riuscita
  function mostraRisultati(sintomo, d){
    resetRisultati();
    var fen = (d.fenomeno || "").trim();
    risFenomeno.textContent = fen || _L({it:"Percorso diagnostico", en:"Diagnostic path", es:"Ruta diagnóstica"});
    var interp = (d.sintomo_interpretato || sintomo || "").trim();
    risInterpret.textContent = interp ? (_L({it:"Problema: ", en:"Problem: ", es:"Problema: "}) + interp) : "";
    renderIpotesi(Array.isArray(d.cause) ? d.cause : []);
    renderSensori(Array.isArray(d.sensori_da_controllare) ? d.sensori_da_controllare : []);
    renderAppr(d.causalita_fenomeno || null);
    risultati.hidden = false;
  }

  // ─── DIAGNOSI ───
  var inCorso = false;
  form.addEventListener("submit", function(e){
    e.preventDefault();
    if (inCorso) return;
    var sintomo = (inpSintomo.value || "").trim();
    if (!sintomo){
      mostraStato(_L({it:"Scrivi prima qual è il problema.", en:"Write what the problem is first.", es:"Escribe primero cuál es el problema."}), true);
      return;
    }
    var body = { sintomo: sintomo };
    var disc = selDisc.value;
    if (disc) body.disciplina = disc;

    inCorso = true;
    btn.disabled = true;
    var testoOrig = btn.textContent;
    btn.textContent = _L({it:"Restringo…", en:"Narrowing…", es:"Acotando…"});
    risultati.hidden = true;
    mostraStato(_L({it:"Cerco le ipotesi per ", en:"Looking for hypotheses for ", es:"Buscando hipótesis para "}) + "“" + sintomo + "”…", false);

    fetch("/v1/diagnosi", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json", "X-Device-Id": devId() },
      body: JSON.stringify(body)
    })
    .then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(d){ return { status: r.status, body: d }; });
    })
    .then(function(res){
      var d = res.body || {};
      if (res.status < 200 || res.status >= 300 || d.errore){
        mostraStato(d.errore ? (_L({it:"Diagnosi non riuscita: ", en:"Diagnosis failed: ", es:"Diagnóstico fallido: "}) + d.errore)
                             : _L({it:"Diagnosi non riuscita (errore "+res.status+").", en:"Diagnosis failed (error "+res.status+").", es:"Diagnóstico fallido (error "+res.status+")."}), true);
        return;
      }
      pulisciStato();
      _ultima = { sintomo: sintomo, d: d };
      mostraRisultati(sintomo, d);
    })
    .catch(function(){
      mostraStato(_L({it:"Il server non è raggiungibile ora. Riprova tra poco.", en:"The server is unreachable now. Try again shortly.", es:"El servidor no está disponible ahora. Inténtalo en un momento."}), true);
    })
    .then(function(){
      inCorso = false;
      btn.disabled = false;
      btn.textContent = testoOrig;
    });
  });

  // ri-traduce i risultati generati da JS al cambio lingua (salta la prima
  // invocazione; i campi statici del form li gestisce data-i18n).
  var _primaI18n = true;
  window.onI18nApply = function(){
    if (_primaI18n){ _primaI18n = false; return; }
    if (_ultima) mostraRisultati(_ultima.sintomo, _ultima.d);
  };

})();
</script>

<!-- VOCALE (STT) + VISION (foto): gating Pro+login fedele al vecchio FE, solo token matter3.css -->
<script>
/* ============================================================================
   VOCALE (STT /v1/stt) + VISION (/v1/vision) per il NUOVO frontend.
   Fedele al vecchio FE (static/matter.js): stesso gating Pro+login, stessi
   contratti. Solo token di matter3.css, nessuna dipendenza nuova.
   Un UNICO blocco identico per causa-nuovo.html e chat-nuovo.html: si cabla
   da solo in base agli elementi presenti nella pagina.
   ========================================================================== */
(function(){
  "use strict";

  var OLDFE = "/app"; // FE vecchio: registrazione e upgrade Pro vivono lì

  function LL(o){ return (typeof window._L === "function") ? window._L(o) : (o[(window._lang||"it")] || o.it); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  function getTok(){ try{ return localStorage.getItem("matter_token") || ""; }catch(e){ return ""; } }
  function getPiano(){ try{ return localStorage.getItem("matter_piano") || ""; }catch(e){ return ""; } }
  function isPro(){ return !!getTok() && getPiano() === "pro"; }

  // device id: stesso pattern delle altre pagine nuove (serve al merge anonimo->account)
  function devId(){
    try{
      var d = localStorage.getItem("matter_device_id") || localStorage.getItem("matter_token");
      if(!d){
        d = (window.crypto && crypto.randomUUID)
          ? crypto.randomUUID()
          : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c){ var r=Math.random()*16|0, v=c==="x"?r:(r&0x3|0x8); return v.toString(16); });
        localStorage.setItem("matter_device_id", d);
      }
      return d;
    }catch(e){ return "anon"; }
  }

  // ---------- area messaggi (sotto i bottoni) ----------
  var msgEl = null;
  function showMsg(txt, kind){ if(!msgEl) return; msgEl.hidden=false; msgEl.className="media-msg"+(kind?(" "+kind):""); msgEl.textContent=txt; }
  function showMsgHtml(html, kind){ if(!msgEl) return; msgEl.hidden=false; msgEl.className="media-msg"+(kind?(" "+kind):""); msgEl.innerHTML=html; }
  function clearMsg(){ if(msgEl){ msgEl.hidden=true; msgEl.textContent=""; msgEl.className="media-msg"; } }

  function proMsg(){
    showMsgHtml(
      LL({it:"Questa funzione è disponibile nel piano <b>Pro</b>. ", en:"This feature is available on the <b>Pro</b> plan. ", es:"Esta función está disponible en el plan <b>Pro</b>. "})
      + '<a href="'+OLDFE+'">'+LL({it:"Fai l'upgrade nell'app", en:"Upgrade in the app", es:"Mejora tu plan en la app"})+'</a>.',
      "err"
    );
  }

  // ---------- foglio di LOGIN minimo (solo accesso) ----------
  var sheet=null, sheetEls=null, onOk=null;

  function buildSheet(){
    if(sheet) return;
    var scrim=document.createElement("div");
    scrim.className="ms-scrim"; scrim.hidden=true;
    scrim.setAttribute("role","dialog"); scrim.setAttribute("aria-modal","true"); scrim.setAttribute("aria-label","Login");
    scrim.innerHTML =
      '<div class="ms-card" role="document">'
      + '<h2 class="ms-title"></h2>'
      + '<p class="ms-sub"></p>'
      + '<form class="ms-form" autocomplete="on" novalidate>'
      +   '<label class="ms-field"><span class="ms-l-email"></span>'
      +     '<input type="email" class="ms-email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false"></label>'
      +   '<label class="ms-field"><span class="ms-l-pw"></span>'
      +     '<input type="password" class="ms-pw" autocomplete="current-password"></label>'
      +   '<div class="ms-msg" aria-live="polite"></div>'
      +   '<div class="ms-actions">'
      +     '<button type="button" class="btn btn--ghost ms-cancel" style="flex:1"></button>'
      +     '<button type="submit" class="btn ms-submit" style="flex:1"></button>'
      +   '</div>'
      + '</form>'
      + '<p class="ms-note"></p>'
      + '</div>';
    document.body.appendChild(scrim);
    sheet=scrim;
    sheetEls={
      card: scrim.querySelector(".ms-card"),
      title: scrim.querySelector(".ms-title"),
      sub: scrim.querySelector(".ms-sub"),
      form: scrim.querySelector(".ms-form"),
      lEmail: scrim.querySelector(".ms-l-email"),
      lPw: scrim.querySelector(".ms-l-pw"),
      email: scrim.querySelector(".ms-email"),
      pw: scrim.querySelector(".ms-pw"),
      msg: scrim.querySelector(".ms-msg"),
      cancel: scrim.querySelector(".ms-cancel"),
      submit: scrim.querySelector(".ms-submit"),
      note: scrim.querySelector(".ms-note")
    };
    // chiusura: click sullo scrim, Esc, bottone annulla
    scrim.addEventListener("click", function(e){ if(e.target===scrim) closeLogin(); });
    sheetEls.cancel.addEventListener("click", closeLogin);
    document.addEventListener("keydown", function(e){ if(e.key==="Escape" && sheet && !sheet.hidden) closeLogin(); });
    sheetEls.form.addEventListener("submit", function(e){ e.preventDefault(); doLogin(); });
    labelSheet();
  }

  function labelSheet(){
    if(!sheetEls) return;
    sheetEls.title.textContent = LL({it:"Accedi a Matter", en:"Sign in to Matter", es:"Inicia sesión en Matter"});
    sheetEls.sub.textContent   = LL({it:"Vocale e foto sono funzioni Pro: accedi per usarle.", en:"Voice and photo are Pro features: sign in to use them.", es:"Voz y foto son funciones Pro: inicia sesión para usarlas."});
    sheetEls.lEmail.textContent= LL({it:"Email", en:"Email", es:"Correo"});
    sheetEls.lPw.textContent   = LL({it:"Password", en:"Password", es:"Contraseña"});
    sheetEls.cancel.textContent= LL({it:"Annulla", en:"Cancel", es:"Cancelar"});
    sheetEls.submit.textContent= LL({it:"Accedi", en:"Sign in", es:"Entrar"});
    sheetEls.email.setAttribute("placeholder", LL({it:"tu@email.it", en:"you@email.com", es:"tu@email.com"}));
    sheetEls.pw.setAttribute("placeholder", "••••••••");
    sheetEls.note.innerHTML = LL({it:"Non hai un account o il piano Pro? ", en:"No account or Pro plan yet? ", es:"¿Aún no tienes cuenta o plan Pro? "})
      + '<a href="'+OLDFE+'">'+LL({it:"Registrati o fai l'upgrade nell'app", en:"Register or upgrade in the app", es:"Regístrate o mejora tu plan en la app"})+'</a>.';
  }

  function openLogin(cb){
    buildSheet();
    onOk = (typeof cb==="function") ? cb : null;
    labelSheet();
    sheetEls.msg.textContent=""; sheetEls.msg.className="ms-msg";
    sheet.hidden=false;
    try{ sheetEls.email.focus(); }catch(e){}
  }
  function closeLogin(){ if(sheet){ sheet.hidden=true; } }

  function doLogin(){
    var email=(sheetEls.email.value||"").trim();
    var pw=sheetEls.pw.value||"";
    if(!email || !pw){
      sheetEls.msg.textContent = LL({it:"Inserisci email e password.", en:"Enter email and password.", es:"Introduce correo y contraseña."});
      return;
    }
    sheetEls.submit.disabled=true;
    var orig=sheetEls.submit.textContent;
    sheetEls.submit.textContent = LL({it:"Accesso…", en:"Signing in…", es:"Entrando…"});
    sheetEls.msg.className="ms-msg"; sheetEls.msg.textContent="";
    fetch("/v1/auth/login", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "X-Device-Id": devId() },
      body: JSON.stringify({ email:email, password:pw, lang:(window._lang||"it") })
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(j){ return {status:r.status, ok:r.ok, j:j}; });
    }).then(function(res){
      sheetEls.submit.disabled=false; sheetEls.submit.textContent=orig;
      var j=res.j||{};
      if(res.ok && j.token){
        try{ localStorage.setItem("matter_token", j.token); }catch(e){}
        try{ if(j.piano) localStorage.setItem("matter_piano", j.piano); }catch(e){}
        closeLogin();
        if(isPro()){
          showMsg(LL({it:"Accesso riuscito.", en:"Signed in.", es:"Sesión iniciada."}), "ok");
        } else {
          proMsg();
        }
        try{ if(onOk) onOk(); }catch(e){}
      } else if(res.status===429){
        sheetEls.msg.textContent = j.errore || LL({it:"Troppi tentativi. Attendi un minuto.", en:"Too many attempts. Wait a minute.", es:"Demasiados intentos. Espera un minuto."});
      } else {
        sheetEls.msg.textContent = j.errore || LL({it:"Accesso non riuscito. Controlla le credenziali.", en:"Sign-in failed. Check your credentials.", es:"Error de acceso. Revisa tus credenciales."});
      }
    }).catch(function(){
      sheetEls.submit.disabled=false; sheetEls.submit.textContent=orig;
      sheetEls.msg.textContent = LL({it:"Rete non raggiungibile. Riprova.", en:"Network unreachable. Try again.", es:"Red no disponible. Inténtalo de nuevo."});
    });
  }

  // ---------- gate dei 3 stati ----------
  // ritorna true se può procedere; altrimenti gestisce lo stato (login / Pro) e ritorna false
  function gate(retry){
    if(!getTok()){ openLogin(retry); return false; }   // non loggato -> foglio di login
    if(!isPro()){ proMsg(); return false; }             // loggato ma non Pro
    return true;                                         // Pro
  }

  // ---------- VOCALE (STT) ----------
  var rec=null, chunks=[];
  function fileName(blob){
    var t=(blob && blob.type) || "";
    if(t.indexOf("mp4")>=0) return "audio.mp4";
    if(t.indexOf("m4a")>=0 || t.indexOf("x-m4a")>=0) return "audio.m4a";
    if(t.indexOf("wav")>=0) return "audio.wav";
    if(t.indexOf("ogg")>=0) return "audio.ogg";
    return "audio.webm";
  }

  function onMicClick(btn, target, isChat){
    if(rec && rec.state==="recording"){ stopRec(btn); return; }
    clearMsg();
    if(!gate(function(){ onMicClick(btn, target, isChat); })) return;
    startRec(btn, target, isChat);
  }

  function startRec(btn, target, isChat){
    if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) || typeof MediaRecorder==="undefined"){
      showMsg(LL({it:"Registrazione non supportata su questo dispositivo.", en:"Recording isn't supported on this device.", es:"La grabación no es compatible con este dispositivo."}), "err");
      return;
    }
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      chunks=[];
      try{ rec=new MediaRecorder(stream, {mimeType:"audio/webm"}); }
      catch(e){ try{ rec=new MediaRecorder(stream); }catch(e2){ stream.getTracks().forEach(function(t){t.stop();}); showMsg(LL({it:"Registrazione non disponibile.", en:"Recording unavailable.", es:"Grabación no disponible."}), "err"); return; } }
      rec.ondataavailable=function(e){ if(e.data && e.data.size>0) chunks.push(e.data); };
      rec.onstop=function(){
        stream.getTracks().forEach(function(t){ t.stop(); });
        btn.classList.remove("rec"); btn.setAttribute("aria-pressed","false");
        var blob=new Blob(chunks, {type:(rec && rec.mimeType) || "audio/webm"});
        uploadStt(blob, btn, target, isChat);
      };
      rec.start();
      btn.classList.add("rec"); btn.setAttribute("aria-pressed","true");
      showMsg(LL({it:"Sto ascoltando… tocca di nuovo per fermare.", en:"Listening… tap again to stop.", es:"Escuchando… toca de nuevo para parar."}), "");
    }).catch(function(){
      showMsg(LL({it:"Microfono non disponibile o permesso negato.", en:"Microphone unavailable or permission denied.", es:"Micrófono no disponible o permiso denegado."}), "err");
    });
  }

  function stopRec(btn){
    try{ if(rec && rec.state==="recording") rec.stop(); }catch(e){}
    btn.classList.remove("rec"); btn.classList.add("busy"); btn.setAttribute("aria-pressed","false");
    showMsg(LL({it:"Trascrivo…", en:"Transcribing…", es:"Transcribiendo…"}), "");
  }

  function uploadStt(blob, btn, target, isChat){
    btn.classList.add("busy");
    var fd=new FormData(); fd.append("audio", blob, fileName(blob));
    fetch("/v1/stt?lang="+(window._lang||"it"), { method:"POST", headers:{ "X-Token": getTok() }, body: fd })
    .then(function(r){
      if(r.status===401){ btn.classList.remove("busy"); openLogin(function(){ onMicClick(btn, target, isChat); }); return null; }
      if(r.status===403){ btn.classList.remove("busy"); proMsg(); return null; }
      return r.json().catch(function(){ return {}; });
    }).then(function(j){
      if(j===null) return;
      btn.classList.remove("busy");
      if(j.trascrizione){ fillInto(target, j.trascrizione, isChat); clearMsg(); }
      else if(j.errore && j.errore.indexOf("Pro")>=0){ proMsg(); }
      else { showMsg(j.errore || LL({it:"Trascrizione non riuscita.", en:"Transcription failed.", es:"Transcripción fallida."}), "err"); }
    }).catch(function(){
      btn.classList.remove("busy");
      showMsg(LL({it:"Errore di rete durante la trascrizione.", en:"Network error during transcription.", es:"Error de red durante la transcripción."}), "err");
    });
  }

  function fillInto(target, testo, isChat){
    if(!target) return;
    target.value = testo;
    try{ target.focus(); }catch(e){}
    if(isChat){ try{ target.dispatchEvent(new Event("input", {bubbles:true})); }catch(e){} }
  }

  // ---------- VISION (foto) ----------
  function onFotoClick(input){
    clearMsg();
    if(!gate(function(){ try{ input.click(); }catch(e){} })) return;
    try{ input.click(); }catch(e){}
  }

  function sendFoto(file, outEl){
    if(!file) return;
    if(!gate(function(){ sendFoto(file, outEl); })) return;
    var previewUrl=null;
    try{ previewUrl=URL.createObjectURL(file); }catch(e){}
    if(outEl){
      outEl.hidden=false; outEl.className="vision-out busy";
      outEl.innerHTML = (previewUrl?('<img src="'+previewUrl+'" alt="">'):"")
        + '<span class="vo-lab">'+esc(LL({it:"Analisi foto", en:"Photo analysis", es:"Análisis de foto"}))+'</span>'
        + '<div class="vo-txt">'+esc(LL({it:"Analizzo l'immagine…", en:"Analysing the image…", es:"Analizando la imagen…"}))+'</div>';
    }
    var fd=new FormData(); fd.append("immagine", file);
    fetch("/v1/vision?lang="+(window._lang||"it"), { method:"POST", headers:{ "X-Token": getTok() }, body: fd })
    .then(function(r){
      if(r.status===401){ if(outEl){ outEl.hidden=true; } openLogin(function(){ sendFoto(file, outEl); }); return null; }
      if(r.status===403){ if(outEl){ outEl.hidden=true; } proMsg(); return null; }
      return r.json().catch(function(){ return {}; });
    }).then(function(j){
      if(j===null) return;
      if(!outEl) return;
      outEl.className="vision-out";
      if(j.analisi){
        outEl.innerHTML = (previewUrl?('<img src="'+previewUrl+'" alt="">'):"")
          + '<span class="vo-lab">'+esc(LL({it:"Analisi foto", en:"Photo analysis", es:"Análisis de foto"}))+'</span>'
          + '<div class="vo-txt">'+esc(j.analisi)+'</div>';
      } else if(j.errore && j.errore.indexOf("Pro")>=0){
        outEl.hidden=true; proMsg();
      } else {
        outEl.innerHTML = (previewUrl?('<img src="'+previewUrl+'" alt="">'):"")
          + '<span class="vo-lab">'+esc(LL({it:"Analisi foto", en:"Photo analysis", es:"Análisis de foto"}))+'</span>'
          + '<div class="vo-txt">'+esc(j.errore || LL({it:"Analisi non riuscita.", en:"Analysis failed.", es:"Análisis fallido."}))+'</div>';
      }
    }).catch(function(){
      if(outEl){
        outEl.className="vision-out";
        outEl.innerHTML = '<span class="vo-lab">'+esc(LL({it:"Analisi foto", en:"Photo analysis", es:"Análisis de foto"}))+'</span>'
          + '<div class="vo-txt">'+esc(LL({it:"Errore di rete durante l'analisi.", en:"Network error during analysis.", es:"Error de red durante el análisis."}))+'</div>';
      }
    });
  }

  // ---------- cablaggio (identico per entrambe le pagine) ----------
  function wire(){
    msgEl = document.getElementById("media-msg");
    var sintomo = document.getElementById("sintomo");
    var domanda = document.getElementById("domanda");
    var target  = sintomo || domanda;
    var isChat  = !sintomo && !!domanda;

    var btnMic = document.getElementById("btn-mic");
    if(btnMic){
      btnMic.setAttribute("aria-pressed","false");
      btnMic.addEventListener("click", function(){ onMicClick(btnMic, target, isChat); });
    }

    var btnFoto  = document.getElementById("btn-foto");
    var fotoInput= document.getElementById("foto-input");
    var visionOut= document.getElementById("vision-out");
    if(btnFoto && fotoInput){
      btnFoto.addEventListener("click", function(){ onFotoClick(fotoInput); });
      fotoInput.addEventListener("change", function(){
        if(fotoInput.files && fotoInput.files[0]){ sendFoto(fotoInput.files[0], visionOut); }
        fotoInput.value="";
      });
    }

    // ri-etichetta il foglio di login al cambio lingua, senza rompere l'hook esistente
    var prevApply = window.onI18nApply;
    window.onI18nApply = function(l){
      if(typeof prevApply==="function"){ try{ prevApply(l); }catch(e){} }
      if(sheet && !sheet.hidden) labelSheet();
    };
  }

  if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded", wire); }
  else { wire(); }
})();
</script>
