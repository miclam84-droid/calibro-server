<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scopri — Matter Bench</title>
<meta name="description" content="Il grafo vero: lo spessore del legame è il numero di composti aromatici condivisi. Una parentela da esplorare, non un voto.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Schibsted+Grotesk:wght@500;700;800&display=swap">
<link rel="stylesheet" href="/static/matter3.css">
<style>
  /* --- SCOPRI NUOVO: solo lo stretto necessario oltre matter3.css --- */
  .scopri-testa{margin-top:22px}
  .scopri-testa h1{font-size:24px}
  .scopri-testa .scopri-centro{font-family:var(--display); font-weight:800}
  .scopri-sub{font-size:13px; color:var(--ink-soft); margin-top:6px}

  /* foto tonda discreta accanto al titolo (SUPPORTO: se manca, resta il disco verde) */
  .scopri-intesta{display:flex; align-items:center; gap:14px}
  .scopri-intesta-testo{min-width:0}
  .scopri-foto-wrap{flex:0 0 auto}
  .scopri-foto{width:58px; height:58px; border-radius:50%; object-fit:cover;
    border:2px solid var(--verde); display:block; cursor:pointer}
  .scopri-foto:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
  .scopri-foto-cred{font-size:11px; color:var(--ink-soft); margin-top:8px}

  /* tela del grafo */
  .grafo-tela{
    margin-top:18px; background:var(--surface); border:1px solid var(--riga);
    border-radius:var(--r); box-shadow:var(--shadow); padding:8px;
    overflow:hidden;
  }
  .grafo-tela svg{display:block; width:100%; height:auto; touch-action:manipulation}

  /* nodi e legami SVG */
  .nodo{cursor:pointer}
  .nodo .nodo-disco{fill:var(--surface); stroke:var(--riga); stroke-width:1.5}
  .nodo .nodo-et{font-family:var(--sans); font-weight:600; font-size:12px; fill:var(--ink)}
  .nodo:focus-visible{outline:none}
  .nodo:focus-visible .nodo-disco{stroke:var(--verde); stroke-width:2.5}
  .nodo-centro .nodo-disco{fill:var(--verde); stroke:var(--verde)}
  .nodo-centro .nodo-et{fill:#fff; font-family:var(--display); font-weight:700; font-size:13px}

  .legame{fill:none; stroke-linecap:round}
  .legame-hit{fill:none; stroke:transparent; stroke-width:22; cursor:pointer}
  .legame-dot{cursor:pointer; stroke:#fff; stroke-width:2}

  .legenda{display:flex; flex-wrap:wrap; gap:10px 16px; margin-top:14px; font-size:12px; color:var(--ink-soft)}
  .legenda .lg{display:inline-flex; align-items:center; gap:7px}
  .legenda .lg i{width:22px; height:0; display:inline-block; border-top-width:3px; border-top-style:solid; border-radius:2px}
  .lg-base i{border-top-color:var(--segnale)}
  .lg-contr i{border-top-color:var(--oxblood)}
  .lg-trad i{border-top-color:var(--ink-soft); border-top-style:dashed}

  /* messaggio onesto */
  .scopri-onesto{
    margin-top:14px; background:var(--panel); border:1px solid var(--riga);
    border-radius:var(--r); padding:14px 16px; font-size:14px; color:var(--ink); line-height:1.45;
  }
  .scopri-onesto strong{font-weight:600}

  /* pannello legame (bottom sheet) */
  .sheet-velo{
    position:fixed; inset:0; background:rgba(29,42,34,.38); z-index:40;
    opacity:0; pointer-events:none; transition:opacity .18s ease;
  }
  .sheet-velo[data-aperto="1"]{opacity:1; pointer-events:auto}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:41;
    max-width:var(--maxw); margin:0 auto;
    background:var(--surface); border:1px solid var(--riga);
    border-radius:var(--r) var(--r) 0 0; box-shadow:var(--shadow);
    padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));
    transform:translateY(102%); transition:transform .2s ease;
  }
  .sheet-velo[data-aperto="1"] .sheet{transform:translateY(0)}
  .sheet-presa{width:40px; height:4px; border-radius:var(--r-pill); background:var(--riga); margin:0 auto 12px}
  .sheet-titolo{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
  .sheet-titolo h2{font-size:18px}
  .sheet-coppia{font-size:13px; color:var(--ink-soft); margin-top:2px}
  .sheet-numero{margin-top:14px; display:flex; align-items:baseline; gap:8px}
  .sheet-numero .valore{font-family:var(--display); font-weight:800; font-size:40px; line-height:1; color:var(--ink); font-variant-numeric:tabular-nums}
  .sheet-numero .etichetta{font-size:13px; color:var(--ink-soft); font-weight:600}
  .sheet-comps{margin-top:12px}
  .sheet-comps .eyebrow{display:block; margin-bottom:8px}
  .comp-chips{display:flex; flex-wrap:wrap; gap:7px}
  .comp-chip{
    font-family:var(--sans); font-size:12.5px; color:var(--verde); background:var(--tint);
    border-radius:var(--r-pill); padding:5px 11px; line-height:1;
  }
  .sheet-prov{margin-top:14px}
  .sheet-limite{
    margin-top:14px; border-top:1px solid var(--riga); padding-top:12px;
    font-size:13px; color:var(--ink-soft); line-height:1.5;
  }
  .sheet-limite strong{color:var(--ink); font-weight:600}
  .sheet-chiudi{margin-top:16px}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="wm" href="/nuovo" aria-label="Matter Bench — home"><span>Matter</span><span class="bench">Bench</span></a>
    <span class="eyebrow" data-i18n="eyebrow_scopri">scopri</span>
  </div>
</header>

<main class="wrap">

  <!-- RICERCA: ricentra il grafo su un altro ingrediente -->
  <form class="srch" id="srch" role="search" onsubmit="return false">
    <input type="search" id="q" name="q" placeholder="Centra su un ingrediente (es. pomodoro)" aria-label="Centra il grafo su un ingrediente" autocomplete="off" data-i18n-ph="centra_ph" data-i18n-aria="centra_aria">
    <button type="submit" data-i18n="centra_btn">Centra</button>
  </form>

  <section class="scopri-testa">
    <div class="scopri-intesta">
      <div class="scopri-foto-wrap" id="centro-foto-wrap" hidden>
        <img class="scopri-foto" id="centro-foto" alt="" tabindex="0" role="button" aria-label="Mostra la fonte della foto" data-i18n-aria="foto_fonte_aria">
      </div>
      <div class="scopri-intesta-testo">
        <span class="eyebrow" data-i18n="al_centro">Al centro del grafo</span>
        <h1 class="scopri-centro" id="centro-nome">…</h1>
      </div>
    </div>
    <p class="scopri-sub" id="centro-sub" data-i18n="scopri_sub">Lo spessore di un legame è il numero di composti aromatici che i due ingredienti condividono davvero. Tocca un vicino per ricentrare, tocca un legame per vederne la prova.</p>
    <div class="scopri-foto-cred" id="centro-foto-cred" hidden></div>
    <a class="btn btn--ghost" id="vai-componi" href="/componi-nuovo" style="margin-top:14px">Componi con questo ingrediente →</a>
  </section>

  <div class="grafo-tela" id="tela" aria-label="Grafo ego-centrico dell'ingrediente" data-i18n-aria="tela_aria">
    <svg id="svg" viewBox="0 0 400 460" role="img" preserveAspectRatio="xMidYMid meet"></svg>
  </div>

  <div class="scopri-onesto" id="onesto" hidden></div>

  <div class="legenda" aria-hidden="true">
    <span class="lg lg-base"><i></i> <span data-i18n="lg_base">parentela aromatica</span></span>
    <span class="lg lg-contr"><i></i> <span data-i18n="lg_contr">contrasto</span></span>
    <span class="lg lg-trad"><i></i> <span data-i18n="lg_trad">tradizione</span></span>
  </div>

</main>

<!-- PANNELLO LEGAME -->
<div class="sheet-velo" id="velo" data-aperto="0">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h" id="sheet">
    <div class="sheet-presa" aria-hidden="true"></div>
    <div class="sheet-titolo">
      <h2 id="sheet-h" data-i18n="legame_h">Legame</h2>
    </div>
    <p class="sheet-coppia" id="sheet-coppia"></p>
    <div id="sheet-corpo"></div>
    <button class="btn btn--block sheet-chiudi" id="sheet-chiudi" type="button" data-i18n="chiudi">Chiudi</button>
  </div>
</div>

<!-- i18n (it · en · es) — dizionario di pagina + motore condiviso (prima dell'IIFE: serve _L) -->
<script>
window.I18N_TITLE = {it:"Scopri — Matter Bench", en:"Discover — Matter Bench", es:"Descubrir — Matter Bench"};
window.I18N_DICT = {
  eyebrow_scopri: {it:"scopri", en:"discover", es:"descubrir"},
  centra_ph:  {it:"Centra su un ingrediente (es. pomodoro)", en:"Centre on an ingredient (e.g. tomato)", es:"Centra en un ingrediente (p. ej. tomate)"},
  centra_aria:{it:"Centra il grafo su un ingrediente", en:"Centre the graph on an ingredient", es:"Centra el grafo en un ingrediente"},
  centra_btn: {it:"Centra", en:"Centre", es:"Centrar"},
  al_centro:  {it:"Al centro del grafo", en:"At the centre of the graph", es:"En el centro del grafo"},
  scopri_sub: {it:"Lo spessore di un legame è il numero di composti aromatici che i due ingredienti condividono davvero. Tocca un vicino per ricentrare, tocca un legame per vederne la prova.", en:"The thickness of a link is the number of aroma compounds the two ingredients really share. Tap a neighbour to re-centre, tap a link to see its evidence.", es:"El grosor de un vínculo es el número de compuestos aromáticos que los dos ingredientes comparten de verdad. Toca un vecino para recentrar, toca un vínculo para ver su evidencia."},
  lg_base:    {it:"parentela aromatica", en:"aromatic kinship", es:"parentesco aromático"},
  lg_contr:   {it:"contrasto", en:"contrast", es:"contraste"},
  lg_trad:    {it:"tradizione", en:"tradition", es:"tradición"},
  legame_h:   {it:"Legame", en:"Link", es:"Vínculo"},
  chiudi:     {it:"Chiudi", en:"Close", es:"Cerrar"},
  foto_fonte_aria: {it:"Mostra la fonte della foto", en:"Show the photo source", es:"Muestra la fuente de la foto"},
  tela_aria: {it:"Grafo ego-centrico dell'ingrediente", en:"Ego-centric graph of the ingredient", es:"Grafo egocéntrico del ingrediente"}
};
</script>
<script src="/static/i18n-nuovo.js"></script>

<script>
(function(){
  "use strict";

  var INGREDIENTE = {{ ingrediente|tojson }};
  var FONTE = "Ahn et al. 2011";
  function LIMITE(){ return _L({
    it:"Condividere molecole volatili suggerisce una parentela aromatica — non prova che l'abbinamento piaccia. È un ponte da esplorare, non un voto.",
    en:"Sharing volatile molecules suggests an aromatic kinship — it doesn't prove the pairing will please. It's a bridge to explore, not a verdict.",
    es:"Compartir moléculas volátiles sugiere un parentesco aromático — no prueba que el maridaje guste. Es un puente para explorar, no un veredicto."
  }); }

  var SVGNS = "http://www.w3.org/2000/svg";
  var svg = document.getElementById("svg");
  var VB_W = 400, VB_H = 460, CX = 200, CY = 226, RADIO = 132;
  var MAX_VICINI = 10;

  function el(tag, attrs){
    var e = document.createElementNS(SVGNS, tag);
    if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function tronca(s, n){ s = String(s); return s.length > n ? s.slice(0, n-1) + "…" : s; }
  function cap(s){ s = String(s||""); return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

  // dedup preservando l'ordine (la sorgente ha doppioni nei composti)
  function dedup(arr){
    var visti = Object.create(null), out = [];
    (arr || []).forEach(function(x){
      var k = String(x).toLowerCase().trim();
      if (!k || visti[k]) return;
      visti[k] = 1; out.push(x);
    });
    return out;
  }

  function composti(rel){
    var ev = rel && rel.evidenza || {};
    var n = ev.composti_condivisi;
    return (typeof n === "number" && isFinite(n)) ? n : null;
  }

  // ---- PANNELLO ----
  var velo = document.getElementById("velo");
  var corpo = document.getElementById("sheet-corpo");
  var coppia = document.getElementById("sheet-coppia");
  function apriPannello(centro, rel){
    coppia.textContent = cap(centro) + " · " + cap(rel.ingrediente);
    var crit = rel.criterio;
    var n = composti(rel);
    var html = "";

    if (crit === "base_aromatica" && n !== null) {
      var comps = dedup((rel.evidenza || {}).composti_caratterizzanti);
      html += '<div class="sheet-numero"><span class="valore num">' + n + '</span>' +
              '<span class="etichetta">' + _L({it:"composti aromatici condivisi", en:"shared aroma compounds", es:"compuestos aromáticos compartidos"}) + '</span></div>';
      if (comps.length) {
        html += '<div class="sheet-comps"><span class="eyebrow">' + _L({it:"Composti caratterizzanti", en:"Characterising compounds", es:"Compuestos caracterizantes"}) + '</span>' +
                '<div class="comp-chips">';
        comps.forEach(function(c){ html += '<span class="comp-chip">' + esc(c) + '</span>'; });
        html += '</div></div>';
      }
      html += '<div class="sheet-prov"><span class="prov prov-fonte">' + esc(FONTE) + '</span></div>';
    } else if (crit === "tradizione") {
      html += '<p class="sheet-coppia" style="margin-top:12px">' + _L({
        it:"Relazione di <strong>tradizione</strong>: accostamento documentato dalla cultura, <strong>non</strong> un legame molecolare. Qui il grafo non conta composti condivisi.",
        en:"A <strong>tradition</strong> relation: a pairing documented by culture, <strong>not</strong> a molecular link. Here the graph counts no shared compounds.",
        es:"Relación de <strong>tradición</strong>: una combinación documentada por la cultura, <strong>no</strong> un vínculo molecular. Aquí el grafo no cuenta compuestos compartidos."
      }) + '</p>';
    } else if (crit === "contrasto") {
      html += '<p class="sheet-coppia" style="margin-top:12px">' + _L({
        it:"Relazione di <strong>contrasto</strong> documentata nel grafo (relazione curata). ",
        en:"A <strong>contrast</strong> relation documented in the graph (a curated relation). ",
        es:"Relación de <strong>contraste</strong> documentada en el grafo (relación curada). "
      }) +
              (n !== null ? '' : _L({
                it:"Senza un conteggio di composti condivisi: non è un legame molecolare misurato.",
                en:"Without a count of shared compounds: it is not a measured molecular link.",
                es:"Sin un recuento de compuestos compartidos: no es un vínculo molecular medido."
              })) + '</p>';
    }

    html += '<p class="sheet-limite"><strong>' + _L({it:"Il limite.", en:"The limit.", es:"El límite."}) + '</strong> ' + esc(LIMITE()) + '</p>';
    corpo.innerHTML = html;
    velo.setAttribute("data-aperto", "1");
  }
  function chiudiPannello(){ velo.setAttribute("data-aperto", "0"); }
  document.getElementById("sheet-chiudi").addEventListener("click", chiudiPannello);
  velo.addEventListener("click", function(e){ if (e.target === velo) chiudiPannello(); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") chiudiPannello(); });

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  // ---- COLORE / STILE del legame secondo criterio ----
  function stileLegame(rel){
    var n = composti(rel);
    if (rel.criterio === "base_aromatica") return {colore: "var(--segnale)", tratteggio: false, haComposti: n !== null && n > 0, n: n};
    if (rel.criterio === "contrasto")      return {colore: "var(--oxblood)", tratteggio: (n === null), haComposti: n !== null && n > 0, n: n};
    return {colore: "var(--ink-soft)", tratteggio: true, haComposti: false, n: null}; // tradizione
  }

  // ---- DISEGNO ----
  function nodoCentrale(nome){
    var g = el("g", {"class": "nodo nodo-centro"});
    g.appendChild(el("circle", {"class": "nodo-disco", cx: CX, cy: CY, r: 38}));
    var t = el("text", {"class": "nodo-et", x: CX, y: CY + 4, "text-anchor": "middle"});
    t.textContent = tronca(cap(nome), 11);
    g.appendChild(t);
    svg.appendChild(g);
  }

  function disegna(centro, relazioni){
    svg.innerHTML = "";
    // scala spessore: 2..11 sul massimo dei composti_condivisi VERI tra le base_aromatica
    var maxN = 1;
    relazioni.forEach(function(r){ var n = composti(r); if (r.criterio === "base_aromatica" && n && n > maxN) maxN = n; });

    var N = relazioni.length;
    relazioni.forEach(function(rel, i){
      var ang = (-Math.PI/2) + (2*Math.PI * i / Math.max(N,1));
      var x = CX + RADIO * Math.cos(ang);
      var y = CY + RADIO * Math.sin(ang);
      var st = stileLegame(rel);

      // spessore: vero se abbiamo composti, altrimenti linea sottile (nessun numero finto)
      var w = st.haComposti ? (2 + (st.n / maxN) * 9) : 1.3;

      // linea
      var linea = el("line", {"class": "legame", x1: CX, y1: CY, x2: x, y2: y});
      linea.style.stroke = st.colore;
      linea.style.strokeWidth = w.toFixed(2);
      if (st.tratteggio) linea.setAttribute("stroke-dasharray", "4 4");
      svg.appendChild(linea);

      // area di tocco larga + pallino affordance a metà legame
      var mx = CX + (x - CX) * 0.56, my = CY + (y - CY) * 0.56;
      var hit = el("line", {"class": "legame-hit", x1: CX, y1: CY, x2: x, y2: y});
      var dot = el("circle", {"class": "legame-dot", cx: mx, cy: my, r: 7, tabindex: "0", role: "button"});
      dot.style.fill = st.colore;
      dot.setAttribute("aria-label", _L({it:"Prova del legame con ", en:"Evidence of the link with ", es:"Evidencia del vínculo con "}) + cap(rel.ingrediente));
      function openLink(e){ e.stopPropagation(); apriPannello(centro, rel); }
      hit.addEventListener("click", openLink);
      dot.addEventListener("click", openLink);
      dot.addEventListener("keydown", function(e){ if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openLink(e); } });
      svg.appendChild(hit);
      svg.appendChild(dot);

      // etichetta "tradizione" sul legame grigio
      if (rel.criterio === "tradizione") {
        var lt = el("text", {x: mx, y: my - 11, "text-anchor": "middle"});
        lt.setAttribute("font-size", "9.5");
        lt.setAttribute("fill", "var(--ink-soft)");
        lt.setAttribute("font-weight", "600");
        lt.textContent = _L({it:"tradizione", en:"tradition", es:"tradición"});
        svg.appendChild(lt);
      }

      // nodo vicino (tap -> ricentra)
      var g = el("g", {"class": "nodo", tabindex: "0", role: "link"});
      g.setAttribute("aria-label", _L({it:"Centra su ", en:"Centre on ", es:"Centra en "}) + cap(rel.ingrediente));
      g.appendChild(el("circle", {"class": "nodo-disco", cx: x, cy: y, r: 26}));
      // etichetta SEMPRE centrata sopra/sotto il nodo (mai ai lati: sforerebbe il grafo),
      // con x bloccata dentro i margini cosi nessun nome viene tagliato.
      var sopra = Math.sin(ang) < -0.05;
      var lx = Math.max(46, Math.min(VB_W - 46, x));
      var ly = y + (sopra ? -(26 + 10) : (26 + 18));
      var te = el("text", {"class": "nodo-et", x: lx, y: ly, "text-anchor": "middle"});
      te.textContent = tronca(cap(rel.ingrediente), 12);
      g.appendChild(te);
      function go(){ location.href = "/scopri-nuovo/" + encodeURIComponent(rel.ingrediente); }
      g.addEventListener("click", go);
      g.addEventListener("keydown", function(e){ if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
      svg.appendChild(g);
    });

    nodoCentrale(centro); // sopra i legami
  }

  function soloCentro(centro){ svg.innerHTML = ""; nodoCentrale(centro); }

  function mostraOnesto(testo){
    var o = document.getElementById("onesto");
    o.innerHTML = testo;
    o.hidden = false;
  }
  function nascondiOnesto(){ var o = document.getElementById("onesto"); o.hidden = true; o.innerHTML = ""; }

  // ---- CARICAMENTO ----
  function cablaComponi(centro){
    var a = document.getElementById("vai-componi");
    if (!a) return;
    a.href = "/componi-nuovo/" + encodeURIComponent(centro);
    a.textContent = _L({it:"Componi con ", en:"Compose with ", es:"Compón con "}) + cap(centro) + " →";
  }

  // FOTO tonda del centro: SUPPORTO discreto. Esce solo se trovata davvero; credito a un tap.
  // Se null -> resta il disco verde col nome come ora (nessun placeholder).
  function nascondiCentroFoto(){
    var w = document.getElementById("centro-foto-wrap");
    var c = document.getElementById("centro-foto-cred");
    if (w) w.hidden = true;
    if (c) { c.hidden = true; c.textContent = ""; }
  }
  function caricaCentroFoto(centro){
    nascondiCentroFoto();
    fetch("/v1/foto-ingrediente-nuovo/" + encodeURIComponent(centro), {headers: {"Accept": "application/json"}})
      .then(function(r){ return r.json(); })
      .then(function(f){
        if (!f || !f.url) return; // nessuna foto: resta il disco verde
        var img = document.getElementById("centro-foto");
        var wrap = document.getElementById("centro-foto-wrap");
        var cred = document.getElementById("centro-foto-cred");
        if (!img || !wrap) return;
        img.src = f.url;
        img.alt = cap(centro);
        wrap.hidden = false;
        if (f.credito && cred) {
          function toggle(){ cred.hidden = !cred.hidden; if (!cred.hidden) cred.textContent = f.credito; }
          img.onclick = toggle;
          img.onkeydown = function(e){ if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } };
        }
      })
      .catch(function(){ /* rete giù: resta il disco verde, nessun box foto */ });
  }

  function carica(ing){
    document.getElementById("centro-nome").textContent = cap(ing);
    cablaComponi(ing);
    nascondiOnesto();
    nascondiCentroFoto();
    fetch("/v1/criteri/" + encodeURIComponent(ing), {headers: {"Accept": "application/json"}})
      .then(function(r){ return r.json(); })
      .then(function(d){ render(ing, d); })
      .catch(function(){
        soloCentro(ing);
        mostraOnesto(_L({
          it:"Il grafo non è raggiungibile in questo momento. Riprova più tardi.",
          en:"The graph is not reachable right now. Try again later.",
          es:"El grafo no está disponible en este momento. Inténtalo más tarde."
        }));
      });
  }

  function render(ing, d){
    d = d || {};
    cablaComponi(d.ingrediente || ing);
    var rel = Array.isArray(d.relazioni) ? d.relazioni : [];

    // DB spento / sorgente non disponibile
    if (!rel.length && d.nota) {
      soloCentro(d.ingrediente || ing);
      mostraOnesto(_L({
        it:"Il grafo non ha dati da mostrare ora (<strong>" + esc(d.nota) + "</strong>). Nessun nodo o numero inventato.",
        en:"The graph has no data to show now (<strong>" + esc(d.nota) + "</strong>). No node or number invented.",
        es:"El grafo no tiene datos que mostrar ahora (<strong>" + esc(d.nota) + "</strong>). Ningún nodo ni número inventado."
      }));
      return;
    }

    // non riconosciuto dalla sorgente
    if (d.non_riconosciuto) {
      soloCentro(d.ingrediente || ing);
      mostraOnesto(_L({
        it:"<strong>" + esc(cap(d.ingrediente || ing)) + "</strong> non è riconosciuto nel grafo: non ci sono composti né relazioni documentate. Non invento nodi né numeri per riempire lo spazio.",
        en:"<strong>" + esc(cap(d.ingrediente || ing)) + "</strong> is not recognised in the graph: there are no documented compounds or relations. I don't invent nodes or numbers to fill the space.",
        es:"<strong>" + esc(cap(d.ingrediente || ing)) + "</strong> no se reconoce en el grafo: no hay compuestos ni relaciones documentadas. No invento nodos ni números para rellenar el espacio."
      }));
      return;
    }

    // ordina: prima parentela aromatica (con più composti), poi contrasto, poi tradizione
    var peso = {base_aromatica: 0, contrasto: 1, tradizione: 2};
    rel = rel.slice().sort(function(a, b){
      var pa = peso[a.criterio] != null ? peso[a.criterio] : 3;
      var pb = peso[b.criterio] != null ? peso[b.criterio] : 3;
      if (pa !== pb) return pa - pb;
      return (composti(b) || 0) - (composti(a) || 0);
    }).slice(0, MAX_VICINI);

    var nBase = rel.filter(function(r){ return r.criterio === "base_aromatica"; }).length;

    if (!rel.length) {
      soloCentro(d.ingrediente || ing);
      mostraOnesto(_L({
        it:"<strong>" + esc(cap(d.ingrediente || ing)) + "</strong> non ha relazioni nel grafo. Non invento nodi né numeri.",
        en:"<strong>" + esc(cap(d.ingrediente || ing)) + "</strong> has no relations in the graph. I don't invent nodes or numbers.",
        es:"<strong>" + esc(cap(d.ingrediente || ing)) + "</strong> no tiene relaciones en el grafo. No invento nodos ni números."
      }));
      return;
    }

    disegna(d.ingrediente || ing, rel);
    caricaCentroFoto(d.ingrediente || ing);

    // onestà: nessun legame molecolare, solo tradizione/contrasto
    if (nBase === 0) {
      mostraOnesto(_L({
        it:"Questo ingrediente <strong>non ha un profilo di composti</strong> nel grafo: qui vedi solo relazioni di tradizione o contrasto, <strong>non legami molecolari</strong>. Lo spessore non misura composti condivisi.",
        en:"This ingredient <strong>has no compound profile</strong> in the graph: here you only see tradition or contrast relations, <strong>not molecular links</strong>. Thickness does not measure shared compounds.",
        es:"Este ingrediente <strong>no tiene un perfil de compuestos</strong> en el grafo: aquí solo ves relaciones de tradición o contraste, <strong>no vínculos moleculares</strong>. El grosor no mide compuestos compartidos."
      }));
    }
  }

  // ricerca -> ricentra
  document.getElementById("srch").addEventListener("submit", function(e){
    e.preventDefault();
    var v = (document.getElementById("q").value || "").trim();
    if (v) location.href = "/scopri-nuovo/" + encodeURIComponent(v);
  });

  // ri-traduce il contenuto generato da JS quando si cambia lingua.
  // salta la prima invocazione (coincide col carica iniziale qui sotto).
  var _primaI18n = true;
  window.onI18nApply = function(){
    if (_primaI18n){ _primaI18n = false; return; }
    if (INGREDIENTE) carica(INGREDIENTE);
  };

  carica(INGREDIENTE);
})();
</script>

</html>
