<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planner Menu — Matter Bench</title>
<meta name="description" content="Progetta il calendario dei menu per 30-60 giorni: portate, regola no-ripeti, stagionalità del mese, food cost. Il motore già costruito di Matter.">
<link rel="stylesheet" href="/static/matter.css">
<style>
  /* shell minimo per ospitare la "vista" del modulo planner (matter-planner.js) */
  :root{ --pl-bg:#f4f1ea; --pl-ink:#17271e; --pl-riga:#0000001a; }
  html,body{ margin:0; background:var(--pl-bg); color:var(--pl-ink);
             font-family:"Hanken Grotesk",system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  #vista-head{ display:flex; align-items:center; gap:12px; padding:14px 16px;
               border-bottom:1px solid var(--pl-riga); position:sticky; top:0; background:var(--pl-bg); z-index:5; }
  #vista-head a{ color:inherit; text-decoration:none; font-weight:800; font-size:15px; }
  #vista-head .vt{ font-size:13px; opacity:.7; }
  #vista-body{ padding:16px; max-width:720px; margin:0 auto; }
</style>
</head>
<body>
  <header id="vista-head">
    <a href="/nuovo" aria-label="Torna alla home">← Matter</a>
    <span class="vt" id="vista-title">Planner Menu</span>
  </header>
  <main id="vista-body"></main>

  <script>
    // Shim minimi che matter-planner.js si aspetta dal vecchio frontend.
    // (Il modulo è stato scritto per il vecchio shell; qui gli diamo solo cosa gli serve.)
    window._escV = function(s){
      return String(s==null?'':s).replace(/[&<>"']/g, function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
      });
    };
    window._apriVista = function(title, html){
      var t = document.getElementById('vista-title'); if(t) t.textContent = title || '';
      var b = document.getElementById('vista-body'); if(b){ b.innerHTML = html; b.scrollTop = 0; }
    };
    // _chatConContesto è opzionale: il modulo lo chiama solo se esiste (guardato con typeof).
    // Qui "Ottimizza con Matter" porta alla chat col menu come contesto (via querystring leggera).
    window._chatConContesto = function(tipo, ctx){
      try{ sessionStorage.setItem('matter_ctx', JSON.stringify({tipo:tipo, ctx:ctx})); }catch(e){}
      location.href = '/chiedi-nuovo';
    };
  </script>
  <script src="/static/matter-planner.js"></script>
  <script>
    // avvio il wizard appena carica il modulo
    if (typeof window.apriPlanner === 'function') window.apriPlanner();
  </script>
</body>
</html>
