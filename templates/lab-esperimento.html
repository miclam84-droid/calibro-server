<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ ingrediente }} — Laboratorio — Matter Bench</title>
<script>
  /* TEMA ADATTIVO: scuro di sera (19->7), chiaro di giorno. Come Cifra.
     Automatico per ora (nessun toggle manuale). Prima del CSS, niente sfarfallio. */
  (function(){try{
    function _mtTema(){var hh=new Date().getHours();document.documentElement.setAttribute('data-theme',(hh>=19||hh<7)?'dark':'light');}
    _mtTema();
    document.addEventListener('visibilitychange',function(){if(!document.hidden)_mtTema();});
    window.addEventListener('pageshow',_mtTema);
    window.addEventListener('focus',_mtTema);
    setInterval(_mtTema,60000);
  }catch(e){}})();
</script>
<link rel="stylesheet" href="/static/matter-v5.css">
<script src="/static/i18n-nuovo.js"></script>
<style>
  /* lo switcher lingua usa --r-pill e --tint; in v5 non esistono, li definiamo qui (come le altre pagine). */
  :root{ --r-pill:999px; --tint:var(--verde-tint); }
  /* ---- intestazione ingrediente ---- */
  .lab-hero{padding:40px 0 0}
  .lab-cat{font-size:14px; color:var(--soft); margin:0 0 12px}
  .lab-h1{font-family:var(--display); font-weight:800; font-size:clamp(44px,11vw,88px); line-height:.92; letter-spacing:-.02em; margin:0; text-transform:capitalize}
  .lab-binom{font-family:var(--display); font-style:italic; font-weight:500; font-size:clamp(18px,3vw,24px); color:var(--soft); margin:10px 0 0}
  .lab-credit{font-size:11px; color:var(--faint); margin:8px 0 0}
  .lab-intro{font-size:16px; color:var(--soft); line-height:1.55; margin:22px 0 0; max-width:40em}
  .lab-intro a{font-weight:600; white-space:nowrap}

  /* ---- readout scuro (profilo sensoriale) — riusa .m-readout di matter-v5 ---- */
  .lab-readout{margin-top:30px}
  .lab-readout .m-leg-note{margin-top:14px}

  /* ---- sezioni ---- */
  .lab-sec{margin-top:40px; padding-top:30px; border-top:1px solid var(--rule)}
  .lab-sec h2{font-family:var(--display); font-weight:700; font-size:24px; letter-spacing:-.01em; margin:0}
  .lab-sec .sub{font-size:15px; color:var(--soft); margin:8px 0 0; max-width:40em; line-height:1.5}
  .lab-grp{font-size:12.5px; font-weight:600; letter-spacing:.02em; color:var(--verde); margin:24px 0 10px}
  .lab-grp.comp{color:var(--faint)}

  /* ---- card esperimento (cosa ci fai) ---- */
  .esp-list{display:grid; gap:10px}
  .esp-list[hidden]{display:none}
  .esp{display:grid; grid-template-columns:1fr auto; gap:4px 14px; width:100%; text-align:left; font:inherit; color:var(--ink);
    background:var(--panel); border:1px solid var(--rule); border-radius:13px; padding:16px 17px; cursor:pointer; transition:border-color .15s}
  .esp:hover{border-color:var(--verde)}
  .esp .nome{font-family:var(--display); font-weight:700; font-size:17px; line-height:1.15}
  .esp .ipo{grid-column:1/2; font-size:13px; color:var(--soft); line-height:1.4; margin-top:3px}
  .esp .bers{grid-row:1/2; grid-column:2/3; align-self:start; text-align:right; white-space:nowrap}
  .esp .bers .v{font-family:var(--display); font-weight:800; font-size:16px; color:var(--verde)}
  .esp .bers .vl{display:block; font-size:10px; color:var(--faint); margin-top:1px}
  .esp .tags{grid-column:1/3; display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
  .tag{font-size:11.5px; color:var(--soft); background:var(--paper); border:1px solid var(--rule); border-radius:999px; padding:3px 9px}
  .abbina-chips{display:flex; flex-wrap:wrap; gap:9px; margin-top:14px}
  .abbina-chip{display:inline-block; font-size:14px; font-weight:600; color:var(--ink); text-decoration:none;
    background:var(--panel); border:1px solid var(--rule); border-radius:999px; padding:7px 14px; text-transform:capitalize; transition:border-color .15s, color .15s}
  .abbina-chip:hover{border-color:var(--verde); color:var(--verde)}
  .comp-list{margin-top:14px; display:flex; flex-direction:column; gap:11px}
  .comp-row{font-size:15px; line-height:1.4}
  /* due livelli di lettura (revisore 10/11): prima la nota che senti, poi la molecola in piccolo */
  .comp-descr{font-weight:600; color:var(--ink)}
  .comp-mol{margin-left:8px; font-size:12.5px; color:var(--faint)}
  a.comp-mol.comp-link{text-decoration:none; color:var(--verde); border-bottom:1px solid var(--rule)}
  a.comp-mol.comp-link:hover{border-bottom-color:var(--verde)}
  .comp-naso{font-size:15.5px; color:var(--ink); line-height:1.5; margin:14px 0 2px}
  .comp-naso b{font-weight:700}
  .comp-n{font-weight:600; color:var(--ink)}
  a.comp-link{text-decoration:none; border-bottom:1px solid var(--rule); color:var(--verde)}
  a.comp-link:hover{border-bottom-color:var(--verde)}
  .comp-a{color:var(--soft)}
  .comp-a::before{content:" — "; color:var(--faint)}
  /* preparazione (cocktail/piatto aperto per nome) */
  .proc-list{margin:4px 0 0; padding-left:20px}
  .proc-list li{font-size:14.5px; line-height:1.5; color:var(--ink); margin:6px 0}
  .prep-nota{font-size:13px; color:var(--soft); margin-top:14px; line-height:1.5}
  .mostra-tutti{display:inline-block; margin:12px 0 0; padding:9px 15px; border:1px solid var(--rule); background:var(--panel);
    border-radius:999px; font:inherit; font-size:13.5px; font-weight:600; color:var(--verde); cursor:pointer}
  .mostra-tutti:hover{border-color:#c6c6b8}

  /* ---- vista dettaglio ---- */
  .lab-back{font-size:14px; color:var(--soft); font-weight:600; background:none; border:0; cursor:pointer; padding:10px 0; display:inline-flex; align-items:center; gap:6px}
  .lab-back:hover{color:var(--ink)}
  .lab-ah{font-family:var(--display); font-weight:800; font-size:clamp(30px,6vw,46px); line-height:1; letter-spacing:-.02em; margin:8px 0 0}
  .lab-ai{font-size:17px; color:var(--soft); margin:12px 0 0; line-height:1.5; max-width:38em}
  .lcard{background:var(--panel); border:1px solid var(--rule); border-radius:14px; padding:18px 18px; margin-top:14px}
  .lcard-t{font-family:var(--display); font-weight:700; font-size:13px; color:var(--verde); letter-spacing:.02em; margin:0 0 10px}
  .bers-big{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
  .bers-big .v{font-family:var(--display); font-weight:800; font-size:34px; color:var(--ink)}
  .bers-big .u{font-size:15px; color:var(--soft); font-weight:600}
  .bers-big .f{font-size:13px; color:var(--soft); margin-left:auto; text-align:right; max-width:55%}
  .bers-fonte{margin-top:10px; font-size:12.5px; color:var(--faint)}
  .causa{display:grid; gap:12px}
  .causa .riga{display:grid; grid-template-columns:70px 1fr; gap:12px; align-items:start}
  .causa .k{font-size:12px; font-weight:700; padding-top:2px}
  .causa .k.su{color:var(--verificato)} .causa .k.giu{color:var(--verde)}
  .causa ul{margin:0; padding-left:0; list-style:none; font-size:14px; color:var(--ink); line-height:1.5}
  .causa li{padding:1px 0}
  .impara-link{display:inline-block; margin-top:12px; font-size:13px; font-weight:600; color:var(--verde); text-decoration:none}
  .impara-link:hover{text-decoration:underline}
  .riga-s{display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--rule-2)}
  .riga-s:last-child{border-bottom:none}
  .riga-s .ic{width:30px; height:30px; flex:0 0 auto; border-radius:9px; background:var(--verde-tint); color:var(--verde); display:flex; align-items:center; justify-content:center; font-size:15px}
  .riga-s .tt{flex:1; min-width:0}
  .riga-s .t1{font-size:14px; font-weight:600; color:var(--ink)}
  .riga-s .t2{font-size:13.5px; color:var(--soft); margin-top:2px; line-height:1.45}
  .reag{list-style:none; margin:0; padding:0}
  .reag li{display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:9px 0; border-bottom:1px solid var(--rule-2); font-size:15px}
  .reag li:last-child{border-bottom:0}
  .reag .rq{color:var(--soft); font-variant-numeric:tabular-nums; white-space:nowrap; font-size:14px}
  .lab-block-btn{display:flex; width:100%; margin-top:16px}
  .lab-block-btn.m-ghost{margin-top:10px; justify-content:center}
  .lab-cta-row{margin-top:18px}
  .thin-nota{font-size:13px; color:var(--soft); margin:12px 0 0; line-height:1.5}
  .muted-src{font-size:12px; color:var(--faint); margin-top:12px; line-height:1.45}
  .vuoto{font-size:14.5px; color:var(--soft); line-height:1.55}
  .vuoto b{color:var(--ink)}
  .loading{font-size:14px; color:var(--soft); padding:40px 0; text-align:center}
  /* bevanda */
  .bev-cat{padding:12px 0; border-bottom:1px solid var(--rule-2)}
  .bev-cat:last-of-type{border-bottom:0}
  .bev-cat-nome{font-family:var(--display); font-weight:700; font-size:15px; color:var(--ink)}
  .bev-cat-desc{font-size:13px; color:var(--soft); margin-top:2px; line-height:1.4}
  .bev-vini{list-style:none; margin:8px 0 0; padding:0}
  .bev-vini li{padding:7px 0}
  .bev-v-nome{font-weight:600; font-size:14px; color:var(--ink)}
  .bev-v-terr{font-size:12.5px; color:var(--soft)}
  .bev-v-perche{font-size:13px; color:var(--soft); line-height:1.4; margin-top:2px}
  .bev-nota{font-size:12.5px; color:var(--soft); line-height:1.45; margin-top:10px; padding-top:10px; border-top:1px solid var(--rule-2)}
</style>

<body>

<div class="m-top topbar-in">
  <a class="m-wm" href="/nuovo"><span>Matter</span><span class="b">Bench</span></a>
  <a class="m-back" href="/nuovo" data-i18n="cerca">← cerca</a>
</div>

<div class="m-wrap" id="wrap">
  <div id="vista-lista"><div class="loading" data-i18n="loading">Apro il banco di lavoro…</div></div>
  <div id="vista-det" style="display:none"></div>
</div>

<script>
(function(){
  "use strict";
  // i18n: le ETICHETTE del laboratorio (cornice) sono trilingui; i DATI (nomi ingredienti,
  // esperimenti, reagenti, causalita') restano in italiano come nel resto dell'app (Rete inclusa).
  var _L = window._L || function(o){ return (o && o.it) || ""; };
  window.I18N_DICT = {
    cerca:   {it:"← cerca", en:"← search", es:"← buscar"},
    loading: {it:"Apro il banco di lavoro…", en:"Opening the workbench…", es:"Abriendo el banco de trabajo…"}
  };
  // stato per ri-disegnare al cambio lingua (le etichette sono costruite in JS, non statiche)
  var _STATO = {ingr:null, gusto:null, esps:null, detId:null};
  window.onI18nApply = function(){
    try{
      if(_STATO.detId){ apriEsperimento(_STATO.detId); }
      else if(_STATO.prep){ renderPreparazione(_STATO.prep); }
      else if(_STATO.esps){ renderLista(_STATO.ingr, _STATO.gusto, _STATO.esps); }
    }catch(e){}
  };
  var ING = {{ ingrediente|tojson }};
  var FIX = window.__FIX__ || null;   // gancio per test offline con dati reali
  var FOTO = (window.__FOTO__!==undefined)?window.__FOTO__:null;  // {url,credito,fonte} o null
  var DETT = {};                      // id -> protocollo dettaglio
  var COMPOSTI = null;                 // {composti:[{nome,aroma,fonte,pubchem_cid}], nota} o null

  function getJSON(ep){
    if (FIX && FIX[ep] !== undefined) return Promise.resolve(FIX[ep]);
    return fetch(ep).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });
  }
  function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,function(c){return c==="&"?"&amp;":c==="<"?"&lt;":"&gt;";}); }
  function el(id){ return document.getElementById(id); }
  function cap(s){ s=String(s||""); return s.charAt(0).toUpperCase()+s.slice(1); }
  // Genere dell'articolo: femminile se finisce in -a o è un femminile comune in -e/-i;
  // altrimenti maschile. Copre il caso frequente (la cipolla/della cipolla) senza
  // pretendere un lessico completo: gli ambigui restano al maschile come prima.
  var _FEMM = {"carne":1,"senape":1,"noce":1,"noci":1,"salsa":1,"crème":1};
  function _art(nome){
    var n=(nome||"").toLowerCase().trim();
    var fem = /a$/.test(n) || _FEMM[n]===1;
    return fem ? {il:"La", del:"della"} : {il:"Il", del:"del"};
  }
  // identità per-dispositivo (stessa chiave di Banco/Quaderno/Scheda: Mirino e Memoria la condividono)
  function _uuid(){ if(window.crypto&&crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0,v=c=='x'?r:(r&0x3|0x8);return v.toString(16);}); }
  function _devId(){ try{ var d=localStorage.getItem('matter_device_id'); if(!d||!/^[0-9a-fA-F-]{36}$/.test(d)){d=_uuid();localStorage.setItem('matter_device_id',d);} return d; }catch(e){ if(!window._vid)window._vid=_uuid(); return window._vid; } }
  // CERCHIO OPERATIVO: #salva salva l'esperimento nel Quaderno (archivio unico /v1/quaderno2/salva)
  // e porta al Mirino col fenomeno precompilato. Salva SOLO ciò che l'esperimento ha davvero.
  function bindSalva(p, ob, b, fen){
    var btn=el("salva"); if(!btn) return;
    btn.addEventListener("click", function(e){
      if(e) e.preventDefault();
      if(btn.getAttribute("aria-disabled")==="true") return;
      var f0=(fen&&fen[0])||null;
      var fenNome=(f0&&f0.nome)||p.nome||ING;
      var record={
        porta:"laboratorio", funzione:"esperimento_lab", tipo:"esperimento",
        titolo: cap(ING)+" — "+(p.nome||"esperimento"),
        stato_input:{ ingrediente:ING, esperimento:p.nome||null, obiettivo:ob||null },
        stato_output:{ bersaglio:b||null, fenomeni:(fen||[]).map(function(x){return x&&x.nome;}).filter(Boolean) },
        provenienza:{ fonte:"laboratorio Matter", endpoint:"/v1/ingrediente/"+ING+"/protocolli" }
      };
      btn.setAttribute("aria-disabled","true"); btn.textContent=_L({it:"Salvo…",en:"Saving…",es:"Guardando…"});
      fetch("/v1/quaderno2/salva",{method:"POST",headers:{"Content-Type":"application/json","X-Device-Id":_devId()},body:JSON.stringify(record)})
        .then(function(r){ return r.json().catch(function(){return {};}).then(function(d){ return {ok:r.ok&&d&&d.ok}; }); })
        .then(function(res){
          if(res.ok){ btn.textContent=_L({it:"Salvato ✓ — vai al banco…",en:"Saved ✓ — going to the bench…",es:"Guardado ✓ — vamos a la mesa…"}); location.href="/banco/profilo?fen="+encodeURIComponent(fenNome); }
          else { btn.removeAttribute("aria-disabled"); btn.textContent=_L({it:"Non salvato — riprova",en:"Not saved — try again",es:"No guardado — inténtalo de nuevo"}); }
        })
        .catch(function(){ btn.removeAttribute("aria-disabled"); btn.textContent=_L({it:"Non salvato — rete assente · riprova",en:"Not saved — no network · try again",es:"No guardado — sin red · inténtalo de nuevo"}); });
    });
  }

  var ASSE_LABEL = {
    dolce:{it:"dolce",en:"sweet",es:"dulce"}, salato:{it:"salato",en:"salty",es:"salado"},
    acido:{it:"acido",en:"sour",es:"ácido"}, amaro:{it:"amaro",en:"bitter",es:"amargo"},
    umami:{it:"umami",en:"umami",es:"umami"}, grasso:{it:"grasso",en:"fatty",es:"graso"},
    corposita:{it:"corpo",en:"body",es:"cuerpo"}, aroma_fresco:{it:"fresco–erbaceo",en:"fresh–herbal",es:"fresco–herbáceo"},
    aroma_caldo:{it:"caldo–speziato",en:"warm–spiced",es:"cálido–especiado"}, piccante:{it:"piccante",en:"spicy",es:"picante"},
    astringente:{it:"astringente",en:"astringent",es:"astringente"}, croccante:{it:"croccante",en:"crunchy",es:"crujiente"},
    effervescenza:{it:"effervescenza",en:"fizz",es:"efervescencia"}, fermentato:{it:"fermentato",en:"fermented",es:"fermentado"},
    alcolico:{it:"alcolico",en:"alcoholic",es:"alcohólico"}, termico:{it:"termico",en:"thermal",es:"térmico"}};
  function fonteBreve(meta){
    if(!meta) return null;
    var f=(meta.fonte||"").toUpperCase();
    if(f.indexOf("USDA")>=0) return {t:"USDA",stim:false};
    if(f.indexOf("CIQUAL")>=0) return {t:"CIQUAL",stim:false};
    if(f.indexOf("GLUTAMM")>=0||f.indexOf("FSANZ")>=0) return {t:"da glutammato",stim:false};
    if(f.indexOf("MARCATOR")>=0) return {t:"da marcatori",stim:false};
    if((meta.stato||"")==="stimato") return {t:"stima",stim:true};
    if((meta.stato||"")==="derivato") return {t:"derivato",stim:false};
    return null;
  }

  function radiceIng(nome){
    var n=(nome||"").toLowerCase().trim();
    return n.replace(/[oaei]$/,"");
  }
  // massa normalizzata a g/ml (confronto solo tra unità omogenee)
  function massaG(q,u){
    var n=parseFloat(String(q==null?"":q).replace(",","."));
    if(isNaN(n)) return null;
    u=(u||"").toLowerCase();
    if(u==="g"||u==="ml") return n;
    if(u==="kg"||u==="l") return n*1000;
    return null;
  }
  // RILEVANZA: l'ingrediente è PROTAGONISTA se è il reagente #1 per massa (g/ml).
  // Se nessuna massa confrontabile, fallback sul nome. Trasparente, v1.
  function eProtagonista(det, radice){
    if(!det) return false;
    var rg=det.reagenti||[];
    var masse=[];
    rg.forEach(function(r){ var m=massaG(r.quantita,r.unita); if(m!=null) masse.push({nome:(r.nome||"").toLowerCase(), m:m}); });
    if(!masse.length){
      return radice.length>=3 && (((det.nome||"")+" "+(det.ipotesi||"")).toLowerCase().indexOf(radice)>=0);
    }
    var maxM=0; masse.forEach(function(x){ if(x.m>maxM) maxM=x.m; });
    var ingM=0; masse.forEach(function(x){ if(x.nome.indexOf(radice)>=0 && x.m>ingM) ingM=x.m; });
    return ingM>0 && ingM>=maxM-0.0001;
  }
  function ricchezza(det){
    if(!det) return 0; var s=0; var b=det.bersaglio||{};
    if(b.valore) s+=2;
    var f=det.fenomeni||[]; if(f.length) s+=2; if(f[0]&&f[0].causalita) s+=2;
    if(det.variabile_critica) s+=1;
    return s;
  }

  // profilo sensoriale → readout scuro (riusa .m-readout di matter-v5).
  // Regola v5: strumento scuro SOLO dove c'è una lettura vera. Qui è il profilo di gusto.
  function readoutGusto(gusto){
    if(!gusto||!gusto.proprieta) return "";
    var pr=gusto.proprieta, meta=gusto.proprieta_meta||{};
    var assi=[]; for(var k in pr){ if(pr[k]!=null && pr[k]>0 && ASSE_LABEL[k]) assi.push(k); }
    if(!assi.length) return "";
    assi.sort(function(a,b){return parseFloat(pr[b])-parseFloat(pr[a]);});
    var der=[], sti=[];
    assi.forEach(function(k){ var fb=fonteBreve(meta[k]); (fb&&fb.stim || !fb ? sti : der).push(k); });
    function riga(k,est){
      var w=Math.max(0,Math.min(100,(parseFloat(String(pr[k]).replace(",","."))/10)*100));
      return '<div class="m-row'+(est?' est':'')+'"><span class="name">'+esc(_L(ASSE_LABEL[k]))+'</span>'+
        '<span class="m-track"><span class="m-fill'+(est?'':' d')+'" style="width:'+w+'%"></span></span>'+
        '<span class="m-val">'+esc(pr[k])+'</span></div>';
    }
    var h='<div class="lab-readout"><div class="m-readout">'+
      '<div class="m-ro-head"><div class="m-ro-title">'+_L({it:"Profilo sensoriale",en:"Sensory profile",es:"Perfil sensorial"})+'</div><div class="m-ro-scale">0 — 10</div></div>';
    if(der.length){ h+='<div class="m-ro-group"><div class="m-ro-grouplabel"><span class="mk derivato mk--sm"></span>'+_L({it:"Da fonte o calcolo",en:"From source or calculation",es:"De fuente o cálculo"})+'</div>'+der.map(function(k){return riga(k,false);}).join('')+'</div>'; }
    if(sti.length){ h+='<div class="m-ro-group"><div class="m-ro-grouplabel"><span class="mk stimato mk--sm"></span>'+_L({it:"Stima del sistema",en:"System estimate",es:"Estimación del sistema"})+'</div>'+sti.map(function(k){return riga(k,true);}).join('')+'</div>'; }
    h+='<div class="m-legend"><span class="m-leg"><span class="mk derivato mk--sm"></span><b>'+_L({it:"Derivato",en:"Derived",es:"Derivado"})+'</b></span>'+
       '<span class="m-leg"><span class="mk stimato mk--sm"></span><b>'+_L({it:"Stimato",en:"Estimated",es:"Estimado"})+'</b></span></div>';
    h+='</div><p class="m-leg-note">'+_L({it:"Ogni numero dice da dove viene. Dove non c'è una misura, resta vuoto invece di essere inventato.",en:"Every number says where it comes from. Where there's no measurement, it stays empty instead of being invented.",es:"Cada número dice de dónde viene. Donde no hay una medida, queda vacío en vez de inventarse."})+'</p></div>';
    return h;
  }

  // ---------- VISTA LISTA ----------
  function renderLista(ingr, gusto, esps){
    var h="";
    // ingrediente non reale (refuso o non presente in Matter): stato onesto, non un guscio finto
    var reale = ingr && !ingr.errore && (ingr.nome || ingr.categoria || (ingr.varieta&&ingr.varieta.length));
    if(!reale && (!esps || !esps.length)){
      h+='<header class="lab-hero"><h1 class="lab-h1">'+esc(ING)+'</h1></header>';
      h+='<div class="lcard" style="margin-top:24px"><div class="vuoto">'+_L({it:"Non ho <b>",en:"I don't have <b>",es:"No tengo <b>"})+esc(ING)+_L({it:'</b> nel laboratorio. Controlla il nome (anche un accento) o <a href="/nuovo">prova un altro ingrediente</a>. Se è un ingrediente vero che manca, scrivimelo in <a href="/chiedi-nuovo">chat</a>.',en:'</b> in the lab. Check the name (even an accent) or <a href="/nuovo">try another ingredient</a>. If it\'s a real ingredient that\'s missing, tell me in <a href="/chiedi-nuovo">chat</a>.',es:'</b> en el laboratorio. Revisa el nombre (incluso un acento) o <a href="/nuovo">prueba otro ingrediente</a>. Si es un ingrediente real que falta, dímelo en <a href="/chiedi-nuovo">chat</a>.'})+'</div></div>';
      el("vista-lista").innerHTML=h; return;
    }
    var nome=(ingr&&ingr.nome)||ING, cat=(ingr&&ingr.categoria)||"";
    var vLinea="";
    if(ingr&&ingr.varieta&&ingr.varieta.length){
      var v0=null; for(var i=0;i<ingr.varieta.length;i++){ if((ingr.varieta[i].caratteristica||"").length){v0=ingr.varieta[i];break;} }
      if(v0) vLinea=esc(v0.caratteristica);
    }
    h+='<header class="lab-hero">';
    if(cat) h+='<p class="lab-cat">'+esc(cat)+'</p>';
    h+='<h1 class="lab-h1">'+esc(nome)+'</h1>';
    if(vLinea) h+='<p class="lab-binom">'+vLinea+'</p>';
    h+='</header>';
    if((FOTO&&FOTO.url)&&FOTO.credito) h+='<p class="lab-credit">'+esc(FOTO.credito)+'</p>';
    var _nl=esc((nome||"").toLowerCase());
    h+='<p class="lab-intro">'+_L({
        it:"Questo è il banco di lavoro "+_art(nome).del+" "+_nl+": gli esperimenti in cui entra e, dentro ognuno, cosa controlli e perché succede. ",
        en:"This is the workbench for "+_nl+": the experiments it goes into and, inside each one, what you control and why it happens. ",
        es:"Este es el banco de trabajo de "+_nl+": los experimentos en los que entra y, dentro de cada uno, qué controlas y por qué sucede. "
      })+'<a href="/chiedi-nuovo?q='+encodeURIComponent(_L({it:"Parlami "+_art(nome).del+" "+_nl+": con cosa si abbina e come lo uso al banco?",en:"Tell me about "+_nl+": what it pairs with and how to use it at the bench?",es:"Háblame de "+_nl+": con qué marida y cómo lo uso en la mesa?"}))+'">'+_L({it:"Chiedi a Matter "+_nl+" →",en:"Ask Matter about "+_nl+" →",es:"Pregunta a Matter sobre "+_nl+" →"})+'</a></p>';

    // profilo sensoriale (readout scuro)
    h+=readoutGusto(gusto);

    // abbinamenti: con cosa dialoga l'ingrediente (dal grafo). Chip navigabili verso ogni banco.
    // Va PRIMA di "Cosa ci fai", cosi' la scheda non resta vuota quando non ci sono esperimenti collegati.
    var _dial = (ingr && (ingr.dialoga_con || ingr.abbinamenti || ingr.abbina)) || [];
    if(_dial && _dial.length){
      h+='<section class="lab-sec"><h2>'+_L({it:"Con cosa si abbina",en:"What it pairs with",es:"Con qué marida"})+'</h2>';
      h+='<p class="sub">'+_L({it:"Ingredienti che condividono composti aromatici o dialogano al palato. Tocca per aprire il loro banco.",en:"Ingredients that share aroma compounds or dialogue on the palate. Tap to open their bench.",es:"Ingredientes que comparten compuestos aromáticos o dialogan en boca. Toca para abrir su banco."})+'</p>';
      h+='<div class="abbina-chips">';
      var _nvis=0;
      for(var ia=0; ia<_dial.length && _nvis<16; ia++){
        var _dn = (typeof _dial[ia]==="string") ? _dial[ia] : (_dial[ia] && (_dial[ia].nome||_dial[ia].name));
        if(!_dn) continue;
        h+='<a class="abbina-chip" href="/lab/'+encodeURIComponent(_dn)+'">'+esc(_dn)+'</a>';
        _nvis++;
      }
      h+='</div>';
      h+='<p class="sub" style="margin-top:12px"><a class="impara-link" style="margin-top:0" href="/scopri-nuovo/'+encodeURIComponent(nome)+'">'+_L({it:"Esplora la rete dei sapori →",en:"Explore the flavour network →",es:"Explora la red de sabores →"})+'</a></p>';
      h+='</section>';
    }

    // composti aromatici: la base molecolare (dal grafo, fonte PubChem). Perche' profuma/sa cosi'.
    var _comp = (COMPOSTI && COMPOSTI.composti) || [];
    if(_comp && _comp.length){
      h+='<section class="lab-sec"><h2>'+_L({it:"Come profuma",en:"How it smells",es:"Cómo huele"})+'</h2>';
      h+='<p class="sub">'+_L({it:"Le note che senti, e la molecola che le porta. Tocca una molecola per la scheda PubChem.",en:"The notes you smell, and the molecule behind each. Tap a molecule for its PubChem page.",es:"Las notas que hueles, y la molécula que las lleva. Toca una molécula para su ficha PubChem."})+'</p>';
      // Due livelli di lettura (revisore 10/11): la nota che senti in evidenza, la molecola in piccolo.
      // Niente riassunto aggregato: senza il ruolo (firma/caratterizzante) il conteggio per frequenza
      // falserebbe la sintesi (es. limone -> 'ceroso' invece di 'agrumato'). Meglio le note per riga, vere.
      h+='<div class="comp-list">';
      for(var ic=0; ic<_comp.length; ic++){
        var _co = _comp[ic]; if(!_co) continue;
        var _cn = _co.nome || _co.name || ""; if(!_cn) continue;
        var _ar = _co.aroma || "";
        var _cid = _co.cid_verificato || "";
        h+='<div class="comp-row">';
        h+='<span class="comp-descr">'+esc(_ar||_cn)+'</span>';
        if(_ar){
          if(_cid) h+='<a class="comp-mol comp-link" href="https://pubchem.ncbi.nlm.nih.gov/compound/'+encodeURIComponent(_cid)+'" target="_blank" rel="noopener noreferrer">'+esc(_cn)+'</a>';
          else h+='<span class="comp-mol">'+esc(_cn)+'</span>';
        }
        h+='</div>';
      }
      h+='</div>';
      var _fonte = COMPOSTI.nota || _L({it:"Fonte: PubChem NIH",en:"Source: PubChem NIH",es:"Fuente: PubChem NIH"});
      h+='<p class="sub" style="margin-top:12px; font-size:13px">'+esc(_fonte)+'</p>';
      h+='</section>';
    }

    h+='<section class="lab-sec"><h2>'+_L({it:"Cosa ci fai",en:"What you do with it",es:"Qué haces con él"})+'</h2>';
    if(!esps||!esps.length){
      h+='<p class="sub">'+_L({it:"Ancora nessun esperimento collegato a questo ingrediente — Matter non ne inventa.",en:"No experiment linked to this ingredient yet — Matter doesn't invent them.",es:"Aún ningún experimento vinculado a este ingrediente — Matter no los inventa."})+'</p>';
      var _domv=_L({it:'Cosa posso fare al banco con ',en:'What can I do at the bench with ',es:'Qué puedo hacer en la mesa con '})+(nome||ING)+'? '+_L({it:'Dammi un paio di preparazioni e il numero da controllare.',en:'Give me a couple of preparations and the number to check.',es:'Dame un par de preparaciones y el número por controlar.'});
      h+='<div class="lab-cta-row"><a class="m-btn lab-block-btn" href="/chiedi-nuovo?q='+encodeURIComponent(_domv)+'">'+_L({it:"Chiedi a Matter cosa farci →",en:"Ask Matter what to do with it →",es:"Pregunta a Matter qué hacer →"})+'</a></div>';
      h+='</section>'; el("vista-lista").innerHTML=h; return;
    }
    h+='<p class="sub">'+_L({it:"Ogni preparazione è un esperimento, con il suo obiettivo e il suo numero da controllare.",en:"Every preparation is an experiment, with its own goal and its own number to check.",es:"Cada preparación es un experimento, con su objetivo y su número por controlar."})+'</p>';

    var radice=radiceIng(nome), prota=[], comp=[], cantiere=[];
    esps.forEach(function(e){
      var d=DETT[e.id]||{}; var fen=d.fenomeni||[];
      var pronto=!!(fen[0]&&fen[0].causalita);   // "pronto" = ha il perché (la causalità), il valore vero
      if(!pronto){ cantiere.push(e); return; }
      (eProtagonista(d,radice)?prota:comp).push(e);
    });
    function byRicc(a,b){ return ricchezza(DETT[b.id])-ricchezza(DETT[a.id]); }
    prota.sort(byRicc); comp.sort(byRicc); cantiere.sort(byRicc);

    function cardExp(e){
      var b=(e.bersaglio)||{};
      var bers="";
      if(b&&b.valore){
        // alcuni protocolli hanno gia' l'unita' dentro il valore ("almeno 3 ore"):
        // non raddoppiarla (era "almeno 3 oreore").
        var _u=(b.unita||'').trim();
        var _giaDentro=_u && String(b.valore).toLowerCase().trim().endsWith(_u.toLowerCase());
        var _piccola=(_u && _u.length<4 && !_giaDentro);
        var _lab=(_piccola || _giaDentro || !_u) ? _L({it:'bersaglio',en:'target',es:'objetivo'}) : _u;
        bers='<span class="bers"><span class="v">'+esc(b.valore)+(_piccola?esc(_u):'')+'</span><span class="vl">'+esc(_lab)+'</span></span>';
      }
      else bers='<span class="bers"></span>';
      var ipo=(e.ipotesi||"").replace(/^Voglio ottenere\s+/i,"").replace(/^ottenere\s+/i,"");
      var tags=((e.fenomeni)||[]).slice(0,2).map(function(f){var n=(typeof f==="string")?f:(f&&f.nome);return n?'<span class="tag">'+esc(n)+'</span>':'';}).join('');
      return '<button class="esp" data-id="'+esc(e.id)+'"><span class="nome">'+esc(e.nome)+'</span>'+bers+
             (ipo?'<span class="ipo">'+esc(cap(ipo))+'</span>':'')+(tags?'<span class="tags">'+tags+'</span>':'')+'</button>';
    }
    function cardsHtml(list){ return list.map(cardExp).join(''); }
    function gruppo(tit,list,isComp){
      if(!list.length) return "";
      return '<div class="lab-grp'+(isComp?' comp':'')+'">'+esc(tit)+'</div><div class="esp-list">'+cardsHtml(list)+'</div>';
    }
    // Gerarchia: guida coi protagonisti (sempre aperti), richiudi la coda lunga.
    // Le card nascoste restano nel DOM (gia' cablate), si rivelano col bottone.
    function gruppoCollas(tit,list,isComp,iniz,gid){
      if(!list.length) return "";
      if(list.length<=iniz+1) return gruppo(tit,list,isComp); // se ne avanza 1 sola, mostrale tutte
      var testa=iniz>0?'<div class="esp-list">'+cardsHtml(list.slice(0,iniz))+'</div>':'';
      var resto=iniz>0?list.slice(iniz):list;
      return '<div class="lab-grp'+(isComp?' comp':'')+'">'+esc(tit)+'</div>'+testa
        +'<div class="esp-list esp-extra" id="'+gid+'" hidden>'+cardsHtml(resto)+'</div>'
        +'<button type="button" class="mostra-tutti" data-tgt="'+gid+'">'
        +_L({it:'Mostra tutti',en:'Show all',es:'Mostrar todos'})+' ('+list.length+') →</button>';
    }
    var _nlp=(nome||"").toLowerCase();
    h+=gruppo(_L({it:_art(nome).il+" "+_nlp+" è protagonista", en:cap(nome)+" is a protagonist", es:cap(nome)+" es protagonista"}), prota, false);
    h+=gruppoCollas(_L({it:"Ci entra anche",en:"Also goes into",es:"También entra en"}), comp, true, 3, 'g-comp');
    if(cantiere.length){
      h+='<div class="lab-grp comp">'+_L({it:"Ancora in costruzione",en:"Still in progress",es:"Aún en construcción"})+'</div>';
      h+='<p class="sub cantiere-nota">'+_L({it:"Questi esperimenti esistono ma non hanno ancora il perché collegato. Matter non li inventa: li completa quando c'è una fonte o una prova al banco.",en:"These experiments exist but don't yet have the why linked. Matter doesn't invent it: it completes them when there's a source or a proof at the bench.",es:"Estos experimentos existen pero aún no tienen el porqué vinculado. Matter no lo inventa: los completa cuando hay una fuente o una prueba en la mesa."})+'</p>';
      h+='<div class="esp-list esp-extra" id="g-cant" hidden>'+cantiere.map(cardExp).join('')+'</div>';
      h+='<button type="button" class="mostra-tutti" data-tgt="g-cant">'
        +_L({it:"Mostra gli esperimenti in costruzione",en:"Show the in-progress experiments",es:"Mostrar los experimentos en construcción"})+' ('+cantiere.length+') →</button>';
    }
    h+='</section>';
    el("vista-lista").innerHTML=h;
    Array.prototype.forEach.call(document.querySelectorAll(".esp"),function(btn){
      btn.addEventListener("click",function(){ apriEsperimento(btn.getAttribute("data-id")); });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".mostra-tutti"),function(btn){
      btn.addEventListener("click",function(){
        var t=document.getElementById(btn.getAttribute("data-tgt"));
        if(t) t.hidden=false;
        btn.remove();
      });
    });
  }

  // ---------- VISTA DETTAGLIO ----------
  function attrezzoPerBersaglio(b){
    var u=((b&&b.unita)||"").toLowerCase();
    if(u.indexOf("°c")>=0||u==="c") return _L({it:"Termometro a sonda — per tenere la temperatura nella finestra giusta",en:"Probe thermometer — to keep the temperature in the right window",es:"Termómetro de sonda — para mantener la temperatura en la ventana correcta"});
    if(u.indexOf("idrat")>=0) return _L({it:"Bilancia — per calcolare l'idratazione in percentuale",en:"Scale — to work out hydration as a percentage",es:"Báscula — para calcular la hidratación en porcentaje"});
    if(u.indexOf("%")>=0) return _L({it:"Bilancia di precisione — per pesare le proporzioni",en:"Precision scale — to weigh the proportions",es:"Báscula de precisión — para pesar las proporciones"});
    if(u.indexOf("min")>=0) return _L({it:"Timer — per rispettare i tempi",en:"Timer — to keep to the times",es:"Temporizador — para respetar los tiempos"});
    return null;
  }
  function apriEsperimento(id){
    _STATO.detId=id;
    el("vista-lista").style.display="none"; el("vista-det").style.display="block"; window.scrollTo(0,0);
    var p=DETT[id];
    var h='<div class="det"><button class="lab-back" id="bk">'+_L({it:"← torna agli esperimenti",en:"← back to experiments",es:"← volver a los experimentos"})+'</button>';
    if(!p){ h+='<div class="vuoto" style="margin-top:14px">'+_L({it:"Esperimento non disponibile.",en:"Experiment not available.",es:"Experimento no disponible."})+'</div></div>'; el("vista-det").innerHTML=h; bindBack(); return; }
    h+='<div class="lab-ah">'+esc(p.nome||"")+'</div>';
    var ob=p.cosa_voglio_ottenere||p.ipotesi||""; if(ob) h+='<div class="lab-ai">'+esc(ob)+'</div>';

    var b=p.bersaglio||{}; var fen=p.fenomeni||[]; var f0=fen[0];
    var haNumeri = !!(b&&b.valore), haCausa = fen.some(function(f){return f&&f.causalita;});

    if(haNumeri || f0){
      h+='<div class="lcard"><div class="lcard-t">'+_L({it:"Il bersaglio",en:"The target",es:"El objetivo"})+'</div><div class="bers-big">';
      if(haNumeri){ var _u2=(b.unita||'').trim(); var _gia2=_u2 && String(b.valore).toLowerCase().trim().endsWith(_u2.toLowerCase()); h+='<span class="v">'+esc(b.valore)+'</span>'+(_u2&&!_gia2?'<span class="u">'+esc(_u2)+'</span>':''); }
      else h+='<span class="u">'+_L({it:"numero-bersaglio da fissare al banco",en:"target number to set at the bench",es:"número objetivo por fijar en la mesa"})+'</span>';
      if(f0&&f0.nome) h+='<span class="f">'+esc(f0.nome)+'</span>';
      h+='</div>';
      // fonte del bersaglio: ogni numero dichiara da dove viene
      var _bf=(p.bersaglio_fonte||'').trim();
      if(_bf) h+='<div class="bers-fonte">'+_L({it:"Fonte: ",en:"Source: ",es:"Fuente: "})+esc(_bf)+'</div>';
      h+='</div>';
    }

    // CARD "Cosa ci va" — i reagenti reali con le quantità (dato dell'esperimento, non inventato)
    var reag = Array.isArray(p.reagenti) ? p.reagenti : [];
    if(reag.length){
      var ri = reag.map(function(x){
        var nm = esc((x && x.nome) || x || "");
        if(!nm) return "";
        var q = (x && x.quantita!=null && String(x.quantita).length) ? esc(String(x.quantita))+(x.unita?(' '+esc(x.unita)):'') : '';
        return '<li><span class="rn">'+nm+'</span>'+(q?'<span class="rq">'+q+'</span>':'')+'</li>';
      }).join('');
      if(ri) h+='<div class="lcard"><div class="lcard-t">'+_L({it:"Cosa ci va",en:"What goes in",es:"Qué lleva"})+'</div><ul class="reag">'+ri+'</ul></div>';
    }

    // tutti i fenomeni che hanno una causalità (un esperimento può averne più d'uno)
    fen.forEach(function(ff){
      var c=ff&&ff.causalita; if(!c) return;
      h+='<div class="lcard"><div class="lcard-t">'+_L({it:"Perché accade",en:"Why it happens",es:"Por qué sucede"})+' — '+esc(ff.nome||"")+'</div><div class="causa">';
      if(c.acceleranti&&c.acceleranti.length) h+='<div class="riga"><div class="k su">'+_L({it:"accelera",en:"speeds up",es:"acelera"})+'</div><ul>'+c.acceleranti.slice(0,4).map(function(x){return '<li>'+esc(x.fattore||"")+'</li>';}).join('')+'</ul></div>';
      if(c.rallentanti&&c.rallentanti.length) h+='<div class="riga"><div class="k giu">'+_L({it:"frena",en:"slows down",es:"frena"})+'</div><ul>'+c.rallentanti.slice(0,4).map(function(x){return '<li>'+esc(x.fattore||"")+'</li>';}).join('')+'</ul></div>';
      h+='</div>';
      // slot per il link "impara questo fenomeno": riempito dopo, SOLO se la lezione esiste davvero
      if(ff.slug) h+='<span class="impara-slot" id="impara-slot-'+esc(ff.slug)+'"></span>';
      h+='</div>';
    });

    // card operativa: variabile / osservazione / correzione / attrezzo — solo righe con contenuto
    var righe="";
    if(p.variabile_critica) righe+='<div class="riga-s"><div class="ic">🎚</div><div class="tt"><div class="t1">'+_L({it:"La variabile da tenere d'occhio",en:"The variable to watch",es:"La variable que vigilar"})+'</div><div class="t2">'+esc(p.variabile_critica)+'</div></div></div>';
    var sTxt = (typeof p.sensori==="string")?p.sensori:(Array.isArray(p.sensori)?p.sensori.map(function(s){return s.nome||s;}).join(", "):"");
    if(sTxt && sTxt.length>1) righe+='<div class="riga-s"><div class="ic">👁</div><div class="tt"><div class="t1">'+_L({it:"Come capisci se funziona",en:"How you tell it's working",es:"Cómo sabes si funciona"})+'</div><div class="t2">'+esc(sTxt)+'</div></div></div>';
    var err=p.errori||p.diagnosi;
    var eTxt=(typeof err==="string")?err:(Array.isArray(err)?err.map(function(x){return x.nome||x.descrizione||x;}).join("; "):"");
    if(eTxt && eTxt.length>1) righe+='<div class="riga-s"><div class="ic">🛟</div><div class="tt"><div class="t1">'+_L({it:"Se non viene",en:"If it doesn't turn out",es:"Si no sale"})+'</div><div class="t2">'+esc(eTxt.slice(0,220))+'</div></div></div>';
    var attr=attrezzoPerBersaglio(b);
    if(attr) righe+='<div class="riga-s" id="serve-row"><div class="ic">🛠</div><div class="tt"><div class="t1">'+_L({it:"Ti serve",en:"You need",es:"Necesitas"})+'</div><div class="t2" id="serve-txt">'+esc(attr)+'</div></div></div>';
    if(righe) h+='<div class="lcard" id="card-operativa">'+righe+'</div>';

    if(!haNumeri && !haCausa && !righe){
      h+='<div class="lcard"><div class="vuoto">'+_L({it:"Questo esperimento ha l'obiettivo ma non ancora i numeri e i fenomeni collegati. Matter non li inventa: li aggiunge quando c'è una fonte o una prova al banco.",en:"This experiment has the goal but not yet the numbers and the linked phenomena. Matter doesn't invent them: it adds them when there's a source or a proof at the bench.",es:"Este experimento tiene el objetivo pero aún no los números ni los fenómenos vinculados. Matter no los inventa: los añade cuando hay una fuente o una prueba en la mesa."})+'</div></div>';
    } else if(!haCausa){
      h+='<p class="thin-nota">'+_L({it:"Il <b>perché</b> — cosa accelera e cosa frena questo fenomeno — non è ancora collegato a questo esperimento. Matter non lo inventa: lo aggiunge quando c'è una fonte o una prova al banco.",en:"The <b>why</b> — what speeds up and what slows this phenomenon down — isn't linked to this experiment yet. Matter doesn't invent it: it adds it when there's a source or a proof at the bench.",es:"El <b>porqué</b> — qué acelera y qué frena este fenómeno — aún no está vinculado a este experimento. Matter no lo inventa: lo añade cuando hay una fuente o una prueba en la mesa."})+'</p>';
    }

    // La bevanda per questo piatto — SOLO per i piatti (cucina con cibo dentro),
    // mai per i cocktail (già bevande). Riempita dopo, col fetch dell'abbinamento.
    h+='<div id="bevanda-slot"></div>';

    var dom=_L({it:'Dammi i passaggi e le dosi per «',en:'Give me the steps and the doses for «',es:'Dame los pasos y las dosis para «'})+(p.nome||ING)+'»';
    if(ob) dom+=_L({it:'. Obiettivo: ',en:'. Goal: ',es:'. Objetivo: '})+String(ob).replace(/[.\s]+$/,'');
    if(haNumeri) dom+=_L({it:'. Bersaglio: ',en:'. Target: ',es:'. Objetivo: '})+b.valore+(b.unita||'');
    dom+=_L({it:'. Spiega anche perché, passo per passo.',en:'. Explain the why too, step by step.',es:'. Explica también el porqué, paso a paso.'});
    h+='<div class="lab-cta-row"><a class="m-btn lab-block-btn" href="/chiedi-nuovo?q='+encodeURIComponent(dom)+'">'+_L({it:"Chiedi a Matter i passaggi e le dosi →",en:"Ask Matter for the steps and doses →",es:"Pide a Matter los pasos y las dosis →"})+'</a>';
    h+='<a class="m-ghost lab-block-btn" id="salva">'+_L({it:"Salva nel Quaderno e provalo al banco",en:"Save to the Notebook and try it at the bench",es:"Guarda en el Cuaderno y pruébalo en la mesa"})+'</a></div>';
    if(p.stato_epistemico) h+='<p class="muted-src">'+_L({it:"Stato: ",en:"Status: ",es:"Estado: "})+esc(p.stato_epistemico)+_L({it:". Matter non inventa: dove un dato manca, lo dice.",en:". Matter doesn't invent: where a value is missing, it says so.",es:". Matter no inventa: donde falta un dato, lo dice."})+'</p>';
    h+='</div>';
    el("vista-det").innerHTML=h; bindBack(); bindSalva(p, ob, b, fen);
    // "impara questo fenomeno" e attrezzi reali: ricollegati dentro l'esperimento dove servono.
    innestaImpara(p, fen);
    innestaAttrezzi(p, fen);
    // è un PIATTO? disciplina "cucina" + reagenti da cibo. I cocktail (disciplina "bar") sono già bevande: niente card.
    if((p.disciplina||"").toLowerCase()==="cucina" && reag.length){ innestaBevanda(p, reag); }
  }

  // "Impara questo fenomeno": link alla palestra (/impara), SOLO se il fenomeno ha
  // davvero una lezione nella sua disciplina (stesso dato che /impara usa per costruirle).
  // Niente link morti: se non c'è la lezione, lo slot resta vuoto.
  function innestaImpara(p, fen){
    var disc=((p&&p.disciplina)||"").toLowerCase().trim();
    if(!disc) return;
    if(!document.querySelector(".impara-slot")) return;  // nessun fenomeno con causalità/slug
    getJSON("/disciplina/"+encodeURIComponent(disc)).then(function(resp){
      if(!resp || resp.non_disponibile) return;
      var lez={};
      (resp.fenomeni||[]).forEach(function(f){
        if(f&&f.id) lez[f.id]=1;
        if(f&&Array.isArray(f.applicazioni)) f.applicazioni.forEach(function(a){ if(a&&a.id) lez[a.id]=1; });
      });
      (resp.casi||[]).forEach(function(c){ if(c&&c.id) lez[c.id]=1; });
      fen.forEach(function(ff){
        if(!ff || !ff.slug || !ff.causalita || !lez[ff.slug]) return;
        var sl=el("impara-slot-"+ff.slug); if(!sl) return;
        sl.innerHTML='<a class="impara-link" href="/impara">'+_L({it:"impara",en:"learn",es:"aprende"})+' '+esc(ff.nome||_L({it:"questo fenomeno",en:"this phenomenon",es:"este fenómeno"}))+' →</a>';
      });
    });
  }

  // Attrezzi reali: provo il dizionario tecniche (/v1/attrezzatura) con le parole-chiave
  // del nome + fenomeni. Il server fa il match (tadka, koji, shake, vapore-bao...). Mostro
  // SOLO i nomi come testo — MAI i link affiliati/Amazon (niente e-commerce finché OFF).
  // Se nessun attrezzo specifico matcha, resta l'euristica sull'unità del bersaglio.
  function innestaAttrezzi(p, fen){
    var parti=[(p&&p.nome)||""];
    (fen||[]).forEach(function(f){ if(f&&f.nome) parti.push(f.nome); });
    var blob=parti.join(" ").toLowerCase().replace(/\//g," ").replace(/\s+/g," ").trim();
    if(!blob) return;
    getJSON("/v1/attrezzatura/"+encodeURIComponent(blob)).then(function(resp){
      var lista=(resp&&Array.isArray(resp.attrezzatura))?resp.attrezzatura:[];
      var nomi=lista.map(function(a){ return (a&&a.nome)?String(a.nome):""; }).filter(Boolean);
      if(!nomi.length) return;  // nessun attrezzo specifico → resta l'euristica (o niente)
      var txt=nomi.slice(0,4).join(" · ");
      var st=el("serve-txt");
      if(st){ st.textContent=txt; return; }  // sostituisco l'euristica con gli attrezzi reali (solo testo)
      var riga='<div class="riga-s" id="serve-row"><div class="ic">🛠</div><div class="tt"><div class="t1">'+_L({it:"Ti serve",en:"You need",es:"Necesitas"})+'</div><div class="t2" id="serve-txt">'+esc(txt)+'</div></div></div>';
      var card=el("card-operativa");
      if(card){ card.insertAdjacentHTML("beforeend", riga); return; }
      var slot=el("bevanda-slot");
      if(slot) slot.insertAdjacentHTML("beforebegin", '<div class="lcard" id="card-operativa">'+riga+'</div>');
    });
  }

  // "La bevanda per questo piatto": abbinamento vino, mai link affiliati (flag e-commerce OFF).
  function innestaBevanda(p, reag){
    var slot=el("bevanda-slot"); if(!slot) return;
    var nomi=reag.map(function(x){ return (x&&x.nome)||x||""; }).filter(Boolean);
    var piatto=((p.nome||"")+" "+nomi.join(" ")).trim();
    if(!piatto) return;
    getJSON("/v1/vino-per-piatto?piatto="+encodeURIComponent(piatto)).then(function(resp){
      var sl=el("bevanda-slot"); if(!sl) return;
      var sugg=(resp&&Array.isArray(resp.suggerimenti))?resp.suggerimenti:[];
      var validi=sugg.filter(function(s){ return s&&Array.isArray(s.vini_consigliati)&&s.vini_consigliati.length; });
      if(!validi.length) return;  // niente abbinamento → niente card (vuoto onesto)
      var bh='<div class="lcard"><div class="lcard-t">'+_L({it:"La bevanda per questo piatto",en:"The drink for this dish",es:"La bebida para este plato"})+'</div>';
      validi.slice(0,2).forEach(function(s){
        bh+='<div class="bev-cat"><div class="bev-cat-nome">'+esc(s.categoria||"")+'</div>';
        if(s.descrizione) bh+='<div class="bev-cat-desc">'+esc(s.descrizione)+'</div>';
        bh+='<ul class="bev-vini">';
        s.vini_consigliati.slice(0,2).forEach(function(v){
          if(!v||!v.nome) return;
          bh+='<li><span class="bev-v-nome">'+esc(v.nome)+'</span>'+
              (v.territorio?'<span class="bev-v-terr"> · '+esc(v.territorio)+'</span>':'')+
              (v.perche?'<div class="bev-v-perche">'+esc(v.perche)+'</div>':'')+'</li>';
        });
        bh+='</ul></div>';
      });
      if(resp.nota) bh+='<div class="bev-nota">'+esc(resp.nota)+'</div>';
      bh+='</div>';
      sl.innerHTML=bh;
    });
  }
  function bindBack(){ var bk=el("bk"); if(bk) bk.addEventListener("click",function(){ _STATO.detId=null; el("vista-det").style.display="none"; el("vista-lista").style.display="block"; window.scrollTo(0,0); }); }

  // PREPARAZIONE: quando il nome cercato è un cocktail/piatto (es. 'Negroni'), mostra la RICETTA vera
  // invece del guscio-ingrediente vuoto. Dati dalla tabella ricette (/v1/preparazione), sola lettura.
  function renderPreparazione(prep){
    var h='<header class="lab-hero">';
    h+='<p class="lab-cat">'+_L({it:"preparazione",en:"preparation",es:"preparación"})+(prep.disciplina?(' · '+esc(prep.disciplina)):'')+'</p>';
    h+='<h1 class="lab-h1">'+esc(prep.nome||"")+'</h1>';
    h+='</header>';
    if(prep.descrizione) h+='<p class="lab-intro">'+esc(prep.descrizione)+'</p>';
    // IL PUNTO (punto critico): il cuore della preparazione
    if(prep.punto_critico) h+='<div class="lcard"><div class="lcard-t">'+_L({it:"Il punto",en:"The key point",es:"El punto"})+'</div><div style="font-size:15px;line-height:1.55;color:var(--ink)">'+esc(prep.punto_critico)+'</div></div>';
    // COSA CI VA (ingredienti con dosi)
    var ing = Array.isArray(prep.ingredienti) ? prep.ingredienti : [];
    if(ing.length){
      var ri = ing.map(function(x){
        var nm = esc((x && (x.nome||x.name)) || (typeof x==="string"?x:"") || "");
        if(!nm) return "";
        var q = (x && x.quantita!=null && String(x.quantita).length) ? esc(String(x.quantita))+(x.unita?(' '+esc(x.unita)):'') : '';
        return '<li><span class="rn">'+nm+'</span>'+(q?'<span class="rq">'+q+'</span>':'')+'</li>';
      }).join('');
      if(ri) h+='<div class="lcard"><div class="lcard-t">'+_L({it:"Cosa ci va",en:"What goes in",es:"Qué lleva"})+'</div><ul class="reag">'+ri+'</ul></div>';
    }
    // COME SI FA (procedimento)
    var proc = Array.isArray(prep.procedimento) ? prep.procedimento : (prep.procedimento?[prep.procedimento]:[]);
    if(proc.length){
      var pi = proc.map(function(s){ var t=(typeof s==="string")?s:(s&&(s.testo||s.step||s.descrizione||s.nome)||''); return t?'<li>'+esc(t)+'</li>':''; }).join('');
      if(pi) h+='<div class="lcard"><div class="lcard-t">'+_L({it:"Come si fa",en:"How it's made",es:"Cómo se hace"})+'</div><ol class="proc-list">'+pi+'</ol></div>';
    }
    // nota onesta sulla provenienza
    h+='<p class="prep-nota">'+_L({it:"Preparazione canonica. Chiedi a Matter per adattarla al tuo banco.",en:"Canonical preparation. Ask Matter to adapt it to your bench.",es:"Preparación canónica. Pide a Matter que la adapte a tu mesa."})+'</p>';
    var dom=_L({it:'Dammi i passaggi e le dosi per «',en:'Give me the steps and doses for «',es:'Dame los pasos y las dosis para «'})+(prep.nome||"")+'». '+_L({it:'Spiega anche perché, passo per passo.',en:'Explain the why too, step by step.',es:'Explica también el porqué, paso a paso.'});
    h+='<div class="lab-cta-row"><a class="m-btn lab-block-btn" href="/chiedi-nuovo?q='+encodeURIComponent(dom)+'">'+_L({it:"Chiedi a Matter i passaggi e le dosi →",en:"Ask Matter for the steps and doses →",es:"Pide a Matter los pasos y las dosis →"})+'</a></div>';
    el("vista-lista").innerHTML=h;
  }

  // ---------- AVVIO ----------
  getJSON("/v1/foto-ingrediente-nuovo/"+encodeURIComponent(ING)).then(function(f){ if(f&&f.url) FOTO=f; }, function(){}).then(function(){
  getJSON("/v1/ingrediente/"+encodeURIComponent(ING)).then(function(ingr){
    getJSON("/v1/composti/"+encodeURIComponent(ING)).then(function(comp){ COMPOSTI=comp; }, function(){}).then(function(){
    getJSON("/v1/profilo-gusto/"+encodeURIComponent(ING)).then(function(gusto){
      getJSON("/v1/ingrediente/"+encodeURIComponent(ING)+"/protocolli").then(function(prot){
        var esps=(prot&&prot.esperimenti)||[];
        Promise.all(esps.map(function(e){
          return getJSON("/v1/protocollo/"+encodeURIComponent(e.id)).then(function(d){ DETT[e.id]=d; });
        })).then(function(){
          _STATO.ingr=ingr; _STATO.gusto=gusto; _STATO.esps=esps; _STATO.detId=null;
          // Nessun esperimento: forse è una PREPARAZIONE (cocktail/piatto). Provo la ricetta vera.
          if(!esps.length){
            getJSON("/v1/preparazione/"+encodeURIComponent(ING)).then(function(prep){
              if(prep && prep.trovato && prep.match==="esatto"){ _STATO.prep=prep; renderPreparazione(prep); }
              else { renderLista(ingr, gusto, esps); }
            }, function(){ renderLista(ingr, gusto, esps); });
          } else {
            renderLista(ingr, gusto, esps);
          }
        });
      });
    });
    });
  });
  });
})();
</script>
</body>
</html>
