<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ ingrediente }} — Laboratorio — Matter Bench</title>
<link rel="stylesheet" href="/static/matter-v5.css">
<style>
  /* ---- intestazione ingrediente ---- */
  .lab-hero{padding:40px 0 0}
  .lab-cat{font-size:14px; color:var(--soft); margin:0 0 12px}
  .lab-h1{font-family:var(--display); font-weight:800; font-size:clamp(44px,11vw,88px); line-height:.92; letter-spacing:-.02em; margin:0; text-transform:capitalize}
  .lab-binom{font-family:var(--display); font-style:italic; font-weight:500; font-size:clamp(18px,3vw,24px); color:var(--soft); margin:10px 0 0}
  .lab-credit{font-size:11px; color:var(--faint); margin:8px 0 0}
  .lab-intro{font-size:16px; color:var(--soft); line-height:1.55; margin:22px 0 0; max-width:40em}
  .lab-intro a{font-weight:600; white-space:nowrap}

  /* ---- readout scuro (profilo sensoriale) — riusa .m-readout di matter-v5 ---- */
  .lab-readout{margin-top:30px}
  .lab-readout .m-leg-note{margin-top:14px}

  /* ---- sezioni ---- */
  .lab-sec{margin-top:40px; padding-top:30px; border-top:1px solid var(--rule)}
  .lab-sec h2{font-family:var(--display); font-weight:700; font-size:24px; letter-spacing:-.01em; margin:0}
  .lab-sec .sub{font-size:15px; color:var(--soft); margin:8px 0 0; max-width:40em; line-height:1.5}
  .lab-grp{font-size:12.5px; font-weight:600; letter-spacing:.02em; color:var(--verde); margin:24px 0 10px}
  .lab-grp.comp{color:var(--faint)}

  /* ---- card esperimento (cosa ci fai) ---- */
  .esp-list{display:grid; gap:10px}
  .esp-list[hidden]{display:none}
  .esp{display:grid; grid-template-columns:1fr auto; gap:4px 14px; width:100%; text-align:left; font:inherit; color:var(--ink);
    background:var(--panel); border:1px solid var(--rule); border-radius:13px; padding:16px 17px; cursor:pointer; transition:border-color .15s}
  .esp:hover{border-color:var(--verde)}
  .esp .nome{font-family:var(--display); font-weight:700; font-size:17px; line-height:1.15}
  .esp .ipo{grid-column:1/2; font-size:13px; color:var(--soft); line-height:1.4; margin-top:3px}
  .esp .bers{grid-row:1/2; grid-column:2/3; align-self:start; text-align:right; white-space:nowrap}
  .esp .bers .v{font-family:var(--display); font-weight:800; font-size:16px; color:var(--verde)}
  .esp .bers .vl{display:block; font-size:10px; color:var(--faint); margin-top:1px}
  .esp .tags{grid-column:1/3; display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
  .tag{font-size:11.5px; color:var(--soft); background:var(--paper); border:1px solid var(--rule); border-radius:999px; padding:3px 9px}
  .mostra-tutti{display:inline-block; margin:12px 0 0; padding:9px 15px; border:1px solid var(--rule); background:var(--panel);
    border-radius:999px; font:inherit; font-size:13.5px; font-weight:600; color:var(--verde); cursor:pointer}
  .mostra-tutti:hover{border-color:#c6c6b8}

  /* ---- vista dettaglio ---- */
  .lab-back{font-size:14px; color:var(--soft); font-weight:600; background:none; border:0; cursor:pointer; padding:10px 0; display:inline-flex; align-items:center; gap:6px}
  .lab-back:hover{color:var(--ink)}
  .lab-ah{font-family:var(--display); font-weight:800; font-size:clamp(30px,6vw,46px); line-height:1; letter-spacing:-.02em; margin:8px 0 0}
  .lab-ai{font-size:17px; color:var(--soft); margin:12px 0 0; line-height:1.5; max-width:38em}
  .lcard{background:var(--panel); border:1px solid var(--rule); border-radius:14px; padding:18px 18px; margin-top:14px}
  .lcard-t{font-family:var(--display); font-weight:700; font-size:13px; color:var(--verde); letter-spacing:.02em; margin:0 0 10px}
  .bers-big{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
  .bers-big .v{font-family:var(--display); font-weight:800; font-size:34px; color:var(--ink)}
  .bers-big .u{font-size:15px; color:var(--soft); font-weight:600}
  .bers-big .f{font-size:13px; color:var(--soft); margin-left:auto; text-align:right; max-width:55%}
  .causa{display:grid; gap:12px}
  .causa .riga{display:grid; grid-template-columns:70px 1fr; gap:12px; align-items:start}
  .causa .k{font-size:12px; font-weight:700; padding-top:2px}
  .causa .k.su{color:var(--verificato)} .causa .k.giu{color:var(--verde)}
  .causa ul{margin:0; padding-left:0; list-style:none; font-size:14px; color:var(--ink); line-height:1.5}
  .causa li{padding:1px 0}
  .impara-link{display:inline-block; margin-top:12px; font-size:13px; font-weight:600; color:var(--verde); text-decoration:none}
  .impara-link:hover{text-decoration:underline}
  .riga-s{display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--rule-2)}
  .riga-s:last-child{border-bottom:none}
  .riga-s .ic{width:30px; height:30px; flex:0 0 auto; border-radius:9px; background:var(--verde-tint); color:var(--verde); display:flex; align-items:center; justify-content:center; font-size:15px}
  .riga-s .tt{flex:1; min-width:0}
  .riga-s .t1{font-size:14px; font-weight:600; color:var(--ink)}
  .riga-s .t2{font-size:13.5px; color:var(--soft); margin-top:2px; line-height:1.45}
  .reag{list-style:none; margin:0; padding:0}
  .reag li{display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:9px 0; border-bottom:1px solid var(--rule-2); font-size:15px}
  .reag li:last-child{border-bottom:0}
  .reag .rq{color:var(--soft); font-variant-numeric:tabular-nums; white-space:nowrap; font-size:14px}
  .lab-block-btn{display:flex; width:100%; margin-top:16px}
  .lab-block-btn.m-ghost{margin-top:10px; justify-content:center}
  .lab-cta-row{margin-top:18px}
  .thin-nota{font-size:13px; color:var(--soft); margin:12px 0 0; line-height:1.5}
  .muted-src{font-size:12px; color:var(--faint); margin-top:12px; line-height:1.45}
  .vuoto{font-size:14.5px; color:var(--soft); line-height:1.55}
  .vuoto b{color:var(--ink)}
  .loading{font-size:14px; color:var(--soft); padding:40px 0; text-align:center}
  /* bevanda */
  .bev-cat{padding:12px 0; border-bottom:1px solid var(--rule-2)}
  .bev-cat:last-of-type{border-bottom:0}
  .bev-cat-nome{font-family:var(--display); font-weight:700; font-size:15px; color:var(--ink)}
  .bev-cat-desc{font-size:13px; color:var(--soft); margin-top:2px; line-height:1.4}
  .bev-vini{list-style:none; margin:8px 0 0; padding:0}
  .bev-vini li{padding:7px 0}
  .bev-v-nome{font-weight:600; font-size:14px; color:var(--ink)}
  .bev-v-terr{font-size:12.5px; color:var(--soft)}
  .bev-v-perche{font-size:13px; color:var(--soft); line-height:1.4; margin-top:2px}
  .bev-nota{font-size:12.5px; color:var(--soft); line-height:1.45; margin-top:10px; padding-top:10px; border-top:1px solid var(--rule-2)}
</style>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1E593C">
</head>
<body>

<div class="m-top">
  <a class="m-wm" href="/nuovo"><span>Matter</span><span class="b">Bench</span></a>
  <a class="m-back" href="/nuovo">← cerca</a>
</div>

<div class="m-wrap" id="wrap">
  <div id="vista-lista"><div class="loading">Apro il banco di lavoro…</div></div>
  <div id="vista-det" style="display:none"></div>
</div>

<script>
(function(){
  "use strict";
  var ING = {{ ingrediente|tojson }};
  var FIX = window.__FIX__ || null;   // gancio per test offline con dati reali
  var FOTO = (window.__FOTO__!==undefined)?window.__FOTO__:null;  // {url,credito,fonte} o null
  var DETT = {};                      // id -> protocollo dettaglio

  function getJSON(ep){
    if (FIX && FIX[ep] !== undefined) return Promise.resolve(FIX[ep]);
    return fetch(ep).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });
  }
  function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,function(c){return c==="&"?"&amp;":c==="<"?"&lt;":"&gt;";}); }
  function el(id){ return document.getElementById(id); }
  function cap(s){ s=String(s||""); return s.charAt(0).toUpperCase()+s.slice(1); }
  // Genere dell'articolo: femminile se finisce in -a o è un femminile comune in -e/-i;
  // altrimenti maschile. Copre il caso frequente (la cipolla/della cipolla) senza
  // pretendere un lessico completo: gli ambigui restano al maschile come prima.
  var _FEMM = {"carne":1,"senape":1,"noce":1,"noci":1,"salsa":1,"crème":1};
  function _art(nome){
    var n=(nome||"").toLowerCase().trim();
    var fem = /a$/.test(n) || _FEMM[n]===1;
    return fem ? {il:"La", del:"della"} : {il:"Il", del:"del"};
  }
  // identità per-dispositivo (stessa chiave di Banco/Quaderno/Scheda: Mirino e Memoria la condividono)
  function _uuid(){ if(window.crypto&&crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0,v=c=='x'?r:(r&0x3|0x8);return v.toString(16);}); }
  function _devId(){ try{ var d=localStorage.getItem('matter_device_id'); if(!d||!/^[0-9a-fA-F-]{36}$/.test(d)){d=_uuid();localStorage.setItem('matter_device_id',d);} return d; }catch(e){ if(!window._vid)window._vid=_uuid(); return window._vid; } }
  // CERCHIO OPERATIVO: #salva salva l'esperimento nel Quaderno (archivio unico /v1/quaderno2/salva)
  // e porta al Mirino col fenomeno precompilato. Salva SOLO ciò che l'esperimento ha davvero.
  function bindSalva(p, ob, b, fen){
    var btn=el("salva"); if(!btn) return;
    btn.addEventListener("click", function(e){
      if(e) e.preventDefault();
      if(btn.getAttribute("aria-disabled")==="true") return;
      var f0=(fen&&fen[0])||null;
      var fenNome=(f0&&f0.nome)||p.nome||ING;
      var record={
        porta:"laboratorio", funzione:"esperimento_lab", tipo:"esperimento",
        titolo: cap(ING)+" — "+(p.nome||"esperimento"),
        stato_input:{ ingrediente:ING, esperimento:p.nome||null, obiettivo:ob||null },
        stato_output:{ bersaglio:b||null, fenomeni:(fen||[]).map(function(x){return x&&x.nome;}).filter(Boolean) },
        provenienza:{ fonte:"laboratorio Matter", endpoint:"/v1/ingrediente/"+ING+"/protocolli" }
      };
      btn.setAttribute("aria-disabled","true"); btn.textContent="Salvo…";
      fetch("/v1/quaderno2/salva",{method:"POST",headers:{"Content-Type":"application/json","X-Device-Id":_devId()},body:JSON.stringify(record)})
        .then(function(r){ return r.json().catch(function(){return {};}).then(function(d){ return {ok:r.ok&&d&&d.ok}; }); })
        .then(function(res){
          if(res.ok){ btn.textContent="Salvato ✓ — vai al banco…"; location.href="/banco/profilo?fen="+encodeURIComponent(fenNome); }
          else { btn.removeAttribute("aria-disabled"); btn.textContent="Non salvato — riprova"; }
        })
        .catch(function(){ btn.removeAttribute("aria-disabled"); btn.textContent="Non salvato — rete assente · riprova"; });
    });
  }

  var ASSE_LABEL = {dolce:"dolce",salato:"salato",acido:"acido",amaro:"amaro",umami:"umami",grasso:"grasso",
    corposita:"corpo",aroma_fresco:"fresco–erbaceo",aroma_caldo:"caldo–speziato",piccante:"piccante",
    astringente:"astringente",croccante:"croccante",effervescenza:"effervescenza",fermentato:"fermentato",alcolico:"alcolico",termico:"termico"};
  function fonteBreve(meta){
    if(!meta) return null;
    var f=(meta.fonte||"").toUpperCase();
    if(f.indexOf("USDA")>=0) return {t:"USDA",stim:false};
    if(f.indexOf("CIQUAL")>=0) return {t:"CIQUAL",stim:false};
    if(f.indexOf("GLUTAMM")>=0||f.indexOf("FSANZ")>=0) return {t:"da glutammato",stim:false};
    if(f.indexOf("MARCATOR")>=0) return {t:"da marcatori",stim:false};
    if((meta.stato||"")==="stimato") return {t:"stima",stim:true};
    if((meta.stato||"")==="derivato") return {t:"derivato",stim:false};
    return null;
  }

  function radiceIng(nome){
    var n=(nome||"").toLowerCase().trim();
    return n.replace(/[oaei]$/,"");
  }
  // massa normalizzata a g/ml (confronto solo tra unità omogenee)
  function massaG(q,u){
    var n=parseFloat(String(q==null?"":q).replace(",","."));
    if(isNaN(n)) return null;
    u=(u||"").toLowerCase();
    if(u==="g"||u==="ml") return n;
    if(u==="kg"||u==="l") return n*1000;
    return null;
  }
  // RILEVANZA: l'ingrediente è PROTAGONISTA se è il reagente #1 per massa (g/ml).
  // Se nessuna massa confrontabile, fallback sul nome. Trasparente, v1.
  function eProtagonista(det, radice){
    if(!det) return false;
    var rg=det.reagenti||[];
    var masse=[];
    rg.forEach(function(r){ var m=massaG(r.quantita,r.unita); if(m!=null) masse.push({nome:(r.nome||"").toLowerCase(), m:m}); });
    if(!masse.length){
      return radice.length>=3 && (((det.nome||"")+" "+(det.ipotesi||"")).toLowerCase().indexOf(radice)>=0);
    }
    var maxM=0; masse.forEach(function(x){ if(x.m>maxM) maxM=x.m; });
    var ingM=0; masse.forEach(function(x){ if(x.nome.indexOf(radice)>=0 && x.m>ingM) ingM=x.m; });
    return ingM>0 && ingM>=maxM-0.0001;
  }
  function ricchezza(det){
    if(!det) return 0; var s=0; var b=det.bersaglio||{};
    if(b.valore) s+=2;
    var f=det.fenomeni||[]; if(f.length) s+=2; if(f[0]&&f[0].causalita) s+=2;
    if(det.variabile_critica) s+=1;
    return s;
  }

  // profilo sensoriale → readout scuro (riusa .m-readout di matter-v5).
  // Regola v5: strumento scuro SOLO dove c'è una lettura vera. Qui è il profilo di gusto.
  function readoutGusto(gusto){
    if(!gusto||!gusto.proprieta) return "";
    var pr=gusto.proprieta, meta=gusto.proprieta_meta||{};
    var assi=[]; for(var k in pr){ if(pr[k]!=null && pr[k]>0 && ASSE_LABEL[k]) assi.push(k); }
    if(!assi.length) return "";
    assi.sort(function(a,b){return parseFloat(pr[b])-parseFloat(pr[a]);});
    var der=[], sti=[];
    assi.forEach(function(k){ var fb=fonteBreve(meta[k]); (fb&&fb.stim || !fb ? sti : der).push(k); });
    function riga(k,est){
      var w=Math.max(0,Math.min(100,(parseFloat(String(pr[k]).replace(",","."))/10)*100));
      return '<div class="m-row'+(est?' est':'')+'"><span class="name">'+esc(ASSE_LABEL[k])+'</span>'+
        '<span class="m-track"><span class="m-fill'+(est?'':' d')+'" style="width:'+w+'%"></span></span>'+
        '<span class="m-val">'+esc(pr[k])+'</span></div>';
    }
    var h='<div class="lab-readout"><div class="m-readout">'+
      '<div class="m-ro-head"><div class="m-ro-title">Profilo sensoriale</div><div class="m-ro-scale">0 — 10</div></div>';
    if(der.length){ h+='<div class="m-ro-group"><div class="m-ro-grouplabel"><span class="mk derivato mk--sm"></span>Da fonte o calcolo</div>'+der.map(function(k){return riga(k,false);}).join('')+'</div>'; }
    if(sti.length){ h+='<div class="m-ro-group"><div class="m-ro-grouplabel"><span class="mk stimato mk--sm"></span>Stima del sistema</div>'+sti.map(function(k){return riga(k,true);}).join('')+'</div>'; }
    h+='<div class="m-legend"><span class="m-leg"><span class="mk derivato mk--sm"></span><b>Derivato</b></span>'+
       '<span class="m-leg"><span class="mk stimato mk--sm"></span><b>Stimato</b></span></div>';
    h+='</div><p class="m-leg-note">Ogni numero dice da dove viene. Dove non c\'è una misura, resta vuoto invece di essere inventato.</p></div>';
    return h;
  }

  // ---------- VISTA LISTA ----------
  function renderLista(ingr, gusto, esps){
    var h="";
    // ingrediente non reale (refuso o non presente in Matter): stato onesto, non un guscio finto
    var reale = ingr && !ingr.errore && (ingr.nome || ingr.categoria || (ingr.varieta&&ingr.varieta.length));
    if(!reale && (!esps || !esps.length)){
      h+='<header class="lab-hero"><h1 class="lab-h1">'+esc(ING)+'</h1></header>';
      h+='<div class="lcard" style="margin-top:24px"><div class="vuoto">Non ho <b>'+esc(ING)+'</b> nel laboratorio. Controlla il nome (anche un accento) o <a href="/nuovo">prova un altro ingrediente</a>. Se è un ingrediente vero che manca, scrivimelo in <a href="/chiedi-nuovo">chat</a>.</div></div>';
      el("vista-lista").innerHTML=h; return;
    }
    var nome=(ingr&&ingr.nome)||ING, cat=(ingr&&ingr.categoria)||"";
    var vLinea="";
    if(ingr&&ingr.varieta&&ingr.varieta.length){
      var v0=null; for(var i=0;i<ingr.varieta.length;i++){ if((ingr.varieta[i].caratteristica||"").length){v0=ingr.varieta[i];break;} }
      if(v0) vLinea=esc(v0.caratteristica);
    }
    h+='<header class="lab-hero">';
    if(cat) h+='<p class="lab-cat">'+esc(cat)+'</p>';
    h+='<h1 class="lab-h1">'+esc(nome)+'</h1>';
    if(vLinea) h+='<p class="lab-binom">'+vLinea+'</p>';
    h+='</header>';
    if((FOTO&&FOTO.url)&&FOTO.credito) h+='<p class="lab-credit">'+esc(FOTO.credito)+'</p>';
    h+='<p class="lab-intro">Questo è il banco di lavoro '+_art(nome).del+' '+esc((nome||"").toLowerCase())+': gli esperimenti in cui entra e, dentro ognuno, cosa controlli e perché succede. <a href="/chiedi-nuovo">Come funziona? Chiedi a Matter →</a></p>';

    // profilo sensoriale (readout scuro)
    h+=readoutGusto(gusto);

    h+='<section class="lab-sec"><h2>Cosa ci fai</h2>';
    if(!esps||!esps.length){ h+='<p class="sub">Nessun esperimento collegato ancora.</p></section>'; el("vista-lista").innerHTML=h; return; }
    h+='<p class="sub">Ogni preparazione è un esperimento, con il suo obiettivo e il suo numero da controllare.</p>';

    var radice=radiceIng(nome), prota=[], comp=[], cantiere=[];
    esps.forEach(function(e){
      var d=DETT[e.id]||{}; var fen=d.fenomeni||[];
      var pronto=!!(fen[0]&&fen[0].causalita);   // "pronto" = ha il perché (la causalità), il valore vero
      if(!pronto){ cantiere.push(e); return; }
      (eProtagonista(d,radice)?prota:comp).push(e);
    });
    function byRicc(a,b){ return ricchezza(DETT[b.id])-ricchezza(DETT[a.id]); }
    prota.sort(byRicc); comp.sort(byRicc); cantiere.sort(byRicc);

    function cardExp(e){
      var b=(e.bersaglio)||{};
      var bers="";
      if(b&&b.valore){
        // alcuni protocolli hanno gia' l'unita' dentro il valore ("almeno 3 ore"):
        // non raddoppiarla (era "almeno 3 oreore").
        var _u=(b.unita||'').trim();
        var _giaDentro=_u && String(b.valore).toLowerCase().trim().endsWith(_u.toLowerCase());
        var _piccola=(_u && _u.length<4 && !_giaDentro);
        var _lab=(_piccola || _giaDentro || !_u) ? 'bersaglio' : _u;
        bers='<span class="bers"><span class="v">'+esc(b.valore)+(_piccola?esc(_u):'')+'</span><span class="vl">'+esc(_lab)+'</span></span>';
      }
      else bers='<span class="bers"></span>';
      var ipo=(e.ipotesi||"").replace(/^Voglio ottenere\s+/i,"").replace(/^ottenere\s+/i,"");
      var tags=((e.fenomeni)||[]).slice(0,2).map(function(f){var n=(typeof f==="string")?f:(f&&f.nome);return n?'<span class="tag">'+esc(n)+'</span>':'';}).join('');
      return '<button class="esp" data-id="'+esc(e.id)+'"><span class="nome">'+esc(e.nome)+'</span>'+bers+
             (ipo?'<span class="ipo">'+esc(cap(ipo))+'</span>':'')+(tags?'<span class="tags">'+tags+'</span>':'')+'</button>';
    }
    function cardsHtml(list){ return list.map(cardExp).join(''); }
    function gruppo(tit,list,isComp){
      if(!list.length) return "";
      return '<div class="lab-grp'+(isComp?' comp':'')+'">'+esc(tit)+'</div><div class="esp-list">'+cardsHtml(list)+'</div>';
    }
    // Gerarchia: guida coi protagonisti (sempre aperti), richiudi la coda lunga.
    // Le card nascoste restano nel DOM (gia' cablate), si rivelano col bottone.
    function gruppoCollas(tit,list,isComp,iniz,gid){
      if(!list.length) return "";
      if(list.length<=iniz+1) return gruppo(tit,list,isComp); // se ne avanza 1 sola, mostrale tutte
      var testa=iniz>0?'<div class="esp-list">'+cardsHtml(list.slice(0,iniz))+'</div>':'';
      var resto=iniz>0?list.slice(iniz):list;
      return '<div class="lab-grp'+(isComp?' comp':'')+'">'+esc(tit)+'</div>'+testa
        +'<div class="esp-list esp-extra" id="'+gid+'" hidden>'+cardsHtml(resto)+'</div>'
        +'<button type="button" class="mostra-tutti" data-tgt="'+gid+'">'
        +'Mostra tutti ('+list.length+') →</button>';
    }
    h+=gruppo(_art(nome).il+" "+esc((nome||"").toLowerCase())+" è protagonista", prota, false);
    h+=gruppoCollas("Ci entra anche", comp, true, 3, 'g-comp');
    if(cantiere.length){
      h+='<div class="lab-grp comp">Ancora in costruzione</div>';
      h+='<p class="sub cantiere-nota">Questi esperimenti esistono ma non hanno ancora il perché collegato. Matter non li inventa: li completa quando c\'è una fonte o una prova al banco.</p>';
      h+='<div class="esp-list esp-extra" id="g-cant" hidden>'+cantiere.map(cardExp).join('')+'</div>';
      h+='<button type="button" class="mostra-tutti" data-tgt="g-cant">'
        +'Mostra gli esperimenti in costruzione ('+cantiere.length+') →</button>';
    }
    h+='</section>';
    el("vista-lista").innerHTML=h;
    Array.prototype.forEach.call(document.querySelectorAll(".esp"),function(btn){
      btn.addEventListener("click",function(){ apriEsperimento(btn.getAttribute("data-id")); });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".mostra-tutti"),function(btn){
      btn.addEventListener("click",function(){
        var t=document.getElementById(btn.getAttribute("data-tgt"));
        if(t) t.hidden=false;
        btn.remove();
      });
    });
  }

  // ---------- VISTA DETTAGLIO ----------
  function attrezzoPerBersaglio(b){
    var u=((b&&b.unita)||"").toLowerCase();
    if(u.indexOf("°c")>=0||u==="c") return "Termometro a sonda — per tenere la temperatura nella finestra giusta";
    if(u.indexOf("idrat")>=0) return "Bilancia — per calcolare l'idratazione in percentuale";
    if(u.indexOf("%")>=0) return "Bilancia di precisione — per pesare le proporzioni";
    if(u.indexOf("min")>=0) return "Timer — per rispettare i tempi";
    return null;
  }
  function apriEsperimento(id){
    el("vista-lista").style.display="none"; el("vista-det").style.display="block"; window.scrollTo(0,0);
    var p=DETT[id];
    var h='<div class="det"><button class="lab-back" id="bk">← torna agli esperimenti</button>';
    if(!p){ h+='<div class="vuoto" style="margin-top:14px">Esperimento non disponibile.</div></div>'; el("vista-det").innerHTML=h; bindBack(); return; }
    h+='<div class="lab-ah">'+esc(p.nome||"")+'</div>';
    var ob=p.cosa_voglio_ottenere||p.ipotesi||""; if(ob) h+='<div class="lab-ai">'+esc(ob)+'</div>';

    var b=p.bersaglio||{}; var fen=p.fenomeni||[]; var f0=fen[0];
    var haNumeri = !!(b&&b.valore), haCausa = fen.some(function(f){return f&&f.causalita;});

    if(haNumeri || f0){
      h+='<div class="lcard"><div class="lcard-t">Il bersaglio</div><div class="bers-big">';
      if(haNumeri){ var _u2=(b.unita||'').trim(); var _gia2=_u2 && String(b.valore).toLowerCase().trim().endsWith(_u2.toLowerCase()); h+='<span class="v">'+esc(b.valore)+'</span>'+(_u2&&!_gia2?'<span class="u">'+esc(_u2)+'</span>':''); }
      else h+='<span class="u">numero-bersaglio da fissare al banco</span>';
      if(f0&&f0.nome) h+='<span class="f">'+esc(f0.nome)+'</span>';
      h+='</div></div>';
    }

    // CARD "Cosa ci va" — i reagenti reali con le quantità (dato dell'esperimento, non inventato)
    var reag = Array.isArray(p.reagenti) ? p.reagenti : [];
    if(reag.length){
      var ri = reag.map(function(x){
        var nm = esc((x && x.nome) || x || "");
        if(!nm) return "";
        var q = (x && x.quantita!=null && String(x.quantita).length) ? esc(String(x.quantita))+(x.unita?(' '+esc(x.unita)):'') : '';
        return '<li><span class="rn">'+nm+'</span>'+(q?'<span class="rq">'+q+'</span>':'')+'</li>';
      }).join('');
      if(ri) h+='<div class="lcard"><div class="lcard-t">Cosa ci va</div><ul class="reag">'+ri+'</ul></div>';
    }

    // tutti i fenomeni che hanno una causalità (un esperimento può averne più d'uno)
    fen.forEach(function(ff){
      var c=ff&&ff.causalita; if(!c) return;
      h+='<div class="lcard"><div class="lcard-t">Perché accade — '+esc(ff.nome||"")+'</div><div class="causa">';
      if(c.acceleranti&&c.acceleranti.length) h+='<div class="riga"><div class="k su">accelera</div><ul>'+c.acceleranti.slice(0,4).map(function(x){return '<li>'+esc(x.fattore||"")+'</li>';}).join('')+'</ul></div>';
      if(c.rallentanti&&c.rallentanti.length) h+='<div class="riga"><div class="k giu">frena</div><ul>'+c.rallentanti.slice(0,4).map(function(x){return '<li>'+esc(x.fattore||"")+'</li>';}).join('')+'</ul></div>';
      h+='</div>';
      // slot per il link "impara questo fenomeno": riempito dopo, SOLO se la lezione esiste davvero
      if(ff.slug) h+='<span class="impara-slot" id="impara-slot-'+esc(ff.slug)+'"></span>';
      h+='</div>';
    });

    // card operativa: variabile / osservazione / correzione / attrezzo — solo righe con contenuto
    var righe="";
    if(p.variabile_critica) righe+='<div class="riga-s"><div class="ic">🎚</div><div class="tt"><div class="t1">La variabile da tenere d\'occhio</div><div class="t2">'+esc(p.variabile_critica)+'</div></div></div>';
    var sTxt = (typeof p.sensori==="string")?p.sensori:(Array.isArray(p.sensori)?p.sensori.map(function(s){return s.nome||s;}).join(", "):"");
    if(sTxt && sTxt.length>1) righe+='<div class="riga-s"><div class="ic">👁</div><div class="tt"><div class="t1">Come capisci se funziona</div><div class="t2">'+esc(sTxt)+'</div></div></div>';
    var err=p.errori||p.diagnosi;
    var eTxt=(typeof err==="string")?err:(Array.isArray(err)?err.map(function(x){return x.nome||x.descrizione||x;}).join("; "):"");
    if(eTxt && eTxt.length>1) righe+='<div class="riga-s"><div class="ic">🛟</div><div class="tt"><div class="t1">Se non viene</div><div class="t2">'+esc(eTxt.slice(0,220))+'</div></div></div>';
    var attr=attrezzoPerBersaglio(b);
    if(attr) righe+='<div class="riga-s" id="serve-row"><div class="ic">🛠</div><div class="tt"><div class="t1">Ti serve</div><div class="t2" id="serve-txt">'+esc(attr)+'</div></div></div>';
    if(righe) h+='<div class="lcard" id="card-operativa">'+righe+'</div>';

    if(!haNumeri && !haCausa && !righe){
      h+='<div class="lcard"><div class="vuoto">Questo esperimento ha l\'obiettivo ma non ancora i numeri e i fenomeni collegati. Matter non li inventa: li aggiunge quando c\'è una fonte o una prova al banco.</div></div>';
    } else if(!haCausa){
      h+='<p class="thin-nota">Il <b>perché</b> — cosa accelera e cosa frena questo fenomeno — non è ancora collegato a questo esperimento. Matter non lo inventa: lo aggiunge quando c\'è una fonte o una prova al banco.</p>';
    }

    // La bevanda per questo piatto — SOLO per i piatti (cucina con cibo dentro),
    // mai per i cocktail (già bevande). Riempita dopo, col fetch dell'abbinamento.
    h+='<div id="bevanda-slot"></div>';

    var dom='Dammi i passaggi e le dosi per «'+(p.nome||ING)+'»';
    if(ob) dom+='. Obiettivo: '+String(ob).replace(/[.\s]+$/,'');
    if(haNumeri) dom+='. Bersaglio: '+b.valore+(b.unita||'');
    dom+='. Spiega anche perché, passo per passo.';
    h+='<div class="lab-cta-row"><a class="m-btn lab-block-btn" href="/chiedi-nuovo?q='+encodeURIComponent(dom)+'">Chiedi a Matter i passaggi e le dosi →</a>';
    h+='<a class="m-ghost lab-block-btn" id="salva">Salva nel Quaderno e provalo al banco</a></div>';
    if(p.stato_epistemico) h+='<p class="muted-src">Stato: '+esc(p.stato_epistemico)+'. Matter non inventa: dove un dato manca, lo dice.</p>';
    h+='</div>';
    el("vista-det").innerHTML=h; bindBack(); bindSalva(p, ob, b, fen);
    // "impara questo fenomeno" e attrezzi reali: ricollegati dentro l'esperimento dove servono.
    innestaImpara(p, fen);
    innestaAttrezzi(p, fen);
    // è un PIATTO? disciplina "cucina" + reagenti da cibo. I cocktail (disciplina "bar") sono già bevande: niente card.
    if((p.disciplina||"").toLowerCase()==="cucina" && reag.length){ innestaBevanda(p, reag); }
  }

  // "Impara questo fenomeno": link alla palestra (/impara), SOLO se il fenomeno ha
  // davvero una lezione nella sua disciplina (stesso dato che /impara usa per costruirle).
  // Niente link morti: se non c'è la lezione, lo slot resta vuoto.
  function innestaImpara(p, fen){
    var disc=((p&&p.disciplina)||"").toLowerCase().trim();
    if(!disc) return;
    if(!document.querySelector(".impara-slot")) return;  // nessun fenomeno con causalità/slug
    getJSON("/disciplina/"+encodeURIComponent(disc)).then(function(resp){
      if(!resp || resp.non_disponibile) return;
      var lez={};
      (resp.fenomeni||[]).forEach(function(f){
        if(f&&f.id) lez[f.id]=1;
        if(f&&Array.isArray(f.applicazioni)) f.applicazioni.forEach(function(a){ if(a&&a.id) lez[a.id]=1; });
      });
      (resp.casi||[]).forEach(function(c){ if(c&&c.id) lez[c.id]=1; });
      fen.forEach(function(ff){
        if(!ff || !ff.slug || !ff.causalita || !lez[ff.slug]) return;
        var sl=el("impara-slot-"+ff.slug); if(!sl) return;
        sl.innerHTML='<a class="impara-link" href="/impara">impara '+esc(ff.nome||"questo fenomeno")+' →</a>';
      });
    });
  }

  // Attrezzi reali: provo il dizionario tecniche (/v1/attrezzatura) con le parole-chiave
  // del nome + fenomeni. Il server fa il match (tadka, koji, shake, vapore-bao...). Mostro
  // SOLO i nomi come testo — MAI i link affiliati/Amazon (niente e-commerce finché OFF).
  // Se nessun attrezzo specifico matcha, resta l'euristica sull'unità del bersaglio.
  function innestaAttrezzi(p, fen){
    var parti=[(p&&p.nome)||""];
    (fen||[]).forEach(function(f){ if(f&&f.nome) parti.push(f.nome); });
    var blob=parti.join(" ").toLowerCase().replace(/\//g," ").replace(/\s+/g," ").trim();
    if(!blob) return;
    getJSON("/v1/attrezzatura/"+encodeURIComponent(blob)).then(function(resp){
      var lista=(resp&&Array.isArray(resp.attrezzatura))?resp.attrezzatura:[];
      var nomi=lista.map(function(a){ return (a&&a.nome)?String(a.nome):""; }).filter(Boolean);
      if(!nomi.length) return;  // nessun attrezzo specifico → resta l'euristica (o niente)
      var txt=nomi.slice(0,4).join(" · ");
      var st=el("serve-txt");
      if(st){ st.textContent=txt; return; }  // sostituisco l'euristica con gli attrezzi reali (solo testo)
      var riga='<div class="riga-s" id="serve-row"><div class="ic">🛠</div><div class="tt"><div class="t1">Ti serve</div><div class="t2" id="serve-txt">'+esc(txt)+'</div></div></div>';
      var card=el("card-operativa");
      if(card){ card.insertAdjacentHTML("beforeend", riga); return; }
      var slot=el("bevanda-slot");
      if(slot) slot.insertAdjacentHTML("beforebegin", '<div class="lcard" id="card-operativa">'+riga+'</div>');
    });
  }

  // "La bevanda per questo piatto": abbinamento vino, mai link affiliati (flag e-commerce OFF).
  function innestaBevanda(p, reag){
    var slot=el("bevanda-slot"); if(!slot) return;
    var nomi=reag.map(function(x){ return (x&&x.nome)||x||""; }).filter(Boolean);
    var piatto=((p.nome||"")+" "+nomi.join(" ")).trim();
    if(!piatto) return;
    getJSON("/v1/vino-per-piatto?piatto="+encodeURIComponent(piatto)).then(function(resp){
      var sl=el("bevanda-slot"); if(!sl) return;
      var sugg=(resp&&Array.isArray(resp.suggerimenti))?resp.suggerimenti:[];
      var validi=sugg.filter(function(s){ return s&&Array.isArray(s.vini_consigliati)&&s.vini_consigliati.length; });
      if(!validi.length) return;  // niente abbinamento → niente card (vuoto onesto)
      var bh='<div class="lcard"><div class="lcard-t">La bevanda per questo piatto</div>';
      validi.slice(0,2).forEach(function(s){
        bh+='<div class="bev-cat"><div class="bev-cat-nome">'+esc(s.categoria||"")+'</div>';
        if(s.descrizione) bh+='<div class="bev-cat-desc">'+esc(s.descrizione)+'</div>';
        bh+='<ul class="bev-vini">';
        s.vini_consigliati.slice(0,2).forEach(function(v){
          if(!v||!v.nome) return;
          bh+='<li><span class="bev-v-nome">'+esc(v.nome)+'</span>'+
              (v.territorio?'<span class="bev-v-terr"> · '+esc(v.territorio)+'</span>':'')+
              (v.perche?'<div class="bev-v-perche">'+esc(v.perche)+'</div>':'')+'</li>';
        });
        bh+='</ul></div>';
      });
      if(resp.nota) bh+='<div class="bev-nota">'+esc(resp.nota)+'</div>';
      bh+='</div>';
      sl.innerHTML=bh;
    });
  }
  function bindBack(){ var bk=el("bk"); if(bk) bk.addEventListener("click",function(){ el("vista-det").style.display="none"; el("vista-lista").style.display="block"; window.scrollTo(0,0); }); }

  // ---------- AVVIO ----------
  getJSON("/v1/foto-ingrediente-nuovo/"+encodeURIComponent(ING)).then(function(f){ if(f&&f.url) FOTO=f; }, function(){}).then(function(){
  getJSON("/v1/ingrediente/"+encodeURIComponent(ING)).then(function(ingr){
    getJSON("/v1/profilo-gusto/"+encodeURIComponent(ING)).then(function(gusto){
      getJSON("/v1/ingrediente/"+encodeURIComponent(ING)+"/protocolli").then(function(prot){
        var esps=(prot&&prot.esperimenti)||[];
        Promise.all(esps.map(function(e){
          return getJSON("/v1/protocollo/"+encodeURIComponent(e.id)).then(function(d){ DETT[e.id]=d; });
        })).then(function(){ renderLista(ingr, gusto, esps); });
      });
    });
  });
  });
})();
</script>
</body>
</html>
