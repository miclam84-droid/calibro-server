<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#1E593C"/>
  <!-- bonds del grafo -->
  <g stroke="#BDA46A" stroke-width="26" stroke-linecap="round">
    <line x1="256" y1="256" x2="150" y2="156"/>
    <line x1="256" y1="256" x2="368" y2="160"/>
    <line x1="256" y1="256" x2="238" y2="392"/>
  </g>
  <!-- nodi periferici (fenomeni) -->
  <circle cx="150" cy="156" r="30" fill="#BDA46A"/>
  <circle cx="368" cy="160" r="30" fill="#BDA46A"/>
  <circle cx="238" cy="392" r="30" fill="#BDA46A"/>
  <!-- BERSAGLIO centrale: cerchio crema + anello rame + centro rame (il numero-bersaglio) -->
  <circle cx="256" cy="256" r="78" fill="#EEF0EA"/>
  <circle cx="256" cy="256" r="52" fill="none" stroke="#C2703D" stroke-width="16"/>
  <circle cx="256" cy="256" r="20" fill="#C2703D"/>
</svg>
